.hb-type { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; font-weight: 800; color: var(--text-strong); }
.hb-tc { display: grid; place-items: center; flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #ffffff; font-size: 12px; line-height: 1; box-shadow: 0 1px 3px var(--shadow-strong); }
.hb-wild { margin-top: 6px; padding: 6px 10px; border-radius: 10px; background: var(--hint-bg); color: var(--hint-fg); font-size: 13px; font-weight: 800; }

/* 볼 아이콘 */
.bb-ico, .bb-big { --bc: #ef4444; position: relative; display: inline-block; flex: 0 0 auto; width: 13px; height: 13px; border-radius: 50%; border: 1.6px solid #0f172a; background: linear-gradient(to bottom, var(--bc) 0 44%, #0f172a 44% 56%, #ffffff 56%); vertical-align: -2px; margin-right: 2px; }
.bb-ico.b-great, .bb-big.b-great, .bc-ball.b-great .bb-ico { --bc: #3b82f6; }
.bb-ico.b-ultra, .bb-big.b-ultra, .bc-ball.b-ultra .bb-ico { background: linear-gradient(to bottom, #1f2937 0 16%, #facc15 16% 27%, #1f2937 27% 44%, #0f172a 44% 56%, #ffffff 56%); }
.bb-big { width: 34px; height: 34px; border-width: 2.5px; margin: 0; }
.bb-big::after, .bc-ball .bb-ico::after { content: ""; position: absolute; left: 50%; top: 50%; width: 34%; height: 34%; transform: translate(-50%, -50%); border-radius: 50%; background: #ffffff; border: 2px solid #0f172a; }
.bt-ball.b-great { background: linear-gradient(to bottom, #3b82f6 0 45%, #0f172a 45% 56%, #ffffff 56%); }
.bt-ball.b-ultra { background: linear-gradient(to bottom, #1f2937 0 15%, #facc15 15% 27%, #1f2937 27% 45%, #0f172a 45% 56%, #ffffff 56%); }
.bag { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; }
.bag-b { white-space: nowrap; }

/* 배틀 전 카드: 상대 · 관장님 팀 · 내 팀 고르기 */
.foe-card { display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 10px; padding: 8px 10px; border-radius: 16px; background: var(--surface-2); border: 2px solid var(--border); }
.foe-card .vis { height: 104px; margin: 0; }
.foe-card .poke-img { height: 96px; }
.fc-txt { display: grid; gap: 3px; min-width: 0; justify-items: start; }
.fc-label { font-size: 11.5px; font-weight: 800; color: var(--muted); }
.fc-txt b { font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 1.2; color: var(--text-strong); }
.fc-txt small { font-size: 12.5px; font-weight: 800; color: var(--muted-2); font-variant-numeric: tabular-nums; }
.type-chip { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px; border-radius: 999px; background: var(--tc); color: #ffffff; font-size: 11.5px; font-weight: 800; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25); }
.boss-team { display: grid; gap: 6px; padding: 10px; border-radius: 16px; background: var(--surface-2); border: 2px solid var(--border); }
.bt-who { font-size: 13px; font-weight: 800; color: var(--text-strong); }
.bt-row { display: flex; gap: 8px; overflow-x: auto; }
.bt-one { display: grid; justify-items: center; gap: 2px; min-width: 76px; text-align: center; }
.bt-one .mini-em { width: 52px; height: 52px; }
.bt-one b { font-size: 12.5px; line-height: 1.2; color: var(--text-strong); }
.bt-one small { font-size: 11px; font-weight: 800; color: var(--muted); }
.team-pick { display: grid; gap: 8px; padding: 10px; border-radius: 16px; border: 2px solid var(--warn-bd); background: var(--warn-bg); }
.tp-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 8px; }
.tp-head b { font-size: 14.5px; color: var(--text-strong); }
.tp-head small { font-size: 11.5px; font-weight: 700; color: var(--muted-2); }
.tp-slots { display: flex; align-items: center; gap: 8px; }
.tp-slot { position: relative; display: grid; place-items: center; width: 52px; height: 52px; padding: 0; border: 2.5px solid var(--primary); border-radius: 50%; background: var(--surface); }
.tp-slot .mini-em { width: 44px; height: 44px; border-width: 0; box-shadow: none; }
.tp-slot b { position: absolute; right: -4px; top: -4px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); color: #ffffff; font-size: 11.5px; line-height: 1; }
.tp-slot.empty { border-style: dashed; border-color: var(--border-strong); color: var(--muted); font-weight: 800; font-size: 16px; }
.tp-auto { margin-left: auto; }
.tp-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; max-height: 236px; overflow-y: auto; padding: 2px; overscroll-behavior: contain; }
.tp-mon { position: relative; display: grid; grid-template-columns: 42px minmax(0, 1fr); align-items: center; gap: 7px; min-height: 58px; padding: 6px 8px; border: 2px solid var(--border); border-radius: 14px; background: var(--surface); text-align: left; }
.tp-mon.on { border-color: var(--primary); background: var(--tp-on); box-shadow: 0 0 0 2px var(--primary-glow); }
.tp-txt { display: grid; gap: 1px; min-width: 0; }
.tp-txt b { font-size: 13.5px; line-height: 1.2; color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tp-txt small { font-size: 11px; font-weight: 800; color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.tp-tag { justify-self: start; padding: 0 6px; border-radius: 999px; font-size: 10.5px; font-weight: 800; }
.tp-tag.good { background: var(--good-bg); color: var(--good-fg); }
.tp-tag.bad { background: var(--bad-bg); color: var(--bad-fg); }
.tp-no { position: absolute; left: -5px; top: -5px; z-index: 1; display: grid; place-items: center; width: 21px; height: 21px; border-radius: 50%; background: var(--primary); color: #ffffff; font-size: 12px; font-weight: 900; line-height: 1; box-shadow: 0 0 0 2px var(--surface); }

/* 볼 가게 */
.ball-list { display: grid; gap: 8px; }
.ball-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px; border: 2px solid var(--border); border-radius: 14px; background: var(--surface-2); }
.ball-row.lock { opacity: 0.6; }
.br-mid { display: grid; gap: 2px; min-width: 0; }
.br-mid b { font-size: 14px; color: var(--text-strong); }
.br-mid b small { font-size: 11.5px; color: var(--muted); }
.br-mid > small { font-size: 11.5px; font-weight: 700; color: var(--muted-2); }
.br-btns { display: flex; gap: 6px; }
.br-btns .btn-small { display: grid; justify-items: center; gap: 0; min-width: 62px; padding: 4px 8px; line-height: 1.2; }
.br-btns .btn-small small { font-size: 10.5px; font-weight: 800; opacity: 0.85; }

/* 도감: 공격 · 체력 · 경험치 */
.mon-stat2 { display: flex; justify-content: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--text-strong); font-variant-numeric: tabular-nums; }
.mon-xp { height: 7px; margin: 3px 6px 0; border-radius: 999px; background: var(--xp-bg); overflow: hidden; }
.mon-xp i { display: block; height: 100%; border-radius: 999px; background: var(--xp); }
.mon-xp-t { font-size: 10.5px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }

/* 배틀 화면 더하기: 정보 상자 · 명령 · 끝 화면 (게임기 화면 느낌, 밝은 색 하나로 고정) */
.bt-top button.on { background: #facc15; border-color: #facc15; color: #0f172a; }
.bt-top .bt-auto { margin-left: 0; }
.bt-info { padding: 5px 9px 6px; }
.bt-name small { color: #334155; }
.bt-sub { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 3px; }
.bt-hpn { font-size: 11.5px; font-weight: 900; color: #0f172a; font-variant-numeric: tabular-nums; }
.bt-dots { display: inline-flex; gap: 3px; }
.bt-dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #0f172a; background: linear-gradient(to bottom, #ef4444 0 45%, #0f172a 45% 56%, #ffffff 56%); }
.bt-dots i.cur { box-shadow: 0 0 0 2px #facc15; }
.bt-dots i.out { background: #cbd5e1; border-color: #94a3b8; }
.bt-xp { height: 5px; margin-top: 4px; border-radius: 999px; background: #dbeafe; overflow: hidden; }
.bt-xp i { display: block; height: 100%; width: 0; background: #3b82f6; }
.bt-dmg { position: absolute; left: 0; top: 0; padding: 0 6px; border-radius: 8px; background: rgba(255, 255, 255, 0.92); color: #dc2626; font-family: var(--font-display); font-size: 22px; line-height: 1.2; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.25); }
.bt-dmg.crit { color: #ffffff; background: #dc2626; font-size: 26px; }
.bt-text { min-height: 64px; padding: 10px 34px 10px 14px; font-size: 18px; }
.bt-text.end .bt-next { display: none; }
.bt-cmd { display: grid; gap: 8px; padding: 10px; border-top: 4px solid #0f172a; background: #f8fafc; color: #0f172a; }
.bt-cmd .btn { background: #ffffff; color: #0f172a; border-color: #cbd5e1; }
.bt-cmd .btn:disabled { opacity: 0.45; }
.bc-atk { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: center; gap: 10px; min-height: 64px; padding: 8px 14px; border: 3px solid #0f172a; border-radius: 16px; background: linear-gradient(135deg, #ffffff, #fee2e2); color: #0f172a; text-align: left; box-shadow: 0 4px 0 #0f172a; }
.bc-atk:active { transform: translateY(3px); box-shadow: 0 1px 0 #0f172a; }
.ba-ico { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: #0f172a; font-size: 24px; }
.bc-atk b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 1.2; }
.bc-atk small { display: block; font-size: 12px; font-weight: 800; color: #475569; }
.bc-balls { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 6px; }
.bc-ball { display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; gap: 7px; min-height: 50px; padding: 6px 10px; border: 2.5px solid #0f172a; border-radius: 14px; background: #ffffff; color: #0f172a; text-align: left; }
.bc-ball .bb-ico { width: 22px; height: 22px; border-width: 2px; margin: 0; }
.bc-ball b { display: block; font-size: 13.5px; line-height: 1.2; }
.bc-ball small { display: block; font-size: 11.5px; font-weight: 800; color: #b45309; }
.bc-ball:disabled { opacity: 0.45; }
.bc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bc-row .btn { min-height: 46px; }
.bc-hint { padding: 7px 10px; border-radius: 12px; background: #fef9c3; color: #854d0e; font-size: 13px; font-weight: 800; line-height: 1.4; animation: hintGlow 1.2s ease-in-out infinite alternate; }
.bc-hint.soft { animation: none; background: #eef2ff; color: #3730a3; font-weight: 700; }
@keyframes hintGlow { from { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.0); } to { box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.35); } }
.bc-title { font-size: 14px; font-weight: 800; }
.bc-title small { display: block; font-size: 11.5px; color: #64748b; }
.bc-list { display: grid; gap: 6px; }
.bc-mon { display: grid; grid-template-columns: 42px minmax(0, 1fr); align-items: center; gap: 8px; min-height: 54px; padding: 5px 10px; border: 2.5px solid #0f172a; border-radius: 14px; background: #ffffff; color: #0f172a; text-align: left; }
.bc-mon:disabled { opacity: 0.5; }
.bc-mon.cur { border-color: #facc15; }
.bc-mon b { display: block; font-size: 14px; }
.bc-mon small { display: block; font-size: 11.5px; font-weight: 800; color: #475569; }
.bc-back { min-height: 42px; }
.bt-end { display: grid; gap: 8px; text-align: center; }
.be-title { font-family: var(--font-display); font-size: 22px; line-height: 1.25; color: #0f172a; text-wrap: balance; }
.be-caught { display: grid; place-items: center; }
.be-caught .vis.sm { height: 72px; }
.be-caught .poke-img { height: 68px; }
.be-body { font-size: 13.5px; font-weight: 700; line-height: 1.55; color: #334155; white-space: pre-line; text-align: left; }
.be-gains { display: grid; gap: 6px; text-align: left; }
.be-mon { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 12px; background: #ffffff; border: 2px solid #e2e8f0; }
.be-mid { min-width: 0; }
.be-mid b { display: block; font-size: 13.5px; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.be-mid b small { font-size: 11.5px; color: #2563eb; }
.be-xp { height: 6px; margin-top: 3px; border-radius: 999px; background: #dbeafe; overflow: hidden; }
.be-xp i { display: block; height: 100%; background: #3b82f6; }
.be-plus { font-size: 12.5px; font-weight: 900; color: #2563eb; white-space: nowrap; }
.be-ok { min-height: 52px; }
/* 다시 열었을 때 결과 카드 (테마 색을 따라가요) */
.sheet-body .bt-end .be-title { color: var(--text-strong); }
.sheet-body .bt-end .be-body { color: var(--text); }
.sheet-body .bt-end .be-mon { background: var(--surface-2); border-color: var(--border); }
.sheet-body .bt-end .be-mid b { color: var(--text-strong); }

/* 초안 표시 · 시험용 버튼 */
.draft-chip { display: inline-block; margin-left: 4px; padding: 1px 8px; border-radius: 999px; background: #facc15; color: #0f172a; font-family: var(--font-body); font-size: 11px; font-weight: 900; vertical-align: 3px; }
.dev-btns { display: flex; flex-wrap: wrap; gap: 6px; }

.bt-text.ask .bt-next { display: none; }
.tp-txt small .tp-tag { margin-left: 2px; }
.draft-chip { margin: 0 4px 0 0; vertical-align: 4px; }

/* =========================================================
   v3.4 · 내 주식 성적: 지갑 띠 아래 줄 · 성적표
   ========================================================= */
:root {
  --ws-up: #fca5a5;
  --ws-down: #93c5fd;
  --ws-earn: #fde68a;
}
/* 성적표 */
.report-card { display: grid; gap: 10px; }
.rp-hero { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.rp-cell { display: grid; gap: 2px; min-width: 0; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); border: 2px solid var(--border); }
.rp-l { font-size: 12px; font-weight: 800; color: var(--muted-2); }
.rp-big { font-family: var(--font-display); font-size: 30px; line-height: 1.15; color: var(--text-strong); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rp-big small { margin-left: 2px; font-family: var(--font-body); font-size: 14px; font-weight: 800; }
.rp-big.up { color: var(--up); }
.rp-big.down { color: var(--down); }
.rp-big.earn { color: var(--gold-fg); }
.rp-big.earn.down { color: var(--down); }
.rp-s { font-size: 12px; font-weight: 700; color: var(--muted); }
.rp-line { padding: 8px 12px; border-radius: 12px; background: var(--chip-bg); font-size: 13px; font-weight: 700; color: var(--muted-2); font-variant-numeric: tabular-nums; }
.rp-line b { color: var(--text-strong); }
.rp-list { display: grid; gap: 6px; }
.rp-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 48px; padding: 6px 10px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); text-align: left; font-variant-numeric: tabular-nums; }
.rp-co { min-width: 0; font-size: 13.5px; font-weight: 800; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rp-co small { font-size: 11.5px; color: var(--muted); }
.rp-pr { min-width: 0; font-size: 12px; font-weight: 700; color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rp-r { display: grid; justify-items: end; line-height: 1.2; }
.rp-r b { font-size: 15px; }
.rp-r small { font-size: 11px; font-weight: 800; }
.rp-r.up { color: var(--up); }
.rp-r.down { color: var(--down); }
.rp-r.same { color: var(--muted); }
.rp-next { display: grid; gap: 4px; padding: 10px 12px; border-radius: 14px; border: 2px dashed var(--border-strong); }
.rp-next-t { font-size: 13.5px; font-weight: 800; color: var(--text-strong); }
.rp-next .banner { margin-top: 4px; }
.txt-up { color: var(--up); }
.txt-down { color: var(--down); }

/* =========================================================
   v3.5 · 한 화면 (스크롤 없이) · 진화 고르기 · 상성 표시
   위 지갑 띠 → 가운데 화면 → 아래 탭 4개. 탭 안은 작은 탭으로 나누고, 칸이 많으면 ◀ ▶ 쪽 넘기기
   ========================================================= */
:root {
  --nav-bg: rgba(255, 255, 255, 0.97);
  --evo-1: #fde047; --evo-2: #a855f7; --evo-3: #38bdf8;
  --mk-good: #16a34a; --mk-bad: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --nav-bg: rgba(19, 28, 46, 0.97); --mk-good: #15803d; --mk-bad: #b91c1c; }
}
:root[data-theme="dark"] { --nav-bg: rgba(19, 28, 46, 0.97); --mk-good: #15803d; --mk-bad: #b91c1c; }

html, body { height: 100%; }
body { overflow: hidden; overscroll-behavior: none; }
body::after { content: ""; position: fixed; inset: auto 0 0; height: env(safe-area-inset-bottom, 0px); z-index: 90; background: var(--nav-bg); }
.app {
  display: flex; flex-direction: column;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}

/* ── 위: 지갑 띠 (현금 · 내 주식 + 수익률 · 번 돈 + 다음 단계 막대 · 배지) ── */
.top-wallet { position: relative; top: auto; flex: none; }
.wallet-inner { max-width: 1100px; padding-block: 6px 8px; }
.wallet-header { gap: 8px; margin-bottom: 6px; }
.wallet-title { flex: 1 1 auto; font-size: 18px; }
.who-chip { flex: 0 1 auto; min-width: 0; margin: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.icon-btn { width: 34px; height: 34px; border-radius: 11px; font-size: 17px; }
.day-badge { padding: 3px 9px; }
.wallet-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.w-box { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-height: 54px; padding: 4px 3px 6px; border: 1.5px solid transparent; }
.w-btn { font: inherit; color: var(--wallet-fg); border-color: rgba(255, 255, 255, 0.16); cursor: pointer; }
.w-btn:active { transform: scale(0.97); }
.w-label { max-width: 100%; font-size: 10.5px; line-height: 1.3; }
.w-val { font-size: clamp(14px, 4.3vw, 20px); }
.w-val.earn { color: var(--ws-earn); }
.w-val.earn.down { color: var(--ws-down); }
.w-sub { display: block; max-width: 100%; margin-top: 1px; font-size: 10.5px; font-weight: 800; line-height: 1.35; color: var(--wallet-label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-sub.ret { padding: 0 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); color: #ffffff; font-size: 12px; font-weight: 900; }
.w-sub.ret.up { background: #dc2626; }
.w-sub.ret.down { background: #2563eb; }
.w-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255, 255, 255, 0.12); }
.w-bar i { display: block; height: 100%; width: 0; background: var(--ws-earn); transition: width 0.6s ease; }
.w-box.bump .w-val { animation: bump 0.45s ease; }

/* ── 가운데 화면 · 아래 탭 ── */
.container { position: relative; flex: 1 1 auto; min-height: 0; max-width: none; margin: 0; padding: 0; }
.tab-panel { position: absolute; inset: 0; display: flex; flex-direction: column; }
.tabs {
  flex: none; position: relative; z-index: 95;
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 0;
  padding-block: 5px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--nav-bg); border-top: 1.5px solid var(--border); box-shadow: 0 -4px 16px var(--shadow);
}
.tab-btn { min-height: 50px; gap: 1px; border: none; border-radius: 14px; background: transparent; font-size: 13.5px; }
.tab-btn.active { transform: none; background: var(--primary); color: var(--on-accent); box-shadow: 0 3px 10px var(--primary-glow); }
.tab-ico { font-size: 21px; }
.tab-dot.evo { background: var(--evo-2); }
.tab-btn.active .tab-dot.evo { background: #ffffff; }

/* 탭 안의 작은 탭 */
.seg {
  flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px;
  width: 100%; max-width: 1100px; margin: 0 auto;
  padding-top: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.seg-tab { position: relative; min-width: 0; min-height: 40px; padding: 3px 2px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--muted-2); font-family: var(--font-display); font-size: 14px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg-tab.on { background: var(--text-strong); border-color: var(--text-strong); color: var(--surface); }
.seg-dot { position: absolute; top: 4px; right: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--evo-2); box-shadow: 0 0 0 2px var(--surface); }
.panes { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; max-width: 1100px; margin: 0 auto; }
.pane {
  position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px;
  padding-block: 8px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin;
}
.pane > .card { flex: none; padding: 12px; }
.pane-head { flex: none; display: flex; align-items: center; gap: 8px; min-width: 0; }
.pane-head .caption { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-evo { background: linear-gradient(135deg, var(--evo-1), #f0abfc); color: #4c1d95; }

/* 쪽 넘기기 칸 · ◀ 1/3 ▶ */
.grid-fit { flex: 1 1 auto; min-height: 0; display: grid; gap: 8px; overflow: hidden; touch-action: pan-y; }
.grid-empty { grid-column: 1 / -1; grid-row: 1 / -1; display: grid; place-items: center; padding: 12px; text-align: center; color: var(--muted); font-size: 13.5px; font-weight: 700; }
.pager { flex: none; display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 40px; }
.pg-btn { width: 54px; height: 38px; padding: 0; border: 2px solid var(--border-strong); border-radius: 12px; background: var(--surface); color: var(--text-strong); font-size: 16px; }
.pg-btn:disabled { opacity: 0.3; cursor: default; }
.pg-btn:not(:disabled):active { transform: scale(0.94); }
.pg-mid { display: grid; justify-items: center; gap: 3px; min-width: 76px; }
.pg-dots { display: flex; gap: 5px; }
.pg-dots i { width: 7px; height: 7px; border-radius: 4px; background: var(--border-strong); transition: width 0.2s; }
.pg-dots i.on { width: 16px; background: var(--primary); }
.pg-txt { font-size: 11.5px; font-weight: 800; color: var(--muted); }
.pg-txt b { color: var(--text-strong); }

/* ── 말판: 지도가 가운데 화면을 꽉 채워요 ── */
.stage-wrap { position: absolute; inset: 0; height: auto; margin: 0; border: 0; border-radius: 0; }
@media (min-width: 860px) { .stage-wrap { margin: 0; border: 0; border-radius: 0; } }
.hud-top { gap: 5px; padding-top: 6px; }
#hud-news:empty { display: none; }
.hud-news { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 32px; padding: 3px 10px 3px 4px; border: 2px solid var(--hud-line); border-radius: 999px; background: var(--hud-panel); color: var(--text-strong); font-size: 12.5px; font-weight: 800; text-align: left; box-shadow: 0 2px 8px var(--shadow-strong); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.hn-tag { flex: none; padding: 2px 8px; border-radius: 999px; background: var(--good-bg); color: var(--good-fg); font-size: 11.5px; }
.hud-news.bad .hn-tag { background: var(--bad-bg); color: var(--bad-fg); }
.hn-t { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-news b { flex: none; color: var(--up); }
.hud-news.bad b { color: var(--down); }
.hn-more { flex: none; padding: 0 6px; border-radius: 999px; background: var(--chip-bg); color: var(--chip-fg); font-size: 11px; }
.hud-chips { flex-wrap: wrap; overflow: visible; gap: 5px; }
.hud-chips .chip { font-family: var(--font-body); }
button.chip { border: none; cursor: pointer; }
.hud-chips .chip-evo { background: linear-gradient(135deg, var(--evo-1), #f0abfc); color: #4c1d95; }
.hud-chips .chip-hot { background: var(--bad-bg); color: var(--bad-fg); }
.hud-chips .chip-night { background: #312e81; color: #ffffff; }
.chip.pulse { animation: chipPulse 1.4s ease-in-out infinite; }
@keyframes chipPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0), 0 1px 4px var(--shadow-strong); } 50% { box-shadow: 0 0 0 5px rgba(168, 85, 247, 0.28), 0 1px 4px var(--shadow-strong); } }
.hud-tools { grid-template-columns: repeat(2, 42px); gap: 6px; bottom: calc(var(--rb-h, 80px) + 16px); }
.hud-btn { width: 42px; height: 42px; font-size: 17px; }
.hud-btn small { font-size: 8.5px; }
.starter-ov { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 16px; background: var(--scrim); }
.starter-card { width: min(100%, 460px); }
.lg-grid { display: grid; gap: 6px; }
.lg-row { display: grid; grid-template-columns: 24px minmax(0, 1fr); align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--text); }
.lg-row .sw { margin: 0 auto; }
.lg-ico { font-size: 16px; text-align: center; }

/* ── 주식: 회사 8곳 칸 (폰 2×4 · 넓은 화면 4×2) ── */
.pane-co { gap: 6px; }
.stock-top { flex: none; display: grid; gap: 4px; }
.stock-top:empty { display: none; }
.news-line { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 3px 10px; border: 1.5px solid var(--good-bd); border-radius: 12px; background: var(--good-bg); color: var(--good-fg); font-size: 12.5px; font-weight: 800; text-align: left; }
.news-line.bad { border-color: var(--bad-bd); background: var(--bad-bg); color: var(--bad-fg); }
.news-line.meet { border-color: var(--calm-bd); background: var(--calm-bg); color: var(--calm-fg); }
.news-line.meet.hot { border-color: var(--hint-bd); background: var(--hint-bg); color: var(--hint-fg); }
.nl-t { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.news-line b { flex: none; }
.co-grid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(98px, 1fr)); gap: 6px; }
@media (min-width: 760px) { .co-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(118px, 1fr)); gap: 10px; } }
.ct2 { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 4px; padding: 6px 7px 7px; border: 2px solid var(--border); border-radius: 14px; background: var(--surface); overflow: hidden; }
.ct2.held { border-color: var(--border-strong); box-shadow: inset 0 0 0 1px var(--border-strong); }
.ct2-head { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 5px; padding: 0; border: none; background: none; color: inherit; text-align: left; }
.ct2-ico { display: grid; place-items: center; width: 26px; height: 26px; border: 1.5px solid; border-radius: 8px; font-size: 14px; line-height: 1; }
.ct2-nm { min-width: 0; font-size: 13px; font-weight: 800; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ct2-pr { font-family: var(--font-display); font-size: 17px; line-height: 1.2; color: var(--text-strong); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ct2-pr small { margin-left: 1px; font-family: var(--font-body); font-size: 10.5px; font-weight: 800; }
.ct2-mid { flex: none; display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; }
.ct2-mid .delta { flex: none; padding: 1px 6px; font-size: 11px; }
.ct2-mine { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: 1px 6px; font-size: 11px; }
.ct2-tags { flex: 1 1 0; min-height: 0; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 3px; overflow: hidden; }
.ct2-tags .chip { padding: 1px 6px; font-size: 10.5px; }
.ct2-btns { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.ct2-btns .btn { min-height: 34px; padding: 3px 4px; border-radius: 10px; font-size: 13px; }

/* 성적표 · 재산 · 상성 원 */
.report-card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.rp-hero { flex: none; }
.rp-cell { padding: 8px 10px; }
.rp-big { font-size: clamp(24px, 7vw, 32px); }
.rp-line { flex: none; padding: 6px 10px; font-size: 12.5px; }
.rp-list { min-height: 42px; gap: 6px; }
.rp-list .rp-row { min-height: 0; }
.rp-empty { flex: 1 1 auto; display: grid; place-items: center; text-align: center; }
.rp-next { flex: none; padding: 8px 10px; }
.rp-gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rp-gauges .meter { margin: 0 0 4px; font-size: 12px; }
.rp-cap { flex: none; font-size: 11.5px; line-height: 1.45; }
.wealth-card .spark { max-height: 120px; }
.night-card .card { padding: 12px; }
.pane-ring { gap: 8px; }
.ring-box { flex: 1 1 auto; min-height: 170px; display: grid; place-items: center; }
.ring-box .ring-svg { width: auto; height: 100%; max-width: 100%; aspect-ratio: 390 / 376; }
.ring-side { flex: none; }
.ring-side .rules { grid-template-columns: 1fr 1fr; gap: 6px; }
.ring-side .rule { grid-template-columns: 28px minmax(0, 1fr); gap: 6px; padding: 6px 7px; border-radius: 12px; background: var(--surface-2); }
.ring-side .rule-ico { width: 28px; height: 28px; font-size: 15px; }
.ring-side .rule-t { font-size: 12.5px; }
.ring-side .rule-d { font-size: 11px; line-height: 1.4; }
@media (min-width: 760px) {
  .pane-ring { flex-direction: row; align-items: center; }
  .ring-box { height: 100%; }
  .ring-side { width: 340px; }
  .ring-side .rules { grid-template-columns: 1fr; }
}

/* ── 뽑기 ── */
.machine-card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.machine-card .balls { flex: none; }
.machine { flex: 1 1 auto; align-content: center; gap: 6px; }
.orb { width: 92px; height: 92px; }
.orb .bl { font-size: 44px; }
.machine-title { font-size: 20px; }
.machine-sub { font-size: 12.5px; }
.cap-line { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px; font-size: 12px; font-weight: 800; color: var(--muted-2); }
.cap-line .ct { margin: 0; padding: 2px 6px; font-size: 11.5px; }
.cap-note { font-size: 12.5px; font-weight: 800; color: var(--info-fg); }
.mc-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.draw-btn { min-height: 52px; }
.tiers-card { display: flex; flex-direction: column; gap: 8px; }
.tier-list { gap: 6px; }
.tier-box { padding: 7px 9px; }
.tier-head { grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; }
.tier-head .tb { width: 34px; height: 34px; font-size: 18px; }
.tier-head .tn small { font-size: 11px; font-weight: 800; color: var(--muted); }
.tier-head .btn-small { min-height: 34px; padding: 4px 10px; }
.coupon-card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.coupon-shop { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.coupon-buy { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 8px; min-height: 60px; padding: 8px 10px; border: 2px solid var(--buy-bd); border-radius: 14px; background: var(--buy-bg); color: var(--buy-fg); text-align: left; }
.coupon-buy b { display: block; font-size: 13.5px; line-height: 1.3; }
.coupon-buy small { display: block; font-size: 12px; font-weight: 800; }
.cb-ico { font-size: 26px; text-align: center; }
.coupon-mine { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.coupon-list { min-height: 56px; }
.pool-cell { display: grid; justify-items: center; align-content: center; gap: 2px; min-width: 0; padding: 4px 2px; border-radius: 12px; background: var(--surface-2); text-align: center; }
.pool-cell .mini-em { width: 42px; height: 42px; }
.pool-cell b { max-width: 100%; font-size: 11px; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pool-cell small { font-size: 10px; color: var(--muted); }
.pool-cell.unseen { opacity: 0.45; filter: grayscale(0.8); }
.reveal-ov { position: fixed; inset: 0; z-index: 1160; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--scrim); }
.reveal-box { width: min(100%, 420px); max-height: 100%; overflow-y: auto; border-radius: 18px; }
.reveal-box .reveal-card { display: grid; gap: 4px; }
.reveal-box .vis.big { height: 124px; }
.reveal-box .vis.big .poke-img { height: 116px; }
.reveal-box .btn-evo { margin-top: 6px; }

/* ── 도감: 내 포켓몬 카드 (누르면 자세히) ── */
.mc2 { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 4px 6px; border: 2px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text); overflow: hidden; text-align: center; }
.mc2:active { transform: scale(0.97); }
.mc2-top { align-self: stretch; display: flex; justify-content: space-between; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 900; }
.mc2-lv { padding: 0 6px; border-radius: 999px; background: var(--chip-bg); color: var(--chip-fg); }
.mc2-star { font-size: 9px; }
.mc2 .vis { flex: 1 1 auto; min-height: 0; height: auto; margin: 0; }
.mc2 .poke-img { height: 100%; max-height: 66px; width: auto; }
.mc2 .emblem { width: 46px; height: 46px; }
.mc2 .emblem-icon { font-size: 22px; }
.mc2-nm { max-width: 100%; font-family: var(--font-display); font-size: 14.5px; line-height: 1.15; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc2-st { max-width: 100%; font-size: 10.5px; font-weight: 800; color: var(--muted-2); white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
.mc2-xp { align-self: stretch; height: 4px; margin: 1px 4px 0; border-radius: 999px; background: var(--xp-bg); overflow: hidden; }
.mc2-xp i { display: block; height: 100%; background: var(--xp); }
.mc2.partner { border-color: var(--primary); }
.mc2.ready { border-color: transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(135deg, var(--evo-1), var(--evo-2), var(--evo-3)) border-box; animation: evoGlow 1.6s ease-in-out infinite; padding-bottom: 20px; }
.mc2-evo { position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 0; background: linear-gradient(90deg, #a855f7, #ec4899); color: #ffffff; font-size: 10.5px; font-weight: 900; }
@keyframes evoGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); } 50% { box-shadow: 0 0 12px 2px rgba(168, 85, 247, 0.45); } }
.dex-grid .dex-cell { min-height: 0; padding: 3px 2px; justify-content: center; }
.dex-cell .vis.sm { height: 44px; }
.dex-cell .vis.sm .poke-img { height: 42px; }
.pane-badges .card { padding: 12px; }
.shelf { gap: 8px 4px; margin-top: 8px; }
.medal { width: 44px; height: 44px; font-size: 20px; }
.champ-box { margin-top: 8px; padding: 8px 10px; font-size: 13px; }
.champ-tip { margin-top: 4px; padding: 6px 8px; border-radius: 10px; background: var(--hint-bg); color: var(--hint-fg); font-size: 12px; font-weight: 800; line-height: 1.45; }
.cert-grid { margin-top: 8px; gap: 6px; }
.cert-slot { padding: 6px 2px; }

/* ── 판(시트): 한 화면에 맞게 ── */
.sheet { padding-top: max(10px, env(safe-area-inset-top, 0px)); }
.sheet-box { display: flex; flex-direction: column; max-height: calc(100% - 4px); }
.sheet-box.full { height: calc(100% - 4px); }
.sheet-box.full .sheet-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.sheet-head { flex: none; padding: 9px 16px; }
.sheet-body { gap: 8px; padding: 10px 16px 14px; }
.sheet-title { font-size: 21px; }
.h-evo { background: linear-gradient(135deg, #a855f7, #ec4899); color: #ffffff; }
.mini-em.xs { width: 26px; height: 26px; border-width: 2px; font-size: 13px; }
.ti { display: inline-grid; place-items: center; width: 21px; height: 21px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--th, #ffffff), var(--tc) 75%); font-size: 11px; line-height: 1; box-shadow: 0 0 0 1.5px #ffffff; vertical-align: middle; }

/* 배틀 전 카드: 상대 약점 · 내 팀 상성 */
.enc { gap: 8px; }
.enc-sub { font-size: 12.5px; font-weight: 800; color: var(--muted-2); }
.foe-card { grid-template-columns: 96px minmax(0, 1fr); padding: 6px 10px; }
.foe-card .vis { height: 92px; }
.foe-card .poke-img { height: 86px; }
.fc-txt { gap: 4px; }
.fc-txt b small { font-family: var(--font-body); font-size: 13px; font-weight: 800; color: var(--muted-2); }
.fc-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.fc-weak { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 3px; padding: 2px 8px 2px 6px; border-radius: 999px; font-size: 11.5px; font-weight: 800; }
.fc-weak.good { background: var(--good-bg); color: var(--good-fg); }
.fc-weak.bad { background: var(--warn-bg); color: var(--warn-fg); }
.boss-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.boss-one { display: grid; justify-items: center; gap: 2px; min-width: 0; padding: 6px 4px; border: 2px solid var(--border); border-radius: 14px; background: var(--surface-2); text-align: center; }
.boss-one .mini-em { width: 48px; height: 48px; }
.boss-one b { max-width: 100%; font-size: 12.5px; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.boss-one small { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; color: var(--muted-2); }
.boss-one .fc-weak { padding: 1px 6px; }
.team-box { display: grid; gap: 6px; padding: 8px; border: 2px solid var(--warn-bd); border-radius: 16px; background: var(--warn-bg); }
.tb-head { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
.tb-head b { font-size: 14px; color: var(--text-strong); }
.tb-head small { flex: 1 1 120px; min-width: 0; font-size: 11px; font-weight: 700; color: var(--muted-2); }
.tb-head .btn-small { min-height: 32px; padding: 4px 10px; }
.ts-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.ts-slot { position: relative; display: grid; justify-items: center; align-content: start; gap: 1px; min-width: 0; padding: 6px 3px; border: 2px solid var(--border); border-radius: 14px; background: var(--surface); text-align: center; }
.ts-slot.good { border-color: var(--good-bd); background: var(--good-bg); }
.ts-slot.bad { border-color: var(--bad-bd); background: var(--bad-bg); }
.ts-slot .mini-em { width: 44px; height: 44px; }
.ts-slot b { max-width: 100%; font-size: 12.5px; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ts-slot small { max-width: 100%; font-size: 10.5px; font-weight: 800; color: var(--muted-2); white-space: nowrap; overflow: hidden; }
.ts-no { position: absolute; left: 4px; top: 4px; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--primary); color: #ffffff; font-size: 11px; font-weight: 900; }
.ts-v { font-size: 11.5px; font-weight: 900; color: var(--muted-2); }
.ts-slot.good .ts-v { color: var(--good-fg); }
.ts-slot.bad .ts-v { color: var(--bad-fg); }
.ts-slot.empty { align-content: center; min-height: 110px; border-style: dashed; background: transparent; color: var(--muted); font-size: 12px; font-weight: 800; }
.mks { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 3px; }
.mk { display: inline-flex; align-items: center; padding: 0 5px; border-radius: 999px; font-size: 10.5px; font-weight: 900; line-height: 1.6; white-space: nowrap; }
.mk.good { background: var(--mk-good); color: #ffffff; }
.mk.bad { background: var(--mk-bad); color: #ffffff; }
.mk.even { background: var(--chip-bg); color: var(--chip-fg); }
.pf { display: inline-flex; align-items: center; padding: 0 4px; border-radius: 999px; font-size: 11px; line-height: 1.6; }
.pf.good { background: var(--good-bg); }
.pf.bad { background: var(--bad-bg); }
.pf.even { background: var(--chip-bg); }

    const w = { id: 'w' + st.wseq, at: pl.i, sp, until: st.day + 4 + rnd(4) };
    st.wilds.push(w);
    return w;
  }
  const wildAt = (st, i) => st.wilds.find((w) => w.at === i) || null;

  // ── 칸에 도착 ──
  function land(st, p) {
    const pl = PLACES[p.pos];
    const pd = { pid: p.pid, at: pl.i, kind: pl.kind };
    let tu = 0;
    // 말판에서 놀던 야생 포켓몬이 있는 칸에 딱 멈추면 배틀!
    const w = wildAt(st, pl.i);
    if (w) {
      Object.assign(pd, { kind: 'wild', foe: wildFoe(st, p, w.sp), wid: w.id });
      st.pending = pd;
      return;
    }
    switch (pl.kind) {
      case 'home':
        p.cash += HOME_PAY;
        Object.assign(pd, { tone: 'home', icon: '🏠', title: '집에 딱 도착! 보너스 +1,000원', body: '지나갈 때 받는 용돈 1,000원에\n엄마가 1,000원을 더 주셨어요.' });
        addLog(st, p, '🏠 암사동 집에 딱 도착! 보너스 +1,000원');
        break;
      case 'gym':
        pd.cid = pl.cid;
        break;
      case 'wild': {
        const sp = wildSpecies(p, placeType(st, pl.i));
        pd.foe = wildFoe(st, p, sp);
        break;
      }
      case 'quiz':
        pd.qi = p.quizN % QUIZ.length;
        break;
      case 'news': {
        const daily = st.news.find((x) => x.src === 'daily');
        const n = makeNews(daily ? daily.cid : null, 'flash');
        st.news = st.news.filter((x) => x.src !== 'flash').concat([n]);
        const c = COMP[n.cid];
        Object.assign(pd, { tone: 'news', icon: '📺', cid: n.cid, title: '방송국 속보! ' + c.icon + ' ' + c.name, body: n.text + '.\n👉 내일 크게 ' + (n.dir > 0 ? '오를' : '떨어질') + ' 가능성이 높아요. (맞을 확률 75%)' });
        addLog(st, p, '📺 속보: ' + c.icon + ' ' + c.name + ' ' + (n.dir > 0 ? '오를 것 같대요' : '떨어질 것 같대요'));
        break;
      }
      case 'luck': {
        const x = pick(LUCK);
        // 남산 칸은 N서울타워 위 보름달님이 주는 행운이에요
        let title = (pl.short === '남산' ? '🌕 남산 달님의 행운! ' : '네잎클로버 행운! ') + x[0];
        let body = x[2];
        if (x[1] === 'xp') {
          const m = partnerMon(p);
          if (m && m.lv < MAX_LV) {
            const up = gainXp(m, SNACK_XP);
            body = SP[m.sp].name + ' 경험치 +' + SNACK_XP + (up ? '\n⬆️ 레벨 업! Lv.' + m.lv + ' (⚡' + powerOf(m) + ' · ❤️' + hpOf(m) + ')' : ' (다음 레벨까지 ' + (xpNeed(m.lv) - m.xp) + ')');
          } else if (m) body = SP[m.sp].name + eunneun(SP[m.sp].name) + ' 이미 최고 레벨이에요. 맛있게 먹었어요!';
          else body = '아직 포켓몬이 없어서 내가 맛있게 먹었어요.';
        } else if (x[1] === 'ball') {
          p.balls.poke = Math.min(MAX_BALLS, p.balls.poke + 2);
          body += '\n🎒 내 몬스터볼 ' + p.balls.poke + '개';
        } else {
          const before = p.cash;
          p.cash = Math.max(0, p.cash + x[1]);
          const d = p.cash - before;
          title += d > 0 ? ' +' + fmt(d) + '원' : d < 0 ? ' −' + fmt(-d) + '원' : '';
        }
        Object.assign(pd, { tone: 'luck', icon: '🎁', title, body });
        addLog(st, p, '🎁 ' + pl.short + ': ' + x[0]);
        break;
      }
      case 'div': {
        const n = sharesOf(p);
        const amt = n * DIV_PER_SHARE;
        p.cash += amt;
        p.earned += amt;
        p.divs = (p.divs || 0) + amt;
        tu = checkTier(p);
        Object.assign(pd, {
          tone: 'div', icon: '💰',
          title: amt ? '배당금 받는 날! +' + fmt(amt) + '원' : '배당금 받는 날!',
          body: amt ? '갖고 있는 주식 ' + n + '주 × ' + DIV_PER_SHARE + '원 = ' + fmt(amt) + '원\n회사가 번 돈을 주주에게 나눠 줘요. 이 돈은 "주식으로 번 돈"에 들어가요.' : '아직 주식이 없어서 받을 배당금이 없어요.\n주식을 가진 주주만 배당금을 받아요!',
        });
        if (amt) addLog(st, p, '💰 코엑스 배당금 +' + fmt(amt) + '원');
        break;
      }
      case 'cost': {
        const x = pl.i === 4 ? ['강남역 문구점에서 학용품을 샀어요', 300] : ['건대 맛집에서 떡볶이를 사 먹었어요', 200];
        const paid = Math.min(p.cash, x[1]);
        p.cash -= paid;
        Object.assign(pd, { tone: 'cost', icon: '💸', title: x[0] + ' −' + fmt(paid) + '원', body: '살다 보면 꼭 써야 하는 돈도 있어요.\n쓸 돈은 조금 남겨 두세요!' });
        addLog(st, p, '💸 ' + x[0] + ' −' + fmt(paid) + '원');
        break;
      }
      case 'bank': {
        const amt = Math.min(500, Math.round((p.cash * 0.05) / 10) * 10);
        p.cash += amt;
        Object.assign(pd, { tone: 'bank', icon: '🏦', title: '이자 받는 날! +' + fmt(amt) + '원', body: '현금의 5%를 이자로 받았어요 (최대 500원).\n돈을 모아 두면 이자가 붙어요.' });
        addLog(st, p, '🏦 여의도 이자 +' + fmt(amt) + '원');
        break;
      }
      case 'again':
        ensureDice(st, p);
        if (!diceUnlimited(st)) p.dice.left += 1;
        Object.assign(pd, { tone: 'again', icon: '🚇', title: '환승! 주사위 한 번 더', body: '1호선에서 2호선으로 갈아타고 더 멀리 가요.\n' + (diceUnlimited(st) ? '바로 한 번 더 굴려요!' : '공짜 주사위 1개를 받았어요!') });
        break;
      default: {
        // 쉼터: 내 포켓몬 모두 경험치 +20
        const fams = Object.keys(p.mons);
        const ups = [];
        fams.forEach((f) => { const m = p.mons[f]; if (gainXp(m, REST_XP)) ups.push(SP[m.sp].name + ' Lv.' + m.lv); });
        const body = fams.length
          ? '동물 친구들과 놀고 나니 힘이 났어요.\n🐾 내 포켓몬 ' + fams.length + '마리 모두 경험치 +' + REST_XP + (ups.length ? '\n⬆️ 레벨 업! ' + ups.slice(0, 4).join(' · ') + (ups.length > 4 ? ' …' : '') : '')
          : '동물 친구들을 구경했어요.\n포켓몬이 생기면 여기서 경험치를 받아요.';
        Object.assign(pd, { tone: 'rest', icon: '🦁', title: fams.length ? '푹 쉬었어요! 모두 경험치 +' + REST_XP : '어린이대공원에서 쉬었어요', body });
        addLog(st, p, '🦁 어린이대공원에서 푹 쉬었어요');
      }
    }
    if (tu) pd.tierUp = tu;
    st.pending = pd;
  }

  // ── 배틀 · 퀴즈 결과 ──
  function result(st, p, pd, o) {
    st.pending = Object.assign({ pid: p.pid, at: pd.at, kind: 'result', done: true }, o);
  }
  // ── 배틀: 내 포켓몬 최대 3마리 팀 vs 야생 1마리 · 관장님 1~3마리 ──
  // 차례: 내가 먼저 기술을 써요 → 상대가 살아 있으면 반격. 쓰러지면 다음 친구가 나와요.
  // 야생 포켓몬은 볼을 던져서 잡을 수 있어요 (체력이 적게 남을수록 잘 잡혀요)
  function fighter(sp, lv, stars, fam, hpx) {
    const max = Math.round(hpMaxOf(sp, lv, stars) * (hpx > 1 ? hpx : 1));
    const f = { sp, lv, stars: stars || 0, atk: atkOf(sp, lv, stars), hp: max, max };
    if (fam) f.fam = fam;
    return f;
  }
  function hitOf(att, def) {
    const k = eff(SP[att.sp].type, SP[def.sp].type);
    const crit = Math.random() < CRIT_RATE;
    const dmg = Math.max(1, Math.round(att.atk * k * DMG_K * rand(0.85, 1.15) * (crit ? 1.5 : 1)));
    return { dmg, k, crit };
  }
  // 볼로 잡힐 확률: 체력이 가득이면 8%쯤, 조금 남으면 60%쯤. 좋은 볼 · 흔한 포켓몬일수록 잘 잡혀요
  const RARE_K = { 0: 0.85, 1: 1, 2: 0.85, 3: 0.7, 4: 0.45 };
  function catchChance(foe, ball) {
    const b = BALLS[ball];
    if (!b || !foe || foe.hp <= 0) return 0;
    return clamp((0.08 + 0.62 * (1 - foe.hp / foe.max)) * b.k * (RARE_K[SP[foe.sp].pool] || 0.85), 0.03, 0.97);
  }
  // 추천 팀: 상대 타입에 센 순서로 3마리 (때리는 상성 + 맞는 상성 + 체력)
  function teamScore(m, foeTypes) {
    const n = Math.max(1, foeTypes.length);
    let k = 0;
    let d = 0;
    foeTypes.forEach((t) => { k += eff(SP[m.sp].type, t); d += eff(t, SP[m.sp].type); });
    return (powerOf(m) * (k / n)) / Math.sqrt(d / n) + hpOf(m) * 0.25;
  }
  function autoTeam(p, foeTypes) {
    return Object.keys(p.mons).sort((a, b) => teamScore(p.mons[b], foeTypes) - teamScore(p.mons[a], foeTypes)).slice(0, TEAM_MAX);
  }
  function cleanTeam(p, fams) {
    const out = [];
    (Array.isArray(fams) ? fams : []).forEach((f) => { if (typeof f === 'string' && p.mons[f] && out.indexOf(f) < 0 && out.length < TEAM_MAX) out.push(f); });
    return out;
  }
  // 이길 확률 어림: 공격만 한다고 치고 200판 돌려 봐요 (진짜 배틀과 같은 계산)
  function battleOdds(p, fams, foes, n) {
    const team0 = cleanTeam(p, fams).map((f) => { const m = p.mons[f]; return fighter(m.sp, m.lv, m.stars, f); });
    if (!team0.length || !foes.length) return 0;
    const foes0 = foes.map((f) => fighter(f.sp, f.lv, 0, null, f.hpx));
    const N = n || 200;
    let win = 0;
    for (let k = 0; k < N; k++) {
      const T = team0.map((x) => Object.assign({}, x));
      const F = foes0.map((x) => Object.assign({}, x));
      let mi = 0;
      let fi = 0;
      for (let g = 0; g < 400; g++) {
        F[fi].hp -= hitOf(T[mi], F[fi]).dmg;
        if (F[fi].hp <= 0) { fi += 1; if (fi >= F.length) { win += 1; break; } continue; }
        T[mi].hp -= hitOf(F[fi], T[mi]).dmg;
        if (T[mi].hp <= 0) { mi += 1; if (mi >= T.length) break; }
      }
    }
    return win / N;
  }
  // 만나는 상대 (야생 1마리 · 관장님 팀)
  function foesOf(st, p, pd) {
    if (pd.kind === 'wild') return [{ sp: pd.foe.sp, lv: pd.foe.lv, hpx: pd.foe.hpx || 1 }];
    return gymTeam(st, p, pd.cid, isChampSpot(p, pd.cid));
  }
  function startBattle(st, p, pd, fams) {
    if (!Object.keys(p.mons).length) return fail('포켓몬이 있어야 배틀할 수 있어요. 🏪 뽑기에서 친구를 만나요!');
    const foes = foesOf(st, p, pd);
    let team = cleanTeam(p, fams);
    if (!team.length) team = autoTeam(p, foes.map((f) => SP[f.sp].type));
    const champ = pd.kind === 'gym' && isChampSpot(p, pd.cid);
    const bt = {
      pid: p.pid, at: pd.at, kind: 'battle', done: false,
      mode: pd.kind === 'wild' ? 'wild' : champ ? 'champ' : 'gym',
      team: team.map((f) => { const m = p.mons[f]; return fighter(m.sp, m.lv, m.stars, f); }),
      foes: foes.map((f) => fighter(f.sp, f.lv, 0, null, f.hpx)),
      mi: 0, fi: 0, turn: 0, thrown: 0, ev: [{ t: 'start' }], evn: 1,
    };
    if (pd.kind === 'gym') {
      bt.cid = pd.cid;
      if (p.won[pd.cid] && !champ) bt.practice = true;
    }
    if (pd.wid) bt.wid = pd.wid;
    st.pending = bt;
    return ok({ bt: 'start' });
  }
  // 한 번 때리기 (side = 때리는 쪽). 쓰러뜨리면 true
  function strike(pd, side) {
    const A = side === 'me' ? pd.team[pd.mi] : pd.foes[pd.fi];
    const D = side === 'me' ? pd.foes[pd.fi] : pd.team[pd.mi];
    const h = hitOf(A, D);
    D.hp = Math.max(0, D.hp - h.dmg);
    pd.ev.push({ t: 'hit', side, dmg: h.dmg, k: h.k, crit: h.crit, hp: D.hp });
    return D.hp <= 0;
  }
  function foeTurn(st, p, pd) {
    if (!strike(pd, 'foe')) return null;
    pd.ev.push({ t: 'faint', side: 'me', i: pd.mi });
    const j = pd.team.findIndex((m) => m.hp > 0);
    if (j < 0) return btEnd(st, p, pd, 'lose');
    pd.mi = j;
    pd.ev.push({ t: 'send', side: 'me', i: j });
    return null;
  }
  function myAttack(st, p, pd) {
    if (!strike(pd, 'me')) return foeTurn(st, p, pd);
    pd.ev.push({ t: 'faint', side: 'foe', i: pd.fi });
    const j = pd.foes.findIndex((m) => m.hp > 0);
    if (j < 0) return btEnd(st, p, pd, pd.mode === 'wild' ? 'ko' : 'win');
    pd.fi = j;
    pd.ev.push({ t: 'send', side: 'foe', i: j });
    return null;
  }
  function battleCmd(st, p, a) {
    const pd = st.pending;
    if (!pd || pd.kind !== 'battle' || pd.pid !== p.pid) return fail('지금은 배틀 중이 아니에요');
    if (pd.done) return fail('');
    const cmd = String(a.cmd || '');
    let ball = '';
    let swapTo = -1;
    if (cmd === 'ball') {
      if (pd.mode !== 'wild') return fail('관장님 포켓몬은 잡을 수 없어요!');
      ball = BALLS[a.ball] ? a.ball : 'poke';
      if (!(p.balls[ball] > 0)) return fail('🎒 ' + BALLS[ball].name + iga(BALLS[ball].name) + ' 없어요. 🏪 뽑기 가게에서 살 수 있어요');
    } else if (cmd === 'swap') {
      swapTo = Math.floor(num(a.i, -1));
      if (swapTo < 0 || swapTo >= pd.team.length || swapTo === pd.mi || pd.team[swapTo].hp <= 0) return fail('');
    } else if (['atk', 'run'].indexOf(cmd) < 0) {
      return fail('');
    }
    pd.ev = [];
    pd.turn += 1;
    if (cmd === 'atk') {
      myAttack(st, p, pd);
    } else if (cmd === 'ball') {
      p.balls[ball] -= 1;
      pd.thrown += 1;
      const foe = pd.foes[pd.fi];
      const c = catchChance(foe, ball);
      const got = Math.random() < c;
      const shakes = got ? 3 : Math.random() < c + 0.25 ? 2 : Math.random() < 0.5 ? 1 : 0;
      pd.ev.push({ t: 'ball', ball, ok: got, shakes, pct: Math.round(c * 100) });
      pd.lastBall = ball;
      if (got) btEnd(st, p, pd, 'catch');
      else foeTurn(st, p, pd);
    } else if (cmd === 'swap') {
      pd.ev.push({ t: 'swap', side: 'me', from: pd.mi, i: swapTo });
      pd.mi = swapTo;
      foeTurn(st, p, pd);
    } else {
      btEnd(st, p, pd, pd.mode === 'wild' ? 'run' : 'quit');
    }
    pd.evn += 1;
    return ok({ bt: pd.done ? 'end' : 'step', how: pd.how || '' });
  }
  // 배틀 끝: 경험치 · 돈 · 배지 · 잡기. 카드는 배틀 그대로 두고(done) 확인을 누르면 닫혀요
  function btEnd(st, p, pd, how) {
    const win = how === 'ko' || how === 'catch' || how === 'win';
    const foe = pd.foes[pd.fi] || pd.foes[0];
    const fn = SP[foe.sp].name;
    // 경험치는 상대가 얼마나 셌는지로 정해요: 힘 = ⚡ × √(튼튼한 정도)
    // 야생 4 + 힘 × 0.5 · 체육관 8 + 힘 × 0.7 (연습 배틀은 반) · 지면 40%
    const foePow = Math.max.apply(null, pd.foes.map((f) => f.atk * Math.sqrt(f.max / hpMaxOf(f.sp, f.lv, 0))));
    const base = Math.round((pd.mode === 'wild' ? 4 + foePow * 0.5 : 8 + foePow * 0.7) * (pd.practice ? 0.5 : 1));
    const xp = how === 'run' || how === 'quit' ? 0 : win ? base : Math.round(base * 0.4);
    let tone = win ? 'good' : 'bad';
    let icon = win ? '🎉' : '😢';
    let title = '';
    const lines = [];
    let tu = 0;
    if (pd.mode === 'wild') {
      if (how === 'catch') {
        // 잡은 포켓몬은 그 레벨로 와요 (내 포켓몬 중 가장 높은 레벨까지만)
        const res = addMon(st, p, foe.sp, Math.min(foe.lv, maxMonLv(p)));
        p.stats.wins += 1;
        p.stats.caught = (p.stats.caught || 0) + 1;
        pd.caught = foe.sp;
        pd.res = { type: res.type, fam: res.fam, sp: res.sp };
        title = '잡았다! 야생 ' + fn + ' Lv.' + foe.lv;
        lines.push(BALLS[pd.lastBall || 'poke'].icon + ' ' + BALLS[pd.lastBall || 'poke'].name + iga(BALLS[pd.lastBall || 'poke'].name) + ' 흔들흔들… 딸깍! ' + resLine(res));
        addLog(st, p, '🎉 야생 ' + fn + eulreul(fn) + ' 잡았어요!');
      } else if (how === 'ko') {
        p.cash += WILD_PRIZE;
        p.stats.wins += 1;
        title = '이겼어요! +' + fmt(WILD_PRIZE) + '원';
        lines.push('야생 ' + fn + eunneun(fn) + ' 기절했어요. 기절한 포켓몬은 잡을 수 없어요.\n💡 다음엔 체력이 조금 남았을 때 볼을 던져 봐요!');
        addLog(st, p, '🌳 야생 ' + fn + eulreul(fn) + ' 이기고 +' + fmt(WILD_PRIZE) + '원');
      } else if (how === 'run') {
        tone = 'calm';
        icon = '🏃';
        title = '무사히 도망쳤어요!';
        lines.push(pd.wid ? '야생 ' + fn + eunneun(fn) + ' 아직 ' + PLACES[pd.at].short + '에 있어요. 다음에 또 만나요!' : '야생 ' + fn + eunneun(fn) + ' 풀숲으로 돌아갔어요.');
      } else {
        p.stats.losses += 1;
        title = '아쉽게 졌어요…';
        lines.push('괜찮아요! 지면 잃는 건 없어요. 상성이 좋은 포켓몬을 데려가거나 레벨을 올려서 다시 만나요.');
        addLog(st, p, '🌳 야생 ' + fn + '에게 졌어요');
      }
      // 말판에서 놀던 야생 포켓몬은 잡거나 쓰러뜨리면 사라져요
      if (pd.wid && (how === 'catch' || how === 'ko')) st.wilds = st.wilds.filter((w) => w.id !== pd.wid);
    } else {
      const c = COMP[pd.cid] || COMP.rock;
      const champ = pd.mode === 'champ';
      const boss = champ ? '서울 챔피언' : c.boss;
      if (how === 'win') {
        p.stats.wins += 1;
        if (champ) {
          p.champ = true;
          p.cash += CHAMP_PRIZE;
          icon = '🏆';
          title = '서울 챔피언이 됐어요!';
          lines.push('🏆 롯데월드타워 꼭대기에서 챔피언을 이겼어요!\n💰 상금 +' + fmt(CHAMP_PRIZE) + '원');
          addLog(st, p, '🏆 챔피언 결정전 승리! 서울 챔피언 탄생');
        } else if (pd.practice) {
          p.cash += PRACTICE_PRIZE;
          title = '연습 배틀 승리! +' + fmt(PRACTICE_PRIZE) + '원';
          lines.push(boss + iga(boss) + ' 박수를 쳐 줬어요.');
          addLog(st, p, c.icon + ' ' + c.town + ': 연습 배틀 승리 +' + fmt(PRACTICE_PRIZE) + '원');
        } else {
          const prize = gymPrize(p);
          p.won[pd.cid] = true;
          p.cash += prize;
          p.sh[pd.cid] = (p.sh[pd.cid] || 0) + 1;
          p.cost[pd.cid] = (p.cost[pd.cid] || 0) + st.market.price[pd.cid];
          const firstCert = !p.certs[pd.cid];
          if (firstCert) p.certs[pd.cid] = st.day;
          tu = checkTier(p);
          const nb = badgeCount(p);
          tone = 'gym-' + pd.cid;
          icon = '🏅';
          title = c.icon + ' 배지 획득!';
          lines.push(nb + '번째 배지를 받았어요! 💰 상금 +' + fmt(prize) + '원\n📜 선물: ' + c.name + ' 주식 1주' + (firstCert ? ' (주주 증서 생김)' : '') + '\n' +
            (nb >= 8 ? '🏆 배지 8개! 잠실 롯데월드타워에 가면 챔피언 결정전이 열려요.' : '챔피언까지 배지 ' + (8 - nb) + '개 남았어요.'));
          addLog(st, p, c.icon + ' ' + c.town + ': ' + c.boss + eulreul(c.boss) + ' 이기고 배지 획득!');
        }
      } else if (how === 'lose') {
        p.stats.losses += 1;
        title = '아쉽게 졌어요…';
        lines.push('지면 잃는 건 없어요. 상성이 좋은 포켓몬을 데려가거나 레벨을 올려서 다시 도전해요!');
        addLog(st, p, c.icon + ' ' + c.town + ': ' + boss + '에게 졌어요');
      } else {
        tone = 'calm';
        icon = '🏃';
        title = '다음에 다시 도전해요';
        lines.push(boss + iga(boss) + ' 기다리고 있을게요!');
      }
    }
    // 같이 싸운 친구들 모두 경험치 (기절했어도 함께 싸웠으니까요) · 지면 40%
    const gains = [];
    const evo = [];
    pd.team.forEach((f) => {
      const m = p.mons[f.fam];
      if (!m) return;
      const lv0 = m.lv;
      const was = evoReady(f.fam, m);
      if (xp) gainXp(m, xp);
      gains.push({ fam: f.fam, sp: m.sp, lv0, lv: m.lv, x: m.xp || 0, need: xpNeed(m.lv) });
      if (!was && evoReady(f.fam, m)) evo.push(f.fam);
    });
    // 잡은 포켓몬이 합체해서 진화 준비가 됐을 때도
    if (pd.res && pd.res.type === 'ready' && evo.indexOf(pd.res.fam) < 0) evo.push(pd.res.fam);
    if (xp) {
      const ups = gains.filter((g) => g.lv > g.lv0).map((g) => SP[g.sp].name + ' Lv.' + g.lv0 + '→' + g.lv);
      lines.push('⭐ 경험치 +' + xp + (gains.length > 1 ? ' (' + gains.length + '마리 모두)' : '') + (win ? '' : ' · 져도 조금 받아요') + (ups.length ? '\n⬆️ 레벨 업! ' + ups.join(' · ') : ''));
    }
    if (evo.length) lines.push('✨ 진화할 수 있어요! ' + evo.map((f) => SP[p.mons[f].sp].name).join(' · ') + ' (내가 고를 때 진화해요)');
    Object.assign(pd, { done: true, how, win, xp, gains, tone, icon, title, body: lines.join('\n') });
    if (evo.length) pd.evo = evo;
    if (tu) pd.tierUp = tu;
    return how;
  }
  // 합체 결과를 한 줄로
  function resLine(res) {
    if (!res) return '';
    const n = SP[res.sp].name;
    if (res.type === 'new') return '새 친구 ' + n + '!';
    if (res.type === 'merge') return '합체 칸이 찼어요 (' + res.gauge + '/3)';
    if (res.type === 'ready') return '✨ 합체 3마리 완성! ' + n + iga(n) + ' 진화할 수 있어요';
    if (res.type === 'boost') return '💫 ' + n + iga(n) + ' 이미 진화 준비 완료라서 경험치 +' + res.xp + '!';
    if (res.type === 'evolve') return '✨ 3마리가 모여 ' + SP[res.from].name + iga(SP[res.from].name) + ' ' + n + euro(n) + ' 진화했어요!';
    if (res.type === 'jump') return '✨ 더 진화한 모습 ' + n + iga(n) + ' 나왔어요!';
    if (res.type === 'star') return '⭐ ' + n + ' 별 강화! (' + res.stars + '/3)';
    return '👑 ' + n + eunneun(n) + ' 이미 최고라서 +' + MAX_REFUND + '원 보너스!';
  }
  function answerQuiz(st, p, pd, i) {
    const q = QUIZ[pd.qi % QUIZ.length];
    const right = i === q.a;
    p.quizN += 1;
    if (right) p.cash += QUIZ_REWARD;
    result(st, p, pd, {
      tone: right ? 'good' : 'bad', icon: right ? '🎉' : '😅',
      title: right ? '정답! +' + fmt(QUIZ_REWARD) + '원' : '아쉬워요!',
      body: (right ? '' : '정답은 ' + NUM_MARK[q.a] + ' ' + q.o[q.a] + '.\n') + '💡 ' + q.e,
      quiz: { right },
    });
    addLog(st, p, '❓ 퀴즈: ' + (right ? '정답! +' + fmt(QUIZ_REWARD) + '원' : '아쉽게 틀렸어요'));
    return ok({ quiz: true, right });
  }

  // ── 차례 · 밤 ──
  function endTurn(st, p) {
    if (!isMulti(st)) { doNight(st); return; }
    const n = st.players.length;
    st.turn = (clamp(st.turn, 0, n - 1) + 1) % n;
    if (st.turn === 0) doNight(st);
  }
  function closePending(st, p) {
    st.pending = null;
    endTurn(st, p);
    return ok({ closed: true });
  }
  function doNight(st) {
    const M = st.market;
    const before = {};
    st.players.forEach((p) => { before[p.pid] = stockValue(st, p); });
    if (st.meeting && !st.meeting.result) resolveMeeting(st);
    const tot = totalShares(st);
    const pct = {};
    COMPANIES.forEach((c) => { const s = STYLES[c.style]; pct[c.id] = rand(-s.noise, s.noise); });
    const newsRes = [];
    st.news.forEach((n) => {
      const s = STYLES[COMP[n.cid].style];
      const follow = Math.random() < NEWS_ACCURACY;
      pct[n.cid] = follow ? n.dir * rand(s.move[0], s.move[1]) : -n.dir * rand(s.noise * 0.5, s.noise * 1.5);
      newsRes.push({ cid: n.cid, dir: n.dir, follow });
    });
    const boosted = [];
    RING.forEach((cid) => {
      if (M.boost[cid] > 0) {
        pct[cid] += BOOST_PCT;
        M.boost[cid] -= 1;
        boosted.push(cid);
        if (!M.boost[cid]) delete M.boost[cid];
      }
    });
    const sup = [];
    RING.forEach((cid) => {
      const n = tot[cid];
      if (!n) return;
      const b = supportOf(n);
      pct[cid] += b;
      pct[preyOf(cid)] -= b;
      sup.push({ cid, b });
    });
    const level = st.settings.counter;
    const hits = [];
    const near = [];
    RING.forEach((cid) => {
      const prob = counterChance(tot[cid], level);
      if (!prob) return;
      if (Math.random() < prob) {
        pct[cid] -= COUNTER_DMG[level];
        pct[predOf(cid)] += COUNTER_GAIN;
        hits.push({ cid, prob });
      } else {
        near.push({ cid, prob });
      }
    });
    COMPANIES.forEach((c) => {
      const p0 = M.price[c.id];
      const x = pct[c.id] + clamp(-0.035 * Math.log(p0 / c.start), -0.08, 0.08);
      M.prev[c.id] = p0;
      M.price[c.id] = Math.max(100, Math.round((p0 * (1 + x)) / 10) * 10);
    });
    const chg = (cid) => M.price[cid] / M.prev[cid] - 1;
    const lines = [];
    newsRes.forEach((r) => {
      const c = COMP[r.cid];
      const ch = chg(r.cid);
      if (r.follow) lines.push({ cls: 'l-info', t: '📰 뉴스대로 ' + c.icon + ' ' + c.name + ' ' + pctText(ch) });
      else lines.push({ cls: 'l-warn', t: '📰 앗! ' + c.icon + ' ' + c.name + eunneun(c.name) + ' 뉴스와 반대로 ' + pctText(ch) + '. 주식은 100% 맞힐 수 없어요!' });
    });
    hits.forEach((h) => {
      const c = COMP[h.cid];
      const pr = COMP[predOf(h.cid)];
      lines.push({ cls: 'l-bad', t: '💥 ' + pr.icon + ' ' + pr.name + '의 반격! 주주가 몰린 ' + c.icon + ' ' + c.name + ' ' + pctText(chg(h.cid)) });
    });
    near.forEach((h) => {
      const c = COMP[h.cid];
      const pr = COMP[predOf(h.cid)];
      lines.push({ cls: 'l-warn', t: '😮‍💨 천적 ' + pr.icon + ' ' + pr.name + iga(pr.name) + ' ' + c.icon + ' ' + c.name + eulreul(c.name) + ' 노렸지만 무사했어요 (반격 확률 ' + Math.round(h.prob * 100) + '%)' });
    });
    sup.sort((a, b) => b.b - a.b).slice(0, 2).forEach((s) => {
      const c = COMP[s.cid];
      const py = COMP[preyOf(s.cid)];
      lines.push({ cls: '', t: '📣 ' + c.icon + ' 응원 +' + pctText(s.b).slice(1) + ' → ' + py.icon + ' ' + py.name + ' −' + pctText(s.b).slice(1) });
    });
    boosted.forEach((cid) => { const c = COMP[cid]; lines.push({ cls: 'l-good', t: '🏭 ' + c.icon + ' ' + c.name + ': 회사 키우기 효과 +3%' }); });
    const delta = {};
    st.players.forEach((p) => {
      delta[p.pid] = stockValue(st, p) - before[p.pid];
      p.hist.push(p.cash + stockValue(st, p));
      if (p.hist.length > 30) p.hist.splice(0, p.hist.length - 30);
    });
    const changes = {};
    RING.forEach((cid) => { changes[cid] = Math.round(chg(cid) * 1000) / 1000; });
    st.day += 1;
    st.news = [makeNews(null, 'daily')];
    // 야생 포켓몬: 오래 논 친구는 떠나고, 새 친구가 나타나요
    const wl = [];
    st.wilds.filter((w) => st.day >= w.until).forEach((w) => wl.push({ cls: '', t: '🐾 ' + PLACES[w.at].short + '에서 놀던 야생 ' + SP[w.sp].name + iga(SP[w.sp].name) + ' 떠났어요' }));
    st.wilds = st.wilds.filter((w) => st.day < w.until);
    if (!st.wilds.length || Math.random() < WILD_SPAWN) {
      const w = spawnWild(st, pick(st.players));
      if (w) wl.unshift({ cls: 'l-good', t: '🐾 ' + PLACES[w.at].short + '에 야생 ' + SP[w.sp].name + iga(SP[w.sp].name) + ' 나타났어요! 딱 멈추면 배틀!' });
    }
    st.night = { day: st.day, lines: wl.concat(lines).slice(0, 8), delta, changes };
    if (st.meeting && st.meeting.result && st.day > st.meeting.day + 1) st.meeting = null;
    if (st.day % MEETING_EVERY === 0) openMeeting(st);
  }

  // ── 주주 총회 ──
  function openMeeting(st) {
    const tot = totalShares(st);
    let best = null;
    RING.forEach((cid) => { if (tot[cid] > 0 && (!best || tot[cid] > tot[best])) best = cid; });
    if (!best) { st.meeting = null; return; }
    const npc = Math.max(0, 100 - tot[best]);
    const npcA = Math.round(npc * rand(0.35, 0.65));
    const earn = (8 + rnd(8)) * 1000;
    st.seq += 1;
    st.meeting = { id: st.seq, day: st.day, cid: best, earn, per: Math.round(earn / 100 / 10) * 10, npcA, npcB: npc - npcA, votes: {}, weights: {}, result: '', paid: {}, A: 0, B: 0 };
    const c = COMP[best];
    addLog(st, null, '🏛️ ' + c.icon + ' ' + c.name + ' 주주 총회가 열렸어요');
  }
  const meetingVoters = (st) => (st.meeting ? st.players.filter((p) => (p.sh[st.meeting.cid] || 0) > 0) : []);
  const needsVote = (st, p) => !!(st.meeting && !st.meeting.result && (p.sh[st.meeting.cid] || 0) > 0 && !st.meeting.votes[p.pid]);
  function resolveMeeting(st) {
    const m = st.meeting;
    let A = m.npcA;
    let B = m.npcB;
    Object.keys(m.votes).forEach((pid) => { if (m.votes[pid] === 'a') A += m.weights[pid] || 0; else B += m.weights[pid] || 0; });
    m.A = A;
    m.B = B;
    m.result = A >= B ? 'a' : 'b';
    const c = COMP[m.cid];
    if (m.result === 'a') {
      st.players.forEach((p) => {
        const n = p.sh[m.cid] || 0;
        if (!n) return;
        const amt = n * m.per;
        p.cash += amt;
        p.earned += amt;
        p.divs = (p.divs || 0) + amt;
        m.paid[p.pid] = amt;
        checkTier(p);
      });
      addLog(st, null, '🏛️ ' + c.icon + ' 주주 총회: 배당금을 나눠 주기로 했어요 (1주에 ' + m.per + '원)');
    } else {
      st.market.boost[m.cid] = BOOST_NIGHTS;
      addLog(st, null, '🏛️ ' + c.icon + ' 주주 총회: 회사를 키우기로 했어요 (3일 동안 주가 +3%씩)');
    }
  }

  // ── 동작들 ──
  const ok = (x) => Object.assign({ ok: true }, x || {});
  const fail = (msg) => ({ ok: false, msg: msg || '' });
  const ACTS = {
    roll(st, p) {
      if (st.pending) return fail(st.pending.pid === p.pid ? '먼저 카드를 확인해요!' : '다른 사람이 카드를 보고 있어요');
      if (isMulti(st) && currentPlayer(st).pid !== p.pid) return fail('지금은 ' + currentPlayer(st).name + ' 차례예요');
      const now = Date.now();
      ensureDice(st, p, now);
      if (!diceUnlimited(st)) {
        if (p.dice.left <= 0) return fail('😴 주사위를 다 썼어요! ' + diceWaitMin(st, p, now) + '분 뒤에 ' + st.settings.dice + '개가 다시 채워져요.');
        if (!p.dice.t) p.dice.t = now;
        p.dice.left -= 1;
      }
      const face = 1 + rnd(6);
      const from = p.pos;
      let passed = 0;
      for (let i = 0; i < face; i++) {
        p.pos = (p.pos + 1) % NP;
        if (p.pos === 0) { p.cash += HOME_PAY; p.laps += 1; passed += 1; }
      }
      st.lastMove = { pid: p.pid, from, face, to: p.pos, n: (st.lastMove ? st.lastMove.n : 0) + 1 };
      if (passed && p.pos !== 0) addLog(st, p, '🏠 집을 지나며 용돈 +' + fmt(HOME_PAY) + '원');
      // 누군가 처음으로 한 바퀴를 더 돌면 계절이 바뀌고 지도 칸 속성이 새로 섞여요
      let mapChanged = false;
      if (passed && p.laps > st.map.lap) {
        st.map.lap = p.laps;
        shuffleMap(st);
        mapChanged = true;
        const S = SEASONS[st.map.season];
        addLog(st, p, S.icon + ' ' + S.name + '이 왔어요! 지도 칸 속성이 바뀌었어요');
      }
      land(st, p);
      return ok({ face, from, to: p.pos, map: mapChanged });
    },
    choose(st, p, a) {
      const pd = st.pending;
      if (!pd || pd.pid !== p.pid) return fail('확인할 카드가 없어요');
      const key = String(a.key || '');
      if (pd.kind === 'battle') {
        if (pd.done && key === 'ok') return closePending(st, p);
        return fail(pd.done ? '' : '배틀 중이에요!');
      }
      if (!pd.done && (pd.kind === 'gym' || pd.kind === 'wild')) {
        if (key === 'fight') return startBattle(st, p, pd, a.team);
        if (key === 'leave' || key === 'flee') return closePending(st, p);
      } else if (!pd.done && pd.kind === 'quiz') {
        if (/^q[0-2]$/.test(key)) return answerQuiz(st, p, pd, Number(key.charAt(1)));
      } else if (key === 'ok') {
        return closePending(st, p);
      }
      return fail('');
    },
    skip(st) {
      if (!isMulti(st)) return fail('');
      const cur = currentPlayer(st);
      if (st.pending && st.pending.pid !== cur.pid) return fail('');
      st.pending = null;
      addLog(st, cur, '⏭️ ' + cur.name + ' 차례를 넘겼어요');
      endTurn(st, cur);
      return ok({ skipped: cur.pid });
    },
    // 배틀 중 명령: 공격 · 볼 던지기 · 교체 · 도망
    bt(st, p, a) {
      return battleCmd(st, p, a);
    },
    // 초안 시험용 버튼 (초안 빌드에서만)
    dev(st, p, a) {
      if (!DRAFT) return fail('');
      const k = String(a.k || '');
      if (k === 'cash') p.cash += 5000;
      else if (k === 'balls') BALL_KEYS.forEach((b) => { p.balls[b] = Math.min(MAX_BALLS, p.balls[b] + 10); });
      else if (k === 'mons') {
        const keys = SPECIES_KEYS.filter((s) => SP[s].pool === clamp(p.tier, 1, 3));
        for (let i = 0; i < 3; i++) addMon(st, p, pick(keys), 3 + rnd(6));
        if (!p.starter) p.starter = true;
      } else if (k === 'wild') {
        const w = spawnWild(st, p);
        if (!w) return fail('말판에 자리가 없어요 (야생 포켓몬은 3마리까지)');
        return ok({ dev: k, wild: w.sp, at: w.at });
      } else if (k === 'lap') {
        st.map.lap += 1;
        p.laps = Math.max(p.laps, st.map.lap);
        shuffleMap(st);
      } else if (k === 'hour') {
        st.players.forEach((q) => { if (q.dice.t) q.dice.t -= DICE_HOUR; });
      } else if (k === 'xp') {
        Object.keys(p.mons).forEach((f) => gainXp(p.mons[f], 80));
      } else if (k === 'evo') {
        // 모든 포켓몬을 진화 레벨까지 (+ 이브이 데려오기)
        if (!p.mons.eevee) addMon(st, p, 'eevee', 1);
        Object.keys(p.mons).forEach((f) => {
          const m = p.mons[f];
          if (evoTargets(f, m).length && m.lv < evoLv(m)) { m.lv = evoLv(m); m.xp = 0; }
        });
        if (!p.starter) p.starter = true;
      } else return fail('');
      return ok({ dev: k });
    },
    buyBall(st, p, a) {
      const k = BALLS[a.ball] ? a.ball : '';
      if (!k) return fail('');
      const b = BALLS[k];
      if (p.tier < b.tier) return fail('🔒 ' + b.name + eunneun(b.name) + ' ' + b.tier + '단계(' + TIERS[b.tier].ball + ' ' + TIERS[b.tier].name + ')부터 살 수 있어요');
      const n = clamp(Math.floor(num(a.n, 1)), 1, 10);
      if ((p.balls[k] || 0) + n > MAX_BALLS) return fail('🎒 가방이 꽉 찼어요 (' + MAX_BALLS + '개까지)');
      if (p.cash < b.price * n) return fail('💸 ' + fmt(b.price * n - p.cash) + '원이 모자라요!');
      p.cash -= b.price * n;
      p.balls[k] = (p.balls[k] || 0) + n;
      return ok({ ball: k, n });
    },
    buy(st, p, a) {
      const c = COMP[a.cid];
      if (!c) return fail('');
      const n = clamp(Math.floor(num(a.n, 1)), 1, 10);
      const price = st.market.price[c.id];

      if (p.cash < price * n) return fail('💸 현금이 ' + fmt(price * n - p.cash) + '원 모자라요!');
      p.cash -= price * n;
      p.sh[c.id] = (p.sh[c.id] || 0) + n;
      p.cost[c.id] = (p.cost[c.id] || 0) + price * n;

      const n = a.all ? have : clamp(Math.floor(num(a.n, 1)), 1, have);
      const price = st.market.price[c.id];
      const avg = (p.cost[c.id] || 0) / have;

  // 난이도 체력 배수의 끝 (어려움 2.95 × 약한 종 보정 2.5 ≈ 7.4)

    pd.body = str(r.body, '', 600);
