*, *::before, *::after { box-sizing: border-box; }
* { -webkit-tap-highlight-color: transparent; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 110;
  background: var(--wallet-a);
}
body.locked { overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--info-bd); outline-offset: 2px; }
[hidden] { display: none !important; }
b, strong { font-weight: 800; }
.num { font-variant-numeric: tabular-nums; }

/* ── 지갑 띠 ── */
.top-wallet {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: linear-gradient(135deg, var(--wallet-a), var(--wallet-b));
  color: var(--wallet-fg);
  box-shadow: 0 4px 14px var(--shadow-strong);
}
.wallet-inner {
  max-width: 980px;
  margin: 0 auto;
  padding-block: 10px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wallet-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.wallet-title { margin: 0; min-width: 0; font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 1.2; color: var(--wallet-title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wallet-tools { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.day-badge { padding: 4px 10px; border-radius: 999px; background: var(--wallet-badge-bg); color: var(--wallet-badge-fg); font-size: 12px; font-weight: 700; white-space: nowrap; }
.icon-btn { display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: none; border-radius: 12px; background: var(--wallet-box); color: var(--wallet-fg); font-size: 18px; line-height: 1; }
.who-chip { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px; padding: 3px 10px 3px 4px; border-radius: 999px; background: var(--wallet-box); font-size: 12.5px; font-weight: 800; }
.who-dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; box-shadow: 0 0 0 2px var(--wallet-fg); }
.wallet-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.w-box { min-width: 0; padding: 7px 6px; border-radius: 12px; background: var(--wallet-box); text-align: center; }
.w-label { font-size: 11px; color: var(--wallet-label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-val { font-family: var(--font-display); font-size: clamp(16px, 4.8vw, 21px); line-height: 1.25; color: var(--wallet-fg); white-space: nowrap; font-variant-numeric: tabular-nums; }
.w-val small { margin-left: 1px; font-family: var(--font-body); font-size: 11px; font-weight: 700; opacity: 0.85; }
.w-val.cash { color: var(--cash); }
.w-val.stock { color: var(--stockv); }
.w-val.badge { color: var(--badgev); }
.w-val.bump { animation: bump 0.45s ease; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }

/* ── 본문 · 탭 ── */
.container {
  max-width: 980px;
  margin: 0 auto;
  padding-block: 14px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; }
.tab-btn {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 58px; padding: 6px 2px;
  border: 2px solid var(--border); border-radius: 14px;
  background: var(--surface); color: var(--muted);
  font-family: var(--font-display); font-size: 15px; line-height: 1.2;
  transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
}
.tab-ico { font-size: 20px; line-height: 1; }
.tab-btn.active { background: var(--primary); border-color: var(--primary); color: var(--on-accent); box-shadow: 0 4px 10px var(--primary-glow); transform: translateY(-2px); }
.tab-dot { position: absolute; top: 5px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px var(--surface); }
.tab-btn.active .tab-dot { box-shadow: 0 0 0 2px var(--primary); background: var(--wallet-title); }

.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
.stack { display: grid; gap: 14px; min-width: 0; }
@media (min-width: 860px) {
  .cols { grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); }
}

/* ── 카드 · 글자 ── */
.card { position: relative; min-width: 0; padding: 16px; border: 2px solid var(--border); border-radius: 18px; background: var(--surface); box-shadow: 0 2px 6px var(--shadow); }
.card-soft { background: var(--surface-2); box-shadow: none; }
.card-title { margin: 0 0 6px; font-family: var(--font-display); font-weight: 400; font-size: 20px; line-height: 1.3; color: var(--text-strong); text-wrap: balance; }
.card-title small { font-family: var(--font-body); font-size: 12.5px; font-weight: 800; color: var(--muted); }
.caption { font-size: 12.5px; line-height: 1.55; color: var(--muted); }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.mt8 { margin-top: 8px; }
.mt12 { margin-top: 12px; }
.banner { padding: 12px 14px; border: 2px solid transparent; border-radius: 14px; font-size: 14px; font-weight: 700; line-height: 1.55; }
.banner-good { background: var(--good-bg); color: var(--good-fg); border-color: var(--good-bd); }
.banner-bad { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-bd); }
.banner-info { background: var(--info-bg); color: var(--info-fg); border-color: var(--info-bd); }
.banner-hint { background: var(--hint-bg); color: var(--hint-fg); border-color: var(--hint-bd); }
.banner-warn { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-bd); }
.banner-calm { background: var(--calm-bg); color: var(--calm-fg); border-color: var(--calm-bd); }
.banner small { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 700; opacity: 0.9; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: var(--chip-bg); color: var(--chip-fg); font-size: 12px; font-weight: 800; white-space: nowrap; }
.chip-up { background: var(--up-bg); color: var(--up); }
.chip-down { background: var(--down-bg); color: var(--down); }
.chip-hot { background: var(--bad-bg); color: var(--bad-fg); }
.chip-good { background: var(--good-bg); color: var(--good-fg); }
.chip-gold { background: var(--gold-bg); color: var(--gold-fg); }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; color: var(--on-accent); font-size: 11.5px; font-weight: 900; vertical-align: 1px; }
.pill-new { background: var(--pill-new); }
.pill-up { background: var(--pill-up); }
.list-lines { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }

.list-lines li.l-bad { background: var(--bad-bg); color: var(--bad-fg); }
.list-lines li.l-good { background: var(--good-bg); color: var(--good-fg); }
.list-lines li.l-warn { background: var(--warn-bg); color: var(--warn-fg); }
.list-lines li.l-info { background: var(--info-bg); color: var(--info-fg); }

/* ── 버튼 ── */
.btn-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.btn {
  display: block; width: 100%; min-height: 46px; padding: 9px 12px;
  border: 2px solid var(--border-strong); border-radius: 12px;
  background: var(--surface); color: var(--text);
  font-size: 14.5px; font-weight: 800; line-height: 1.3;
  transition: transform 0.15s;
}
.btn small { display: block; font-size: 12px; font-weight: 700; opacity: 0.85; }
.btn:active { transform: scale(0.96); }
.btn-buy { background: var(--buy-bg); border-color: var(--buy-bd); color: var(--buy-fg); }
.btn-sell { background: var(--sell-bg); border-color: var(--sell-bd); color: var(--sell-fg); }
.btn-muted { color: var(--muted); }
.btn[aria-disabled="true"] { opacity: 0.5; }
.btn:disabled, .btn-primary:disabled, .btn-gold:disabled, .btn-night:disabled { opacity: 0.55; cursor: default; }
.btn-primary, .btn-gold, .btn-night {
  display: block; width: 100%; min-height: 50px; padding: 12px 16px;
  border: none; border-radius: 14px; color: var(--on-accent);
  font-family: var(--font-display); font-size: 18px; line-height: 1.2;
  transition: transform 0.15s;
}
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-deep)); box-shadow: 0 4px 0 var(--primary-deep), 0 6px 14px var(--primary-glow); }
.btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-deep)); box-shadow: 0 4px 12px var(--gold-glow); }
.btn-night { background: linear-gradient(135deg, var(--night-a), var(--night-b)); box-shadow: 0 4px 0 var(--night-shadow); }
.btn-primary:active, .btn-gold:active, .btn-night:active { transform: scale(0.97); }
.btn-link { display: inline-block; padding: 6px 2px; border: none; background: none; color: var(--muted); font-size: 13px; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
.btn-small { min-height: 38px; padding: 6px 12px; font-size: 13px; border-radius: 10px; width: auto; display: inline-block; }

/* ── 말판 ── */
.status-row { display: flex; flex-wrap: wrap; gap: 6px; }
.partner-bar { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.partner-name { font-family: var(--font-display); font-size: 18px; line-height: 1.25; color: var(--text-strong); }
.partner-sub { font-size: 12px; font-weight: 800; color: var(--muted); }
.board-wrap { position: relative; margin: 10px -6px 0; }
.board-svg { display: block; width: 100%; height: auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.m-land { fill: var(--map-land); }
.m-home { fill: var(--map-home); }
.m-border { fill: none; stroke: var(--map-border); stroke-width: 1; }

.m-casing { fill: none; stroke: var(--map-casing); stroke-width: 7; stroke-linejoin: round; opacity: 0.95; }

.m-arrow { fill: var(--map-arrow); stroke: var(--map-casing); stroke-width: 1; stroke-linejoin: round; }
.m-label { fill: var(--map-label); font-family: var(--font-body); font-size: 8.4px; font-weight: 800; text-anchor: middle; stroke: var(--map-halo); stroke-width: 2.6px; paint-order: stroke; stroke-linejoin: round; }
.m-north { fill: var(--muted-2); font-family: var(--font-body); font-size: 10px; font-weight: 800; }
.nd { cursor: pointer; }
.nd circle.nb { stroke: var(--node-ring); stroke-width: 2; }
.nd text { font-size: 10px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.nd.big text { font-size: 13px; }
.nd.k-home circle.nb { fill: var(--k-home); }
.nd.k-bank circle.nb { fill: var(--k-bank); }
.nd.k-rest circle.nb { fill: var(--k-rest); }
.nd.k-wild circle.nb { fill: var(--k-wild); stroke: var(--k-wild-bd); }
.nd.k-quiz circle.nb { fill: var(--k-quiz); stroke: var(--k-quiz-bd); }
.nd.k-news circle.nb { fill: var(--k-news); stroke: var(--k-news-bd); }
.nd.k-luck circle.nb { fill: var(--k-luck); stroke: var(--k-luck-bd); }
.nd.k-div circle.nb { fill: var(--k-div); stroke: var(--k-div-bd); }
.nd.k-cost circle.nb { fill: var(--k-cost); stroke: var(--k-cost-bd); }
.nd.k-again circle.nb { fill: var(--k-again); stroke: var(--k-again-bd); }
.nd.g-fighting circle.nb { fill: var(--c-fighting); }

.nd.g-fire circle.nb { fill: var(--c-fire); }
.nd.g-grass circle.nb { fill: var(--c-grass); }
.nd.g-water circle.nb { fill: var(--c-water); }
.nd.g-ground circle.nb { fill: var(--c-ground); }
.nd.g-electric circle.nb { fill: var(--c-electric); }
.nd.g-flying circle.nb { fill: var(--c-flying); }

.nd.here circle.hl { opacity: 1; }
.nd.trail circle.hl { opacity: 1; stroke: var(--map-route); stroke-width: 2; }
.nd.pick circle.hl { opacity: 1; stroke: var(--info-bd); }
.tk { transition: transform 0.2s ease-out; }
.tk .tk-in { transform-box: fill-box; transform-origin: 50% 100%; }
.tk.hop .tk-in { animation: hop 0.24s ease-out; }
@keyframes hop { 0% { transform: translateY(6px) scale(0.85); } 60% { transform: translateY(-7px) scale(1.06); } 100% { transform: translateY(0) scale(1); } }
.tk-shadow { fill: rgba(15, 23, 42, 0.28); }
.tk-ring { fill: var(--surface); stroke-width: 3; }
.tk-ico { font-size: 14px; text-anchor: middle; dominant-baseline: central; }
.tk-pawn-body, .tk-pawn-head { stroke: #ffffff; stroke-width: 2; }
.place-info { min-height: 20px; margin-top: 6px; font-size: 12.5px; font-weight: 700; color: var(--muted-2); text-align: center; }
.legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 11px; font-weight: 800; color: var(--muted-2); }
.sw { display: inline-block; width: 14px; height: 8px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
.sw-route { height: 3px; background: var(--map-route); }
.sw-gym { width: 12px; height: 12px; border-radius: 50%; background: conic-gradient(var(--c-water) 0 25%, var(--c-fire) 0 50%, var(--c-grass) 0 75%, var(--c-electric) 0); }
.sw-won { width: 10px; height: 10px; border-radius: 50%; background: var(--c-rock); box-shadow: 0 0 0 2px var(--gold); }
.sw-river { background: var(--map-river); }
.sw-home { background: var(--map-home); }

.roll-card { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 14px; align-items: center; }
.dice { position: relative; width: 66px; height: 66px; border-radius: 16px; background: var(--surface); border: 2px solid var(--border-strong); box-shadow: 0 5px 0 var(--border-strong); }
.dice.rolling { animation: shake 0.14s linear infinite; }
@keyframes shake { 0% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } 100% { transform: rotate(-10deg); } }
.pip { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--text-strong); }
.pip.c { background: var(--primary-deep); }
.here-label { font-size: 12px; font-weight: 800; color: var(--muted); }
.here-name { margin: 2px 0 8px; font-family: var(--font-display); font-size: 18px; line-height: 1.25; color: var(--text-strong); }
.roll-hint { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; }
.dice-pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.dice-pips i { width: 7px; height: 7px; border-radius: 2px; background: var(--primary); }
.dice-pips i.off { background: var(--border-strong); }

.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.pchip { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; padding: 8px 4px; border: 2px solid var(--border); border-radius: 14px; background: var(--surface); text-align: center; }
.pchip.turn { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-glow); }
.pchip-name { max-width: 100%; font-size: 13.5px; font-weight: 800; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pchip-meta { max-width: 100%; font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.log-list li { padding: 8px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); font-size: 13px; font-weight: 700; line-height: 1.45; color: var(--muted-2); }
.log-list li b { color: var(--text-strong); }

/* ── 포켓몬 그림 · 엠블럼 ── */
.vis { display: grid; place-items: center; height: 100px; margin: 4px 0; }
.vis.sm { height: 56px; margin: 0; }
.vis.big { height: 150px; }
.poke-img { display: block; max-width: 100%; height: 92px; object-fit: contain; filter: drop-shadow(0 4px 6px var(--shadow-strong)); image-rendering: auto; }
/* 살짝 숨 쉬듯 움직여요 (도감 칸은 가만히) */
@keyframes idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.mon-card .poke-img, .reveal-card .poke-img, .fighter .poke-img { animation: idle 2.6s ease-in-out infinite; }
.vis.sm .poke-img { height: 52px; }
.vis.big .poke-img { height: 140px; }
.emblem {
  --tc: var(--t-normal); --th: var(--t-normal-hi);
  display: grid; place-items: center;
  width: 80px; height: 80px; border-radius: 50%;
  border: 3px solid var(--emblem-ring);
  background: radial-gradient(circle at 32% 28%, var(--th) 0%, var(--tc) 72%);
  box-shadow: inset 0 -6px 0 var(--emblem-shade), 0 6px 14px var(--shadow-strong);
}
.emblem-icon { font-size: 38px; line-height: 1; }
.vis.sm .emblem { width: 48px; height: 48px; border-width: 2px; box-shadow: inset 0 -4px 0 var(--emblem-shade); }
.vis.sm .emblem-icon { font-size: 22px; }
.vis.big .emblem { width: 124px; height: 124px; }
.vis.big .emblem-icon { font-size: 60px; }
.mini-em { --tc: var(--t-normal); --th: var(--t-normal-hi); position: relative; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--emblem-ring); background: radial-gradient(circle at 32% 28%, var(--th) 0%, var(--tc) 72%); box-shadow: 0 2px 6px var(--shadow-strong); font-size: 19px; line-height: 1; overflow: hidden; }
.mini-em img { width: 100%; height: 100%; object-fit: contain; }
.mini-em.photo { background: var(--surface); }
.pawn-em { position: relative; background: var(--chip-bg); }
.pawn-em::before { content: ""; position: absolute; left: 50%; bottom: 6px; width: 18px; height: 13px; margin-left: -9px; border-radius: 9px 9px 4px 4px; background: var(--primary-deep); }
.pawn-em::after { content: ""; position: absolute; left: 50%; top: 6px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--primary-deep); box-shadow: 0 0 0 2px var(--chip-bg); }
.t-electric { --tc: var(--t-electric); --th: var(--t-electric-hi); }
.t-fire { --tc: var(--t-fire); --th: var(--t-fire-hi); }
.t-water { --tc: var(--t-water); --th: var(--t-water-hi); }
.t-grass { --tc: var(--t-grass); --th: var(--t-grass-hi); }
.t-rock { --tc: var(--t-rock); --th: var(--t-rock-hi); }
.t-ground { --tc: var(--t-ground); --th: var(--t-ground-hi); }
.t-flying { --tc: var(--t-flying); --th: var(--t-flying-hi); }
.t-fighting { --tc: var(--t-fighting); --th: var(--t-fighting-hi); }
.t-normal { --tc: var(--t-normal); --th: var(--t-normal-hi); }
.t-psychic { --tc: var(--t-psychic); --th: var(--t-psychic-hi); }
.t-fairy { --tc: var(--t-fairy); --th: var(--t-fairy-hi); }
.t-poison { --tc: var(--t-poison); --th: var(--t-poison-hi); }
.t-bug { --tc: var(--t-bug); --th: var(--t-bug-hi); }
.t-ghost { --tc: var(--t-ghost); --th: var(--t-ghost-hi); }
.t-ice { --tc: var(--t-ice); --th: var(--t-ice-hi); }
.t-dragon { --tc: var(--t-dragon); --th: var(--t-dragon-hi); }

/* ── 사건 카드(아래에서 올라오는 판) ── */
.sheet {
  position: fixed; inset: 0; z-index: 1100;
  display: flex; align-items: flex-end; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px));
  background: var(--scrim);
}
.sheet-box {
  width: 100%; max-width: 440px; max-height: calc(100% - 8px); overflow-y: auto;
  border-radius: 22px 22px 0 0; background: var(--surface); color: var(--text);
  box-shadow: 0 -10px 30px var(--shadow-strong);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: rise 0.28s ease-out;
}
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@media (min-width: 700px) {
  .sheet { align-items: center; padding-bottom: 16px; }
  .sheet-box { border-radius: 22px; }
}
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 22px 22px 0 0; font-size: 13px; font-weight: 800; }
.sheet-head .ico { font-size: 26px; line-height: 1; }
.sheet-body { display: grid; gap: 10px; padding: 14px 18px 18px; }
.sheet-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 23px; line-height: 1.3; color: var(--text-strong); text-wrap: balance; }
.sheet-text { font-size: 14.5px; line-height: 1.65; color: var(--muted-2); white-space: pre-line; }
.sheet-btns { display: grid; gap: 8px; }
.h-home { background: var(--k-home); color: #ffffff; }
.h-bank { background: var(--k-bank); color: #ffffff; }
.h-rest { background: var(--k-rest); color: #ffffff; }
.h-wild { background: var(--good-bg); color: var(--good-fg); }
.h-quiz { background: var(--info-bg); color: var(--info-fg); }
.h-news { background: var(--info-bg); color: var(--info-fg); }
.h-luck { background: var(--k-luck); color: var(--text-strong); }
.h-div { background: var(--gold-bg); color: var(--gold-fg-2); }
.h-cost { background: var(--bad-bg); color: var(--bad-fg); }
.h-again { background: var(--k-again); color: var(--text-strong); }
.h-good { background: var(--good-bg); color: var(--good-fg); }
.h-bad { background: var(--bad-bg); color: var(--bad-fg); }
.h-calm { background: var(--calm-bg); color: var(--calm-fg); }
.h-gym-fighting { background: var(--c-fighting); color: #ffffff; }
.h-gym-rock { background: var(--c-rock); color: #ffffff; }
.h-gym-fire { background: var(--c-fire); color: #ffffff; }
.h-gym-grass { background: var(--c-grass); color: #ffffff; }
.h-gym-water { background: var(--c-water); color: #ffffff; }
.h-gym-ground { background: var(--c-ground); color: #ffffff; }
.h-gym-electric { background: var(--c-electric); color: #422006; }
.h-gym-flying { background: var(--c-flying); color: #ffffff; }
.versus { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.fighter { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 10px 6px; border-radius: 16px; background: var(--surface-2); text-align: center; }
.fighter-label { font-size: 11.5px; font-weight: 800; color: var(--muted); }
.fighter-name { font-family: var(--font-display); font-size: 17px; line-height: 1.2; color: var(--text-strong); }
.fighter-pow { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.fighter.me .fighter-pow { color: var(--me); }
.fighter.foe .fighter-pow { color: var(--foe); }
.vs { font-family: var(--font-display); font-size: 22px; color: var(--primary); }
.matchup { padding: 8px 10px; border-radius: 12px; font-size: 13.5px; font-weight: 800; text-align: center; }
.matchup.good { background: var(--good-bg); color: var(--good-fg); }
.matchup.bad { background: var(--bad-bg); color: var(--bad-fg); }
.matchup.even { background: var(--chip-bg); color: var(--chip-fg); }
.odds { display: grid; gap: 6px; }
.odds-bar { height: 12px; border-radius: 999px; background: var(--border); overflow: hidden; }
.odds-fill { height: 12px; border-radius: 999px; background: var(--gold); }
.odds-text { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 800; color: var(--text-strong); }
.shake { animation: shakeX 0.4s ease 2; }
@keyframes shakeX { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px) rotate(-3deg); } 75% { transform: translateX(8px) rotate(3deg); } }
.quiz-opt { text-align: left; }

/* ── 주식: 상성 원 · 회사 목록 ── */
.ring-svg { display: block; width: 100%; max-width: 440px; height: auto; margin: 0 auto; user-select: none; -webkit-user-select: none; }
.rg-dash { fill: none; stroke: var(--border-strong); stroke-width: 2; stroke-dasharray: 2 7; }
.rg-arc { fill: none; stroke-width: 4; stroke-linecap: round; }
.rg-b { cursor: pointer; }
.rg-b rect.bx { stroke-width: 2; }
.rg-b.sel rect.bx { stroke-width: 3.5; }
.rg-b text { text-anchor: middle; pointer-events: none; }
.rg-ico { font-size: 17px; dominant-baseline: central; }
.rg-nm { font-size: 9px; font-weight: 800; fill: var(--muted-2); }
.rg-pr { font-size: 10px; font-weight: 900; fill: var(--text-strong); }
.rg-pr.up { fill: var(--up); }
.rg-pr.down { fill: var(--down); }
.rg-pill rect { fill: var(--text-strong); }
.rg-pill text { font-size: 10px; font-weight: 900; fill: var(--surface); dominant-baseline: central; }
.rg-pill.zero rect { fill: var(--border-strong); }
.rg-pill.zero text { fill: var(--muted); }
.rg-risk { fill: none; stroke: var(--up); stroke-width: 3; animation: riskPulse 1.1s ease-in-out infinite; }
@keyframes riskPulse { 0%, 100% { stroke-opacity: 0.2; } 50% { stroke-opacity: 0.9; } }
.rg-mid { text-anchor: middle; }
.rg-mid-t { font-family: var(--font-display); font-size: 19px; fill: var(--text-strong); }
.rg-mid-s { font-size: 11.5px; font-weight: 800; fill: var(--muted-2); }
.cf-fighting { fill: var(--c-fighting-bg); stroke: var(--c-fighting); }
.cf-rock { fill: var(--c-rock-bg); stroke: var(--c-rock); }
.cf-fire { fill: var(--c-fire-bg); stroke: var(--c-fire); }
.cf-grass { fill: var(--c-grass-bg); stroke: var(--c-grass); }
.cf-water { fill: var(--c-water-bg); stroke: var(--c-water); }
.cf-ground { fill: var(--c-ground-bg); stroke: var(--c-ground); }
.cf-electric { fill: var(--c-electric-bg); stroke: var(--c-electric); }
.cf-flying { fill: var(--c-flying-bg); stroke: var(--c-flying); }
.cs-fighting { stroke: var(--c-fighting); } .cs-rock { stroke: var(--c-rock); } .cs-fire { stroke: var(--c-fire); } .cs-grass { stroke: var(--c-grass); }

.pieces { width: min(100%, 264px); margin: 0 auto; line-height: 0; }

.cert { position: relative; padding: 18px 16px; border-radius: 14px; background: var(--gold-bg); border: 3px double var(--gold-fg); text-align: center; display: grid; gap: 4px; color: var(--gold-fg-2); }

.cert-co { font-family: var(--font-display); font-size: 24px; color: var(--text-strong); }
.seal { position: absolute; right: 14px; bottom: 12px; width: 50px; height: 50px; border-radius: 50%; border: 3px solid var(--up); color: var(--up); display: grid; place-items: center; font-size: 11px; font-weight: 900; line-height: 1.1; transform: rotate(-12deg); opacity: 0.85; text-align: center; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.kvb { min-width: 0; padding: 8px 4px; border-radius: 12px; background: var(--surface-2); text-align: center; }

.rel { padding: 8px 10px; border-radius: 12px; background: var(--good-bg); color: var(--good-fg); font-size: 12.5px; font-weight: 700; line-height: 1.5; }

.gauge { height: 10px; border-radius: 999px; background: var(--border); overflow: hidden; }
.gauge i { display: block; height: 10px; border-radius: 999px; background: linear-gradient(90deg, var(--gold), var(--up)); }
.gauge.green i { background: var(--good-fg); }
.gauge.gold i { background: var(--gold); }
.rules { display: grid; gap: 10px; }
.rule { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; }
.rule-ico { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--chip-bg); font-size: 18px; }
.rule-t { font-size: 14px; font-weight: 800; color: var(--text-strong); }
.rule-d { font-size: 12.5px; line-height: 1.5; color: var(--muted-2); }
details.more { border-radius: 14px; }

.vote-opt { display: block; width: 100%; padding: 12px 14px; border-radius: 14px; border: 3px solid var(--border-strong); background: var(--surface); text-align: left; }

.tally { display: grid; gap: 6px; }
.tally-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; }
.bar { height: 12px; border-radius: 999px; background: var(--border); overflow: hidden; }
.bar i { display: block; height: 12px; border-radius: 999px; transition: width 0.6s ease; }

/* ── 뽑기 ── */
.balls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.ball-btn { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; padding: 8px 2px; border: 2px solid var(--border); border-radius: 14px; background: var(--surface); text-align: center; }
.ball-btn .b-ico { font-size: 24px; line-height: 1.2; }
.ball-btn .b-name { font-size: 12px; font-weight: 800; color: var(--text-strong); white-space: nowrap; }
.ball-btn .b-sub { font-size: 10.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.ball-btn.sel { border-color: var(--down); background: var(--sell-bg); box-shadow: 0 0 0 3px var(--sell-bd); }
.ball-btn.lock { opacity: 0.55; }
.orb { position: relative; width: 116px; height: 116px; margin: 2px auto; border-radius: 50%; display: grid; place-items: center; }
.orb .ring { position: absolute; inset: 0; border-radius: 50%; animation: spin 3s linear infinite; background: conic-gradient(from 0deg, var(--sell-bd), var(--down), var(--sell-bd), var(--down), var(--sell-bd)); }
.orb.t1 .ring { background: conic-gradient(from 0deg, var(--buy-bd), var(--primary-deep), var(--buy-bd), var(--primary-deep), var(--buy-bd)); }
.orb.t3 .ring { background: conic-gradient(from 0deg, var(--gold-bd), var(--gold-deep), var(--gold-bd), var(--gold-deep), var(--gold-bd)); }
.orb.t4 .ring { background: conic-gradient(from 0deg, #c4b5fd, #7c3aed, #c4b5fd, #7c3aed, #c4b5fd); }
.orb .core { position: absolute; inset: 8px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--surface) 0%, var(--surface-2) 60%, var(--border) 100%); }
.orb .bl { position: relative; font-size: 56px; line-height: 1; animation: bob 1.6s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.mons { line-height: 1.2; }
.mon { display: inline-block; margin: 3px 2px; padding: 4px 9px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface-2); font-size: 12.5px; font-weight: 800; color: var(--muted-2); white-space: nowrap; }
.mon.seen { color: var(--text-strong); border-color: var(--border-strong); }
.capbox { line-height: 0; text-align: center; }
.cp { display: inline-block; width: 21px; height: 21px; margin: 3px; border-radius: 50%; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.15), inset 0 3px 0 rgba(255, 255, 255, 0.45); }
.k-fighting { background: var(--c-fighting); } .k-rock { background: var(--c-rock); } .k-fire { background: var(--c-fire); } .k-grass { background: var(--c-grass); }
.k-water { background: var(--c-water); } .k-ground { background: var(--c-ground); } .k-electric { background: var(--c-electric); } .k-flying { background: var(--c-flying); }
.k-rainbow { background: conic-gradient(#ef4444, #f59e0b, #22c55e, #3b82f6, #a855f7, #ef4444); }
.ct { display: inline-block; margin: 3px 2px; padding: 4px 8px; border-radius: 999px; background: var(--chip-bg); font-size: 12px; font-weight: 800; color: var(--chip-fg); white-space: nowrap; }
.ct.hot { background: var(--gold-bg); color: var(--gold-fg-2); box-shadow: inset 0 0 0 1.5px var(--gold-bd); }
.tierline { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); }
.tierline.done { background: var(--good-bg); }
.tierline .tb { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); font-size: 20px; }
.tierline .tn { font-size: 14px; font-weight: 800; color: var(--text-strong); }
.tierline .tc { font-size: 12px; color: var(--muted); line-height: 1.4; }
.tierline .ts { font-size: 12px; font-weight: 800; color: var(--muted-2); white-space: nowrap; }

.reveal-card { overflow: hidden; text-align: center; }
.reveal-card.legend { border: 3px solid var(--legend-bd); background: linear-gradient(125deg, var(--holo-1) 0%, var(--holo-2) 25%, var(--holo-3) 50%, var(--holo-4) 75%, var(--holo-2) 100%); background-size: 300% 300%; box-shadow: 0 0 18px var(--legend-glow); animation: holo 4s ease infinite; color: #1e293b; }
.reveal-card.legend .poke-name, .reveal-card.legend .reveal-msg { color: #1e293b; }
@keyframes holo { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.reveal-in { animation: popIn 0.55s cubic-bezier(0.2, 1.4, 0.4, 1); }
@keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.suspense { padding: 26px 16px; text-align: center; font-family: var(--font-display); font-size: 18px; color: var(--text-strong); }
.spin-ball { display: inline-block; font-size: 54px; line-height: 1; animation: wobble 0.28s ease-in-out infinite alternate; }
@keyframes wobble { from { transform: rotate(-16deg); } to { transform: rotate(16deg) translateY(-6px); } }
.poke-name { font-family: var(--font-display); font-size: 20px; line-height: 1.25; color: var(--text-strong); }
.poke-name.big { font-size: 28px; }
.reveal-msg { margin: 8px 0 12px; font-size: 14.5px; font-weight: 700; line-height: 1.6; color: var(--text); }
.merge-slots { display: flex; justify-content: center; gap: 10px; margin: 6px 0; }
.mslot { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 3px dashed var(--warn-bd); background: var(--surface); font-size: 16px; }
.mslot.on { border-style: solid; border-color: var(--warn-fg); background: var(--warn-bg); }
.evo-stage { position: relative; }
.evo-flash { position: absolute; inset: 0; border-radius: 16px; background: radial-gradient(circle at 50% 40%, #ffffff 0%, rgba(255, 255, 255, 0.85) 35%, rgba(255, 255, 255, 0) 70%); animation: flash 1.1s ease-in-out forwards; pointer-events: none; }
@keyframes flash { 0% { opacity: 0; } 45% { opacity: 1; } 100% { opacity: 0; } }
.evo-banner { display: inline-block; margin-top: 6px; padding: 7px 16px; border-radius: 999px; background: var(--pill-up); color: #ffffff; font-family: var(--font-display); font-size: 16px; animation: popIn 0.5s cubic-bezier(0.2, 1.4, 0.4, 1); }
.coupon { display: grid; gap: 8px; }
.shop-item { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14.5px; font-weight: 800; color: var(--text-strong); }
.shop-item .price { color: var(--buy-fg); white-space: nowrap; font-variant-numeric: tabular-nums; }
.coupon-list { display: grid; gap: 6px; }
.coupon-btn { text-align: left; border-style: dashed; border-color: var(--good-bd); background: var(--good-bg); color: var(--good-fg); }

/* ── 도감 ── */
.mon-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 620px) { .mon-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.mon-card { display: flex; flex-direction: column; gap: 2px; padding: 10px 8px 12px; border: 2px solid var(--border); border-radius: 16px; background: var(--surface); text-align: center; }
.mon-card.partner { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
.mon-top { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.stage-b { padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 900; color: #ffffff; }
.st-1 { background: var(--primary-deep); } .st-2 { background: var(--down); } .st-3 { background: var(--gold-deep); } .st-4 { background: var(--pill-up); }
.dexno { font-size: 11px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.mon-stat { font-size: 12.5px; font-weight: 800; color: var(--muted-2); font-variant-numeric: tabular-nums; }
.mon-gauge { font-size: 11.5px; font-weight: 800; color: var(--warn-fg); }
.mon-card .btn { margin-top: 6px; min-height: 38px; padding: 6px; font-size: 12.5px; }
.dex-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 620px) { .dex-grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.dex-cell { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; padding: 6px 2px; border-radius: 12px; background: var(--surface-2); text-align: center; }
.dex-cell .nm { max-width: 100%; font-size: 10.5px; font-weight: 800; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dex-cell .no { font-size: 9.5px; font-weight: 800; color: var(--muted); }
.dex-cell.unseen .vis { filter: grayscale(1) brightness(0.4); opacity: 0.45; }
.dex-cell.unseen .nm { color: var(--muted); }
.shelf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 6px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; text-align: center; }
.medal { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.75); font-size: 23px; line-height: 1; box-shadow: 0 4px 0 var(--shadow-strong); }
.medal.empty { border: 2px dashed var(--border-strong); background: none; opacity: 0.45; box-shadow: none; }
.slot .city { max-width: 100%; font-size: 11.5px; font-weight: 800; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .boss { max-width: 100%; font-size: 10px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mbg-fighting { background: var(--c-fighting); } .mbg-rock { background: var(--c-rock); } .mbg-fire { background: var(--c-fire); } .mbg-grass { background: var(--c-grass); }
.mbg-water { background: var(--c-water); } .mbg-ground { background: var(--c-ground); } .mbg-electric { background: var(--c-electric); } .mbg-flying { background: var(--c-flying); }

/* ── 큰 판(부모 메뉴 · 회사 · 그림 자르기) ── */
.panel {
  position: fixed; inset: 0; z-index: 1150;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.panel-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: linear-gradient(135deg, var(--wallet-a), var(--wallet-b)); color: var(--wallet-fg); }
.panel-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 21px; color: var(--wallet-title); }
.panel-body { max-width: 720px; margin: 0 auto; display: grid; gap: 14px; padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.prow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); }
.prow-name { font-size: 14.5px; font-weight: 800; color: var(--text-strong); }
.prow-meta { font-size: 12px; font-weight: 700; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
.seg-btn { min-height: 46px; padding: 8px; border: 2px solid var(--border-strong); border-radius: 12px; background: var(--surface); font-size: 13.5px; font-weight: 800; line-height: 1.3; color: var(--text); }
.seg-btn small { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.seg-btn.on { border-color: var(--primary-deep); background: var(--buy-bg); color: var(--buy-fg); }
.field { display: grid; gap: 4px; font-size: 13px; font-weight: 800; color: var(--muted-2); }
.field input[type="text"], .field input[type="number"] { width: 100%; padding: 10px 12px; border: 2px solid var(--border-strong); border-radius: 12px; background: var(--surface); color: var(--text-strong); font-size: 16px; font-weight: 700; }
.field input[type="range"] { width: 100%; accent-color: var(--primary-deep); }
.img-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 620px) { .img-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.img-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 6px 2px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface); text-align: center; }
.img-cell.ok { border-color: var(--good-bd); background: var(--good-bg); }
.img-cell .nm { max-width: 100%; font-size: 11px; font-weight: 800; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.img-cell .no { font-size: 9.5px; font-weight: 800; color: var(--muted); }
.img-cell canvas, .img-cell img { width: 52px; height: 52px; object-fit: contain; }
.split-stage { position: relative; overflow: auto; max-height: 60vh; border-radius: 12px; background: var(--surface-2); border: 2px solid var(--border); }
.split-stage canvas { display: block; max-width: none; touch-action: none; }
.progress { height: 12px; border-radius: 999px; background: var(--border); overflow: hidden; }
.progress i { display: block; height: 12px; background: var(--good-fg); transition: width 0.2s; }

/* ── 알림 · 확인창 · 효과 ── */
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 1300;
  width: max-content; max-width: min(520px, calc(100vw - 32px));
  padding: 12px 18px; border-radius: 22px;
  background: var(--toast-bg); color: var(--toast-fg);
  font-size: 14px; font-weight: 800; line-height: 1.45; text-align: center;
  box-shadow: 0 6px 16px var(--shadow-strong);
  opacity: 0; transform: translate(-50%, 12px); pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.modal {
  position: fixed; inset: 0; z-index: 1200;
  display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--scrim);
}
.modal-box { width: 100%; max-width: 380px; padding: 20px; border-radius: 20px; background: var(--surface); color: var(--text); box-shadow: 0 20px 40px var(--shadow-strong); }
.modal-title { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 22px; color: var(--text-strong); }
.modal-body { font-size: 14.5px; line-height: 1.6; color: var(--muted-2); }
.gate-q { margin-top: 10px; font-size: 16px; color: var(--text-strong); }

/* =========================================================
   v3.3 · 말판 = 화면 가득 서울 지도 · 남산 보름달 · 배틀 장면
   ========================================================= */
:root {
  --map-sea: #d7eef4;
  --map-sea-dot: rgba(14, 116, 144, 0.10);
  --hud-chip: rgba(255, 255, 255, 0.9);
  --hud-panel: rgba(255, 255, 255, 0.94);
  --hud-line: rgba(15, 23, 42, 0.10);
  --night-veil: 0.5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --map-sea: #0a1a24;
    --map-sea-dot: rgba(125, 211, 252, 0.07);
    --hud-chip: rgba(19, 28, 46, 0.88);
    --hud-panel: rgba(19, 28, 46, 0.95);
    --hud-line: rgba(226, 232, 240, 0.12);
    --night-veil: 0.38;
  }
}
:root[data-theme="dark"] {
  --map-sea: #0a1a24;
  --map-sea-dot: rgba(125, 211, 252, 0.07);
  --hud-chip: rgba(19, 28, 46, 0.88);
  --hud-panel: rgba(19, 28, 46, 0.95);
  --hud-line: rgba(226, 232, 240, 0.12);
  --night-veil: 0.38;
}

.stage-wrap {
  --stage-h: 560px;
  position: relative;
  height: var(--stage-h);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  overflow: hidden;
  background-color: var(--map-sea);
  background-image: radial-gradient(var(--map-sea-dot) 1.2px, transparent 1.6px);
  background-size: 14px 14px;
  border-block: 2px solid var(--border);
}
@media (min-width: 860px) {
  .stage-wrap { margin-left: 0; margin-right: 0; border: 2px solid var(--border); border-radius: 18px; }
}
.stage { position: absolute; inset: 0; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scrollbar-width: none; touch-action: pan-x pan-y; }
.stage::-webkit-scrollbar { display: none; }
.stage-map { --u: 1; position: relative; height: 100%; }
.stage-map svg { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-select: none; touch-action: pan-x pan-y; }
.tk-layer { position: absolute; inset: 0; pointer-events: none; transition: filter 0.8s ease; }
.no-tr .tk2 { transition: none !important; }
.stage-wrap.night .tk-layer { filter: brightness(0.85); }

/* 말: 고른 포켓몬이 칸 위에 서서 다녀요 */
.tk2 { position: absolute; left: 0; top: 0; width: 0; height: 0; transition: transform 0.24s ease-out; }
.tk2-in { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.tk2-ring { position: absolute; left: calc(var(--u) * -11px); top: calc(var(--u) * -4px); width: calc(var(--u) * 22px); height: calc(var(--u) * 8px); border-radius: 50%; background: var(--pc); opacity: 0.85; box-shadow: 0 0 0 calc(var(--u) * 1.2px) #ffffff, 0 calc(var(--u) * 1px) calc(var(--u) * 3px) rgba(15, 23, 42, 0.45); }
.tk2-mon { position: absolute; left: 0; bottom: calc(var(--u) * -1.5px); height: calc(var(--u) * 27px); width: auto; max-width: none; transform: translateX(-50%); filter: drop-shadow(0 calc(var(--u) * 1.4px) calc(var(--u) * 1px) rgba(15, 23, 42, 0.4)); -webkit-user-drag: none; }
.tk2-mon.still { height: calc(var(--u) * 31px); bottom: calc(var(--u) * -4px); }
.tk2-pawn { position: absolute; left: calc(var(--u) * -7px); bottom: 0; width: calc(var(--u) * 14px); height: calc(var(--u) * 20px); border-radius: 50% 50% 30% 30% / 40% 40% 20% 20%; background: var(--pc); border: calc(var(--u) * 1.5px) solid #ffffff; box-shadow: 0 calc(var(--u) * 1px) calc(var(--u) * 2px) rgba(15, 23, 42, 0.35); }
.tk2-emb { position: absolute; left: calc(var(--u) * -10px); bottom: 0; display: grid; place-items: center; width: calc(var(--u) * 20px); height: calc(var(--u) * 20px); border-radius: 50%; border: calc(var(--u) * 1.5px) solid #ffffff; background: radial-gradient(circle at 35% 30%, var(--th), var(--tc) 72%); font-size: calc(var(--u) * 11px); line-height: 1; }
.tk2-name { position: absolute; left: 0; top: calc(var(--u) * 4.5px); transform: translateX(-50%); padding: 1px 7px; border-radius: 999px; background: var(--pc); color: #ffffff; font-size: 11px; font-weight: 800; line-height: 1.4; white-space: nowrap; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.35); }
.tk2.turn .tk2-name { box-shadow: 0 0 0 2px var(--wallet-title), 0 1px 3px rgba(15, 23, 42, 0.35); }
.tk2.hop .tk2-in { animation: hop2 0.26s ease-out; }
@keyframes hop2 { 0% { transform: translateY(0) scale(1.06, 0.9); } 45% { transform: translateY(calc(var(--u) * -10px)) scale(0.95, 1.07); } 100% { transform: translateY(0) scale(1, 1); } }

/* 지도 위에 떠 있는 칩 · 버튼 · 말풍선 */
.hud { position: absolute; left: 0; right: 0; z-index: 3; pointer-events: none; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
.hud > * { pointer-events: auto; }
.hud-top { top: 0; display: grid; gap: 6px; padding-top: 8px; }
.hud-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -2px; padding: 0 2px 2px; }
.hud-chips::-webkit-scrollbar { display: none; }
.hud-chips .chip { flex: 0 0 auto; background: var(--hud-chip); color: var(--text-strong); box-shadow: 0 1px 4px var(--shadow-strong); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.turn-strip { display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 10px; border-radius: 999px; background: var(--hud-panel); box-shadow: 0 2px 8px var(--shadow-strong); justify-self: stretch; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.turn-strip::-webkit-scrollbar { display: none; }
.turn-strip b { font-family: var(--font-display); font-weight: 400; font-size: 15px; color: var(--text-strong); white-space: nowrap; }
.ts-p { display: inline-flex; align-items: center; gap: 4px; flex: 0 0 auto; padding: 1px 8px 1px 2px; border-radius: 999px; font-size: 12px; font-weight: 800; color: var(--muted-2); white-space: nowrap; }
.ts-p i { width: 20px; height: 20px; border-radius: 50%; background: var(--pc); box-shadow: inset 0 0 0 2px #ffffff; }
.ts-p.on { background: var(--pc); color: #ffffff; }
.ts-skip { flex: 0 0 auto; margin-left: auto; padding: 3px 10px; border: 2px solid var(--border-strong); border-radius: 999px; background: var(--surface); color: var(--text-strong); font-size: 12px; font-weight: 800; white-space: nowrap; }
.hud-bottom { bottom: 0; padding-bottom: 10px; }
.roll-bar { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px; border-radius: 22px; background: var(--hud-panel); border: 2px solid var(--hud-line); box-shadow: 0 8px 24px var(--shadow-strong); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

/* =========================================================
   v3.4 · 칸 속성 · 계절 지도 · 말판의 야생 포켓몬 · 팀 배틀 · 볼 · 경험치
   ========================================================= */
:root {
  --xp: #3b82f6;
  --xp-bg: #dbeafe;
  --tp-on: #fff7ed;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --xp: #60a5fa; --xp-bg: #0d2347; --tp-on: #33190a; }
}
:root[data-theme="dark"] { --xp: #60a5fa; --xp-bg: #0d2347; --tp-on: #33190a; }

/* 칸 속성 동그라미 (칸 모서리) */
.nt { pointer-events: none; }
.nt circle { fill: #94a3b8; stroke: #ffffff; stroke-width: 1.1; transition: fill 0.5s ease; }

.nt-in { transform-box: fill-box; transform-origin: center; }

@keyframes ntFlip { 0% { transform: scale(0.3) rotate(-180deg); opacity: 0.3; } 60% { transform: scale(1.7) rotate(20deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); } }
.sw-type { width: 11px; height: 11px; border-radius: 50%; background: conic-gradient(var(--t-water) 0 33%, var(--t-fire) 0 66%, var(--t-grass) 0); box-shadow: 0 0 0 1.5px #ffffff; }

.stage-wrap.season-1 { --map-land: #d9f99d; --map-border: #bef264; --map-edge: #4d7c0f; }
.stage-wrap.season-2 { --map-land: #fde8cc; --map-border: #fcd9a8; --map-edge: #c2410c; --map-home: #fcd34d; }
.stage-wrap.season-3 { --map-land: #f1f5f9; --map-border: #e2e8f0; --map-edge: #94a3b8; --map-home: #dbeafe; --map-river: #bae6fd; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .stage-wrap.season-1 { --map-land: #16301a; --map-border: #1f4224; --map-edge: #4d7c0f; }
  :root:not([data-theme="light"]) .stage-wrap.season-2 { --map-land: #33240f; --map-border: #422f15; --map-edge: #9a3412; --map-home: #4a3a12; }
  :root:not([data-theme="light"]) .stage-wrap.season-3 { --map-land: #1c2533; --map-border: #263246; --map-edge: #64748b; --map-home: #1e3350; --map-river: #24476e; }
}
:root[data-theme="dark"] .stage-wrap.season-1 { --map-land: #16301a; --map-border: #1f4224; --map-edge: #4d7c0f; }
:root[data-theme="dark"] .stage-wrap.season-2 { --map-land: #33240f; --map-border: #422f15; --map-edge: #9a3412; --map-home: #4a3a12; }
:root[data-theme="dark"] .stage-wrap.season-3 { --map-land: #1c2533; --map-border: #263246; --map-edge: #64748b; --map-home: #1e3350; --map-river: #24476e; }
.season-deco .sd { font-size: 9px; text-anchor: middle; dominant-baseline: central; opacity: 0.8; transform-box: fill-box; transform-origin: center; animation: sdSway 3.2s ease-in-out infinite; }
@keyframes sdSway { 0%, 100% { transform: rotate(-8deg) translateY(0); } 50% { transform: rotate(8deg) translateY(-1.5px); } }

/* 말판에서 노는 야생 포켓몬 */
.wd { position: absolute; left: 0; top: 0; width: 0; height: 0; transition: transform 0.24s ease-out; }
.wd-in { position: absolute; left: 0; top: 0; width: 0; height: 0; animation: wdBob 2.6s ease-in-out infinite; }
.wd-grass { position: absolute; left: calc(var(--u) * -10px); top: calc(var(--u) * -3.5px); width: calc(var(--u) * 20px); height: calc(var(--u) * 7px); border-radius: 50%; background: radial-gradient(closest-side, var(--tc), transparent); opacity: 0.55; }
.wd-mon { position: absolute; left: 0; bottom: calc(var(--u) * -1px); height: calc(var(--u) * 21px); width: auto; max-width: none; transform: translateX(-50%); filter: drop-shadow(0 calc(var(--u) * 1px) calc(var(--u) * 1px) rgba(15, 23, 42, 0.35)); -webkit-user-drag: none; }
.wd-mon.still { height: calc(var(--u) * 25px); bottom: calc(var(--u) * -3px); }
.wd .tk2-emb { width: calc(var(--u) * 16px); height: calc(var(--u) * 16px); left: calc(var(--u) * -8px); font-size: calc(var(--u) * 9px); }
.wd-mark { position: absolute; left: calc(var(--u) * 3px); top: calc(var(--u) * -27px); display: grid; place-items: center; width: calc(var(--u) * 7.5px); height: calc(var(--u) * 7.5px); border-radius: 50%; background: #facc15; color: #0f172a; font-size: calc(var(--u) * 5.6px); font-weight: 900; line-height: 1; box-shadow: 0 0 0 calc(var(--u) * 0.9px) #ffffff, 0 1px 3px rgba(15, 23, 42, 0.35); animation: wdMark 1.3s ease-in-out infinite; }
.wd.legend .wd-mark { background: #a855f7; color: #ffffff; }
.wd.legend .wd-grass { opacity: 0.9; box-shadow: 0 0 calc(var(--u) * 6px) #facc15; }
.wd.pop .wd-in { animation: wdPop 0.7s cubic-bezier(0.3, 1.6, 0.5, 1), wdBob 2.6s ease-in-out 0.7s infinite; }
@keyframes wdBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(calc(var(--u) * -1.3px)); } }
@keyframes wdPop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
