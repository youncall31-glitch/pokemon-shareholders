        delta: {}, changes: {},
      };
      if (isObj(nt.delta)) Object.keys(nt.delta).forEach((k) => { st.night.delta[k] = Math.round(num(nt.delta[k], 0)); });
      if (isObj(nt.changes)) RING.forEach((c) => { st.night.changes[c] = num(nt.changes[c], 0); });
    }
    const mt = raw.meeting;
    if (isObj(mt) && COMP[mt.cid]) {
      const m = {
        id: int(mt.id, 1, 1, 1e9), day: int(mt.day, st.day, 1, 1e7), cid: mt.cid, earn: int(mt.earn, 10000, 0, 1e7), per: int(mt.per, 100, 0, 1e5),
        npcA: int(mt.npcA, 40, 0, 100), npcB: int(mt.npcB, 40, 0, 100), votes: {}, weights: {}, result: mt.result === 'a' || mt.result === 'b' ? mt.result : '', paid: {},
        A: int(mt.A, 0, 0, 1000), B: int(mt.B, 0, 0, 1000),
      };
      if (isObj(mt.votes)) Object.keys(mt.votes).forEach((pid) => { if (playerById(st, pid)) { m.votes[pid] = mt.votes[pid] === 'b' ? 'b' : 'a'; m.weights[pid] = int(mt.weights && mt.weights[pid], 1, 0, 100); } });
      if (isObj(mt.paid)) Object.keys(mt.paid).forEach((pid) => { m.paid[pid] = int(mt.paid[pid], 0, 0, 1e7); });
      st.meeting = m;
    }
    // 칸 속성 지도 · 계절 (예전 저장이면 첫 바퀴 지도로 시작해요)
    const maxLap = Math.max.apply(null, st.players.map((p) => p.laps));
    const mp = raw.map;
    if (isObj(mp) && Array.isArray(mp.types)) {
      st.map = {
        lap: int(mp.lap, maxLap, 0, 99999), season: int(mp.season, 0, 0, SEASONS.length - 1), n: int(mp.n, 0, 0, 1e9),
        types: PLACES.map((pl, i) => (pl.kind === 'home' ? '' : pl.cid || (TYPES[mp.types[i]] ? mp.types[i] : pl.type || 'normal'))),
      };
    } else {
      st.map = newMap(maxLap);
    }
    // 말판에서 노는 야생 포켓몬
    st.wilds = [];
    const wAt = {};
    (Array.isArray(raw.wilds) ? raw.wilds : []).slice(0, MAX_WILDS).forEach((w) => {
      if (!isObj(w) || !SP[w.sp] || typeof w.id !== 'string' || !/^w\d{1,9}$/.test(w.id)) return;
      const at = int(w.at, -1, -1, NP - 1);
      if (at < 0 || wAt[at] || PLACES[at].kind === 'home' || PLACES[at].kind === 'gym') return;
      wAt[at] = true;
      st.wilds.push({ id: w.id, at, sp: w.sp, until: int(w.until, st.day + 3, 1, 1e7) });
    });
    st.wseq = Math.max(int(raw.wseq, 0, 0, 1e9), 0, ...st.wilds.map((w) => Number(w.id.slice(1))));
    st.pending = sanitizePending(raw.pending, st);
    const lm = raw.lastMove;
    if (isObj(lm) && playerById(st, lm.pid)) st.lastMove = { pid: lm.pid, from: int(lm.from, 0, 0, NP - 1), face: int(lm.face, 1, 1, 6), to: int(lm.to, 0, 0, NP - 1), n: int(lm.n, 0, 0, 1e9) };
    if (Array.isArray(raw.log)) st.log = raw.log.filter((l) => isObj(l) && typeof l.t === 'string').slice(0, 40).map((l) => ({ d: int(l.d, 1, 1, 1e7), pid: str(l.pid, '', 8), t: l.t.slice(0, 200) }));
    return st;
  }

  /* ── 예전 게임(v2)에서 돈과 포켓몬 가져오기 ── */
  function importOld(raw, st) {
    if (!isObj(raw) || raw.v !== 2) return false;
    const p = st.players[0];
    let cash = Math.max(0, num(raw.cash, 0));
    if (isObj(raw.market)) {
      Object.keys(raw.market).forEach((k) => {
        const m = raw.market[k];
        if (isObj(m)) cash += Math.max(0, Math.floor(num(m.shares, 0))) * Math.max(0, num(m.price, 0));
      });
    }
    let extra = 0;
    if (isObj(raw.pokemon)) {
      Object.keys(raw.pokemon).forEach((name) => {
        const sp = SP_BY_NAME[name];
        const lv = oldLv(int(raw.pokemon[name] && raw.pokemon[name].lv, 1, 1, 10));
        if (!sp) { extra += 300; return; }
        addMon(st, p, sp);
        const m = p.mons[FAM_OF[sp]];
        if (m) m.lv = Math.max(m.lv, lv);
      });
    }
    p.cash = Math.max(START_CASH, Math.round(cash)) + extra;
    p.hist = [p.cash];
    const fams = Object.keys(p.mons);
    if (fams.length) {
      p.starter = true;
      p.partner = fams.sort((a, b) => powerOf(p.mons[b]) - powerOf(p.mons[a]))[0];
    }
    if (Array.isArray(raw.coupons)) {
      p.coupons = raw.coupons.filter((c) => isObj(c) && typeof c.id === 'string' && typeof c.name === 'string').slice(-50)
        .map((c) => ({ id: c.id.slice(0, 40), name: c.name.slice(0, 40), date: str(c.date, '', 10) }));
    }
    if (isObj(raw.stats)) ['wins', 'losses', 'draws', 'trades'].forEach((k) => { p.stats[k] = int(raw.stats[k], 0, 0, 1e9); });
    st.importedOld = true;
    addLog(st, p, '📦 예전 게임에서 돈과 포켓몬을 가져왔어요');
    return true;
  }

  /* =========================================================
     4. 저장 — 이 기기 · 내 Claude 계정 · 같이 하는 방(여러 폰)
     ========================================================= */
  const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
  const ONLINE_KEY = 'pokemon-shareholders-online';
  const store = { mode: 'local', st: null, me: null, code: '' };
  const caps = { db: null, user: null, assets: null, uid: null };

  const local = {
    ok: false,
    test() {
      try { const k = SAVE_KEY + '-check'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; }
    },
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* 무시 */ } },
  };
  function readJSON(k) {
    const r = local.get(k);
    if (!r) return null;
    try { return JSON.parse(r); } catch (e) { return null; }
  }
  let device = '';
  function deviceId() {
    if (device) return device;
    device = local.get(DEVICE_KEY) || '';
    if (!/^d[a-z0-9]{6,16}$/.test(device)) { device = 'd' + rid(10); local.set(DEVICE_KEY, device); }
    return device;
  }

  // ── 혼자 · 한 폰 게임: 이 기기 + 내 계정(비공개) ──
  let localState = null;
  function writeLocal() {
    if (!local.ok || !localState) return;
    if (!local.set(SAVE_KEY, JSON.stringify(localState))) { local.ok = false; updateSaveBadge(); }
  }
  function saveLocal() {
    if (!localState) return;
    localState.savedAt = Date.now();
    writeLocal();
    cloudQueue();
  }
  const cloud = { ref: null, writing: false, dirty: false, timer: 0, dead: false, retried: false };
  function cloudQueue(delay) {
    if (!cloud.ref || cloud.dead) return;
    clearTimeout(cloud.timer);
    cloud.timer = setTimeout(cloudFlush, delay == null ? 1500 : delay);
  }
  async function cloudFlush() {
    clearTimeout(cloud.timer);
    cloud.timer = 0;
    if (!cloud.ref || cloud.dead || !localState) return;
    if (cloud.writing) { cloud.dirty = true; return; }
    cloud.writing = true;
    cloud.dirty = false;
    try {
      await cloud.ref.set({ v: VERSION, savedAt: localState.savedAt, state: JSON.parse(JSON.stringify(localState)) });
      cloud.retried = false;
    } catch (err) {
      const code = err && err.code;
      if (code === 'unavailable' || code === 'resource_exhausted') {
        if (!cloud.retried) { cloud.retried = true; cloud.dirty = true; } else { cloud.retried = false; }
      } else {
        cloud.dead = true;
        updateSaveBadge();
        if (code === 'quota_exceeded') toast('☁️ 계정 저장 공간이 꽉 찼어요. 이 기기에만 저장할게요.', 3600);
      }
    } finally {
      cloud.writing = false;
      if (cloud.dirty && !cloud.dead) cloudQueue(900 + Math.random() * 900);
    }
  }
  function cloudFlushNow() {
    if (cloud.timer) cloudFlush();
  }
  async function getWithRetry(ref) {
    try {
      return await ref.get();
    } catch (err) {
      if (!err || err.code !== 'unavailable') throw err;
      await sleep(500 + Math.random() * 700);
      return ref.get();
    }
  }

  // ── 여러 폰: 같이 하는 방 (games/<방 번호>) ──
  const net = { ref: null, lock: null, unsub: null, code: '', noLock: false };
  function netSaved() {
    const o = readJSON(ONLINE_KEY);
    return o && /^\d{4}$/.test(o.code) && typeof o.pid === 'string' ? o : null;
  }
  async function netRun(fn) {
    if (!net.ref) throw { code: 'gone' };
    let got = net.noLock;
    for (let i = 0; i < 12 && !got; i++) {
      try {
        const r = await net.lock.acquire({ holder: deviceId(), ttlMs: 4000 });
        got = !!(r && r.acquired);
      } catch (e) {
        if (e && (e.code === 'capability_removed' || e.code === 'capability_disabled' || e.code === 'transform_error')) { net.noLock = true; got = true; break; }
        if (!e || e.code !== 'unavailable') throw e;
      }
      if (!got) await sleep(250 + Math.random() * 350);
    }
    if (!got) throw { code: 'busy' };
    const snap = await getWithRetry(net.ref);
    const body = snap && snap.exists ? snap.data() : null;
    const st = body && body.state ? sanitize(JSON.parse(JSON.stringify(body.state))) : null;
    if (!st) throw { code: 'gone' };
    const res = fn(st);
    if (res && res.ok) {
      st.savedAt = Date.now();
      await net.ref.set(roomBody(st));
      if (!store.st || st.rev >= store.st.rev) store.st = st;
    }
    return res;
  }
  function roomBody(st) {
    return { v: VERSION, code: net.code, updatedAt: Date.now(), names: st.players.map((p) => p.name).join(','), state: JSON.parse(JSON.stringify(st)) };
  }
  function netSubscribe() {
    if (net.unsub) { try { net.unsub(); } catch (e) { /* 무시 */ } }
    net.unsub = net.ref.onSnapshot((snap) => {
      const body = snap.exists ? snap.data() : null;
      const st = body && body.state ? sanitize(JSON.parse(JSON.stringify(body.state))) : null;
      if (!st) { if (snap.exists === false && store.mode === 'online') { toast('같이 하던 방이 없어졌어요. 혼자 하기로 돌아갈게요.', 3600); leaveRoom(true); } return; }
      if (store.st && st.rev < store.st.rev) return;
      store.st = st;
      if (!playerById(st, store.me)) { toast('방에서 내 카드가 사라졌어요. 다시 골라 주세요.', 3400); openSheet({ k: 'together' }); }
      onState();
    }, (err) => {
      if (err && err.code === 'unavailable') setTimeout(() => { if (store.mode === 'online') netSubscribe(); }, 3000);
      else updateSaveBadge();
    });
  }
  async function openRoom(code, pid) {
    const ref = caps.db.doc('games/' + code);
    const snap = await getWithRetry(ref);
    const body = snap && snap.exists ? snap.data() : null;
    const st = body && body.state ? sanitize(JSON.parse(JSON.stringify(body.state))) : null;
    if (!st) return false;
    net.ref = ref;
    net.lock = caps.db.doc('games/' + code + '/meta/lock');
    net.code = code;
    store.mode = 'online';
    store.code = code;
    store.st = st;
    store.me = playerById(st, pid) ? pid : st.players[0].pid;
    local.set(ONLINE_KEY, JSON.stringify({ code, pid: store.me }));
    netSubscribe();
    return true;
  }
  async function createRoom() {
    for (let i = 0; i < 8; i++) {
      const code = String(1000 + rnd(9000));
      const ref = caps.db.doc('games/' + code);
      const snap = await getWithRetry(ref);
      if (snap && snap.exists) continue;
      const st = sanitize(JSON.parse(JSON.stringify(localState)));
      st.pending = null;
      st.savedAt = Date.now();
      net.code = code;
      await ref.set(roomBody(st));
      const ok2 = await openRoom(code, viewerLocalPid());
      return ok2 ? code : '';
    }
    return '';
  }
  async function listRooms() {
    if (!caps.db) return [];
    const snap = await caps.db.collection('games').orderBy('updatedAt', 'desc').limit(8).get();
    return snap.docs.filter((d) => /^\d{4}$/.test(d.id)).map((d) => {
      const b = d.data() || {};
      const st = isObj(b.state) ? b.state : {};
      const players = Array.isArray(st.players) ? st.players.filter((p) => isObj(p) && typeof p.pid === 'string').map((p) => ({ pid: p.pid, name: str(p.name, '친구', 10), color: PLAYER_COLORS.indexOf(p.color) >= 0 ? p.color : 'blue' })) : [];
      return { code: d.id, updatedAt: num(b.updatedAt, 0), day: int(st.day, 1, 1, 1e7), players };
    }).filter((r) => r.players.length);
  }
  function leaveRoom(silent) {
    if (net.unsub) { try { net.unsub(); } catch (e) { /* 무시 */ } }
    net.unsub = null;
    net.ref = null;
    net.code = '';
    local.del(ONLINE_KEY);
    store.mode = 'local';
    store.code = '';
    store.me = null;
    store.st = localState;
    ui.seenMove = store.st.lastMove ? store.st.lastMove.n : -1;
    if (!silent) toast('📱 이 폰은 다시 혼자 하기(한 폰)로 돌아왔어요');
    onState();
  }

  // ── 누가 보고 있나 ──
  function viewerLocalPid() {
    const st = localState;
    return isMulti(st) ? currentPlayer(st).pid : st.players[0].pid;
  }
  function viewer() {
    const st = store.st;
    if (store.mode === 'online') return playerById(st, store.me) || st.players[0];
    return isMulti(st) ? currentPlayer(st) : st.players[0];
  }

  // ── 동작 보내기 (혼자면 바로, 여러 폰이면 방에 차례대로) ──
  async function dispatch(type, a, opts) {
    if (ui.busy) return null;
    const pid = (opts && opts.pid) || viewer().pid;
    let res;
    if (store.mode === 'online') {
      ui.busy = true;
      ui.rolling = type === 'roll';
      setBusy(true);
      try {
        res = await netRun((st) => act(st, pid, type, a));
      } catch (e) {
        res = { ok: false, msg: e && e.code === 'busy' ? '다른 폰이 움직이는 중이에요. 잠깐 뒤에 다시 눌러 주세요.' : e && e.code === 'gone' ? '같이 하던 방을 찾을 수 없어요.' : '연결이 잠깐 끊겼어요. 다시 눌러 주세요.' };
      }
      ui.busy = false;
      ui.rolling = false;
      setBusy(false);
    } else {
      res = act(store.st, pid, type, a);
      if (res.ok) saveLocal();
    }
    afterAct(type, a || {}, res || { ok: false });
    return res;
  }

  /* =========================================================
     5. 포켓몬 그림 — 엄마·아빠가 올린 그림, 없으면 타입 엠블럼
     ========================================================= */
  const IMG = {}; // 도감 번호 → 엄마·아빠가 직접 넣은 그림(자산) id
  const IMG_DOC = 'shared/images';
  // 받은 그림(기본 그림): 시작할 때 짧은 blob: 주소로 바꿔 두고, 안 되면 data: 그대로 써요
  const EMBED = {};
  let embedBlobs = false;
  (function prepEmbed() {
    const keys = Object.keys(EMBED_IMG);
    keys.forEach((k) => { EMBED[k] = EMBED_IMG[k]; });
    try {
      keys.forEach((k) => {
        const m = /^data:([^;]+);base64,(.*)$/.exec(EMBED_IMG[k]);
        const bin = atob(m[2]);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        EMBED[k] = URL.createObjectURL(new Blob([arr], { type: m[1] }));
      });
      embedBlobs = true;
    } catch (e) {
      keys.forEach((k) => { EMBED[k] = EMBED_IMG[k]; });
    }
  })();
  // blob: 그림이 막힌 화면이면 data: 그림으로 바꿔요
  function embedFallback() {
    if (!embedBlobs) return false;
    embedBlobs = false;
    Object.keys(EMBED_IMG).forEach((k) => { EMBED[k] = EMBED_IMG[k]; });
    board.tokensKey = '';
    setTimeout(() => render(true), 0);
    return true;
  }
  const img = { ref: null, unsub: null };
  // Claude 밖(혼자 열리는 파일)에서는 인터넷의 움직이는 그림을 써요
  // 큰 공식 일러스트(475px) → 안 되면 HOME 그림(512px) → 그래도 안 되면 타입 엠블럼
  const SPRITE_ART = (n) => 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/' + n + '.png';
  const SPRITE_HOME = (n) => 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/' + n + '.png';
  let spritesOn = false;
  const artFail = new Set();
  const homeFail = new Set();
  const validId = (id) => typeof id === 'string' && /^[A-Za-z0-9_-]{8,64}$/.test(id);

  function imgUrl(dex) {
    if (IMG[dex]) return '/_blob/' + IMG[dex];
    if (EMBED[dex]) return EMBED[dex];
    if (spritesOn && !IN_CLAUDE && !(artFail.has(dex) && homeFail.has(dex))) return artFail.has(dex) ? SPRITE_HOME(dex) : SPRITE_ART(dex);
    return null;
  }
  const imgCount = () => SPECIES_KEYS.filter((k) => IMG[SP[k].dex] || EMBED[SP[k].dex]).length;

  // ── 움직이는 포켓몬: 작은 GIF를 AI로 4배 선명하게 다시 그린 움직이는 그림 (sprites/ 폴더) ──
  // 배틀 · 말판 말 · 내 포켓몬 카드 · 뽑기 결과에 써요. 도감 166칸은 가벼운 멈춘 그림 그대로예요.
  const ANIM_PREF_KEY = 'pokemon-shareholders-anim';
  const animFail = new Set();
  let animPref = true;
  try { animPref = localStorage.getItem(ANIM_PREF_KEY) !== 'off'; } catch (e) { /* 기억 못 해도 괜찮아요 */ }
  function setAnimPref(on) {
    animPref = !!on;
    try { localStorage.setItem(ANIM_PREF_KEY, on ? 'on' : 'off'); } catch (e) { /* 기억 못 해도 괜찮아요 */ }
  }
  // 엄마·아빠가 직접 넣은 그림이 있으면 그 그림이 먼저예요. 뒷모습이 없으면 앞모습을 뒤집어서 써요.
  function animOf(dex, back) {
    if (!animPref || IMG[dex]) return null;
    const k = (back ? 'b' : 'f') + dex;
    if (ANIM_DIMS[k] && !animFail.has(k)) return { src: SPRITE_BASE + k + '.webp', w: ANIM_DIMS[k][0], h: ANIM_DIMS[k][1], key: k, flip: false };
    if (back) {
      const f = animOf(dex, false);
      return f ? Object.assign({}, f, { flip: true }) : null;
    }
    return null;
  }
  function animImg(sp, cls) {
    const s = SP[sp];
    const a = animOf(s.dex, false);
    if (!a) return '';
    return '<img class="' + cls + ' anim" src="' + a.src + '" data-dex="' + s.dex + '" data-sp="' + sp + '" data-anim="' + a.key + '" alt="' + esc(s.name) + '" decoding="async">';
  }
  const customCount = () => SPECIES_KEYS.filter((k) => IMG[SP[k].dex]).length;
  function emblemHTML(sp, label) {
    const t = SP[sp] ? SP[sp].type : 'normal';
    return '<div class="emblem t-' + t + '" role="img" aria-label="' + esc((label || '') + ' (' + TYPES[t].name + ' 타입)') + '"><span class="emblem-icon" aria-hidden="true">' + TYPES[t].icon + '</span></div>';
  }
  function visHTML(sp, cls, anim) {
    const s = SP[sp];
    const moving = anim ? animImg(sp, 'poke-img') : '';
    if (moving) return '<div class="vis' + (cls ? ' ' + cls : '') + '">' + moving + '</div>';
    const url = imgUrl(s.dex);
    const inner = url
      ? '<img class="poke-img" src="' + url + '" data-dex="' + s.dex + '" data-sp="' + sp + '" alt="' + esc(s.name) + '" loading="lazy" decoding="async">'
      : emblemHTML(sp, s.name);
    return '<div class="vis' + (cls ? ' ' + cls : '') + '">' + inner + '</div>';
  }
  function miniEm(sp, extra, anim) {
    const add = extra ? ' ' + extra : '';
    if (!sp) return '<span class="mini-em pawn-em' + add + '" role="img" aria-label="기본 말"></span>';
    const s = SP[sp];
    const moving = anim ? animImg(sp, '') : '';
    if (moving) return '<span class="mini-em photo moving' + add + '">' + moving + '</span>';
    const url = imgUrl(s.dex);
    if (url) return '<span class="mini-em photo' + add + '"><img src="' + url + '" alt="' + esc(s.name) + '" data-dex="' + s.dex + '" data-sp="' + sp + '" loading="lazy" decoding="async"></span>';
    return '<span class="mini-em t-' + s.type + add + '" role="img" aria-label="' + esc(s.name) + '">' + TYPES[s.type].icon + '</span>';

  // 그림을 못 불러오면: 움직이는 그림 → 멈춘 그림 → 타입 엠블럼

  const split = {

  function cellRect(dex) {
    const i = dex - split.start;
    if (i < 0 || i >= split.cols * split.rows) return null;
    const cw = cellW();
    const ch = cellH();
    const c = i % split.cols;
    const r = Math.floor(i / split.cols);

  // 잘라 낸 칸 → 테두리와 같은 색 배경을 투명하게 → 그림만 남기고 정사각형으로
  function processCrop(rect, outMax) {
    const sw = Math.max(1, Math.round(rect.w));
    const sh = Math.max(1, Math.round(rect.h));
    const scale = Math.min(1, 320 / Math.max(sw, sh));
    const w = Math.max(1, Math.round(sw * scale));
    const h = Math.max(1, Math.round(sh * scale));
    const cv = document.createElement('canvas');
    cv.width = w;
    cv.height = h;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(split.im, rect.x, rect.y, rect.w, rect.h, 0, 0, w, h);
    let data;
    try { data = ctx.getImageData(0, 0, w, h); } catch (e) { return cv; }
    const px = data.data;
    if (split.clear) {
      // 테두리에서 가장 많은 색 = 배경
      const counts = {};
      let bestKey = '';
      let best = 0;
      const sample = (x, y) => {
        const o = (y * w + x) * 4;
        if (px[o + 3] < 30) return;
        const key = (px[o] >> 4) + ',' + (px[o + 1] >> 4) + ',' + (px[o + 2] >> 4);
        counts[key] = (counts[key] || 0) + 1;
        if (counts[key] > best) { best = counts[key]; bestKey = key; }
      };
      for (let x = 0; x < w; x++) { sample(x, 0); sample(x, h - 1); }
      for (let y = 0; y < h; y++) { sample(0, y); sample(w - 1, y); }
      if (bestKey) {
        const bg = bestKey.split(',').map((v) => Number(v) * 16 + 8);
        const near = (o) => px[o + 3] < 30 || (Math.abs(px[o] - bg[0]) + Math.abs(px[o + 1] - bg[1]) + Math.abs(px[o + 2] - bg[2]) < 70);
        const seen = new Uint8Array(w * h);
        const stack = [];
        const push = (x, y) => { const i = y * w + x; if (!seen[i] && near(i * 4)) { seen[i] = 1; stack.push(i); } };
        for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
        for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }
        while (stack.length) {
          const i = stack.pop();
          px[i * 4 + 3] = 0;
          const x = i % w;
          const y = (i - x) / w;
          if (x > 0) push(x - 1, y);
          if (x < w - 1) push(x + 1, y);
          if (y > 0) push(x, y - 1);
          if (y < h - 1) push(x, y + 1);
        }
        ctx.putImageData(data, 0, 0);
      }
    }
    // 그림이 있는 곳만
    let x0 = w;
    let y0 = h;
    let x1 = -1;
    let y1 = -1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (px[(y * w + x) * 4 + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
    }
    if (x1 < 0) { x0 = 0; y0 = 0; x1 = w - 1; y1 = h - 1; }
    const bw = x1 - x0 + 1;
    const bh = y1 - y0 + 1;
    const side = Math.max(bw, bh);
    const size = Math.max(8, Math.min(outMax, Math.round(side * 1.12)));
    const k = size / 1.12 / side;
    const dw = bw * k;
    const dh = bh * k;
    const out = document.createElement('canvas');
    out.width = size;
    out.height = size;
    const oc = out.getContext('2d');
    oc.imageSmoothingEnabled = true;
    oc.drawImage(cv, x0, y0, bw, bh, (size - dw) / 2, (size - dh) / 2, dw, dh);
    return out;
  }
  // 자동으로 칸 찾기: 그림이 있는 줄과 칸의 간격(반복)을 찾아요
  function autoGrid() {
    const s = Math.min(1, 900 / Math.max(split.W, split.H));
    const w = Math.max(1, Math.round(split.W * s));
    const h = Math.max(1, Math.round(split.H * s));
    const cv = document.createElement('canvas');
    cv.width = w;
    cv.height = h;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(split.im, 0, 0, w, h);
    let px;
    try { px = ctx.getImageData(0, 0, w, h).data; } catch (e) { return false; }
    const counts = {};
    let bestKey = '';
    let best = 0;
    const sample = (x, y) => {
      const o = (y * w + x) * 4;
      const key = (px[o + 3] < 30) ? 'a' : (px[o] >> 4) + ',' + (px[o + 1] >> 4) + ',' + (px[o + 2] >> 4);
      counts[key] = (counts[key] || 0) + 1;
      if (counts[key] > best) { best = counts[key]; bestKey = key; }
    };
    for (let x = 0; x < w; x++) { sample(x, 0); sample(x, h - 1); }
    for (let y = 0; y < h; y++) { sample(0, y); sample(w - 1, y); }
    const bg = bestKey === 'a' ? null : bestKey.split(',').map((v) => Number(v) * 16 + 8);
    const fg = (o) => (bg ? px[o + 3] > 40 && Math.abs(px[o] - bg[0]) + Math.abs(px[o + 1] - bg[1]) + Math.abs(px[o + 2] - bg[2]) > 60 : px[o + 3] > 40);
    const colP = new Float64Array(w);
    const rowP = new Float64Array(h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (fg((y * w + x) * 4)) { colP[x] += 1; rowP[y] += 1; }
      }
    }
    const extent = (p, n, other) => {
      const thr = Math.max(1, other * 0.003);
      let a = 0;
      let b = n - 1;
      while (a < n && p[a] < thr) a++;
      while (b > a && p[b] < thr) b--;
      return [a, b];
    };
    const [cx0, cx1] = extent(colP, w, h);
    const [cy0, cy1] = extent(rowP, h, w);
    if (cx1 - cx0 < 20 || cy1 - cy0 < 20) return false;
    // 반복 간격 찾기 (자기상관)
    const period = (p, a, b) => {
      const n = b - a + 1;
      let mean = 0;
      for (let i = a; i <= b; i++) mean += p[i];
      mean /= n;
      const x = [];
      for (let i = a; i <= b; i++) x.push(p[i] - mean);
      const lo = Math.max(6, Math.floor(n / 45));
      const hi = Math.floor(n / 2);
      const c = [];
      let max = 0;
      for (let L = lo; L <= hi; L++) {
        let s2 = 0;
        for (let i = 0; i + L < n; i++) s2 += x[i] * x[i + L];
        const v = s2 / (n - L);
        c.push([L, v]);
        if (v > max) max = v;
      }
      if (max <= 0) return 0;
      for (let i = 1; i < c.length - 1; i++) {
        if (c[i][1] >= 0.75 * max && c[i][1] >= c[i - 1][1] && c[i][1] >= c[i + 1][1]) return c[i][0];
      }
      return 0;
    };
    const pw = period(colP, cx0, cx1);
    const ph = period(rowP, cy0, cy1);
    if (!pw || !ph) return false;
    const cols = Math.max(1, Math.round((cx1 - cx0 + 1) / pw));
    const rows = Math.max(1, Math.round((cy1 - cy0 + 1) / ph));
    const gw = cols * pw;
    const gh = rows * ph;
    const gx = cx0 + (cx1 - cx0 + 1 - gw) / 2;
    const gy = cy0 + (cy1 - cy0 + 1 - gh) / 2;
    // 그림 아래 이름 글씨가 있으면 그 위까지만
    let spriteFrac = 100;
    const prof = new Float64Array(ph);
    for (let y = Math.max(0, Math.round(gy)); y < Math.min(h, Math.round(gy + gh)); y++) prof[Math.floor(((y - gy) % ph + ph) % ph)] += rowP[y];
    let med = Array.from(prof).sort((a, b) => a - b)[Math.floor(ph / 2)];
    let minI = -1;
    let minV = Infinity;
    for (let i = Math.floor(ph * 0.55); i < Math.floor(ph * 0.95); i++) if (prof[i] < minV) { minV = prof[i]; minI = i; }
    if (minI > 0 && med > 0 && minV < med * 0.35) {
      // 글씨 줄이 실제로 있는지: 그 아래에 다시 그림(글씨)이 있어야 해요
      let after = 0;
      for (let i = minI; i < ph; i++) after = Math.max(after, prof[i]);
      if (after > med * 0.5) spriteFrac = Math.round((minI / ph) * 100);
    }
    split.cols = cols;
    split.rows = rows;
    split.L = Math.max(0, gx / s);
    split.T = Math.max(0, gy / s);
    split.R = Math.max(0, split.W - (gx + gw) / s);
    split.B = Math.max(0, split.H - (gy + gh) / s);
    split.sprite = clamp(spriteFrac, 50, 100);
    return true;
  }

    $('modal-body').innerHTML = o.body || '';
    const input = $('modal-input');
    input.hidden = !o.input;
    input.value = o.value || '';
    input.className = 'modal-input' + (o.input === 'text' ? ' text' : '');
    input.setAttribute('inputmode', o.input === 'number' ? 'numeric' : 'text');
    input.setAttribute('maxlength', o.input === 'text' ? '10' : '6');
    $('modal-error').textContent = '';
    $('modal-ok').textContent = o.okText || '확인';
    $('modal-cancel').textContent = o.cancelText || '취소';
    modal.onOk = o.onOk;
    modal.lastFocus = document.activeElement;
    $('modal').hidden = false;
    setTimeout(() => { try { (o.input ? input : $('modal-ok')).focus(); } catch (e) { /* 무시 */ } }, 60);
  }
  function closeModal() {
    $('modal').hidden = true;
    modal.onOk = null;
    const f = modal.lastFocus;
    modal.lastFocus = null;
    if (f && f.focus && document.contains(f)) { try { f.focus({ preventScroll: true }); } catch (e) { /* 무시 */ } }
  }
  function confirmModal() {
    const cb = modal.onOk;
    if (!cb) { closeModal(); return; }
    if (cb($('modal-input').value.trim()) === false) return;
    closeModal();
  }
  // 아이가 혼자 누르지 못하도록 간단한 곱셈 문제로 부모님을 확인해요
  function parentGate(title, desc, action) {
    const a = 12 + rnd(18);
    const b = 3 + rnd(7);
    openModal({
      title: '👨‍👩‍👦 ' + title,
      body: desc + '<div class="gate-q">부모님 확인 문제: <b>' + a + ' × ' + b + ' = ?</b></div>',
      input: 'number',
      onOk: (v) => {
        if (parseInt(v, 10) === a * b) { setTimeout(action, 0); return true; }
        $('modal-error').textContent = '정답이 아니에요. 엄마·아빠에게 부탁해 주세요!';
        const inp = $('modal-input');
        inp.value = '';
        inp.focus();
        return false;
      },
    });
  }
  function askText(title, desc, value, cb) {
    openModal({
      title, body: desc, input: 'text', value,
      onOk: (v) => {
        const t = v.trim().slice(0, 10);
        if (!t) { $('modal-error').textContent = '이름을 적어 주세요'; return false; }
        setTimeout(() => cb(t), 0);
        return true;
      },
    });
  }
  function confirmBox(title, body, okText, cb) {
    openModal({ title, body, okText, onOk: () => { setTimeout(cb, 0); return true; } });
  }

  function setBusy(on) {
    document.body.classList.toggle('net-busy', !!on);
    const b = $('roll-btn');
    if (b && on) b.disabled = true;
  }
  function updateSaveBadge() {

    if (!el) return;
    let t;
    let label;
    if (store.mode === 'online') { t = '📱' + store.code; label = '같이 하는 방 ' + store.code + '에 저장돼요'; }
    else if (cloud.ref && !cloud.dead) { t = '☁️'; label = '내 계정에 자동 저장돼요'; }
    else if (local.ok) { t = '💾'; label = '이 기기에 자동 저장돼요'; }
    else { t = '⚠️'; label = '저장이 안 돼요'; }
    if (el.textContent !== t) el.textContent = t;
    el.title = label;
    el.setAttribute('aria-label', label);

  function setNum(id, v) {
    const el = $(id);
    const txt = fmt(v);
    if (el.textContent === txt) return;
    el.textContent = txt;
    if (reduceMotion) return;
    const box = el.parentElement;
    box.classList.remove('bump');

  // 동작이 끝난 뒤 화면 효과

    if (!res.ok) {
      if (res.msg) toast(res.msg, 3000);
      if (type === 'bt') showMenu();

      return;

      case 'roll':
        ui.seenMove = st.lastMove.n;

        if (res.bt === 'start' && st.pending && st.pending.kind === 'battle') { ui.team = null; openBattle(st.pending, false); }
        if (res.quiz) { if (res.right) fx.burst(90); }

      case 'bt':

      case 'buyBall': {

        board.tokensKey = '';
        break;
      case 'skip':
        pushHandoff();
        break;
      case 'buy': {

        if (res.firstCert) fx.burst(50);

      case 'sell': {

        else if (res.gain < 0) toast('😢 ' + res.n + '주 팔았어요. ' + fmt(-res.gain) + '원 손해예요. 다음엔 오를 때 팔아 봐요!' + tot, 3400);

        ui.drawAnim = { pid: v.pid, n: res.draw.n };

          render();
          const t = res.draw.res.type;
          if (SP[res.draw.sp].pool === 4) fx.burst(240);
          else if (t === 'evolve' || t === 'jump' || t === 'ready') fx.burst(170);
          else if (t === 'new') fx.burst(70);

  /* =========================================================
     6-2. 화면 — 한 화면 틀 (작은 탭 · 쪽 넘기기 · 상성 표시)
     스크롤 대신: 탭 안을 작은 탭으로 나누고, 칸이 많으면 ◀ ▶ 쪽으로 넘겨요 (손가락으로 옆으로 밀어도 돼요).
     ========================================================= */
  const SEGS = { stock: ['co', 'report', 'wealth', 'ring'], shop: ['draw', 'balls', 'tiers', 'coupon'], dex: ['mons', 'badges', 'dex'] };
  const SEG_KEY = 'pokemon-shareholders-seg';
  try {
    const saved = JSON.parse(localStorage.getItem(SEG_KEY) || '{}');
    Object.keys(SEGS).forEach((t) => { if (saved && SEGS[t].indexOf(saved[t]) >= 0) ui.seg[t] = saved[t]; });
  } catch (e) { /* 기억 못 해도 괜찮아요 */ }

  function setSeg(tab, seg) {
    if (!SEGS[tab] || SEGS[tab].indexOf(seg) < 0) return;
    ui.seg[tab] = seg;
    try { localStorage.setItem(SEG_KEY, JSON.stringify(ui.seg)); } catch (e) { /* 기억 못 해도 괜찮아요 */ }
    applySegs();
    render();
  }
  function applySegs() {
    Object.keys(SEGS).forEach((t) => SEGS[t].forEach((s) => {
      const on = ui.seg[t] === s;
      const b = $('seg-' + t + '-' + s);
      const pane = $('pane-' + t + '-' + s);
      if (b) { b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); }
      if (pane && pane.hidden === on) pane.hidden = !on;
    }));
  }

  // ── 쪽 넘기기: 칸 크기로 한 쪽에 몇 개가 들어가는지 재서 나눠요 ──
  // o = { w: 칸 최소 너비, h: 칸 높이, gap, cols/rows: 안 보일 때 기본값, maxCols }
  function fitGrid(id, n, o) {
    const el = $(id);
    const seen = !!(el && el.getClientRects().length);
    const W = seen ? el.clientWidth : 0;
    const H = seen ? el.clientHeight : 0;
    const gap = o.gap == null ? 8 : o.gap;
    const big = Math.min(window.innerWidth, window.innerHeight) >= 700 ? 1.3 : 1;
    const cw = o.w * big;
    const ch = o.h * big;
    const cols = W ? clamp(Math.floor((W + gap) / (cw + gap)), o.minCols || 1, o.maxCols || 12) : o.cols || 2;
    const rows = H ? clamp(Math.floor((H + gap) / (ch + gap)), 1, o.maxRows || 20) : o.rows || 3;
    const per = cols * rows;
    const pages = Math.max(1, Math.ceil(n / per));
    const pg = clamp(ui.page[id] || 0, 0, pages - 1);
    ui.page[id] = pg;
    return { id, cols, rows, per, pages, pg, n, ch, from: pg * per, to: Math.min(n, pg * per + per) };
  }
  function pagerHTML(f) {
    if (f.pages <= 1) return '';
    const dots = f.pages <= 7
      ? '<span class="pg-dots" aria-hidden="true">' + Array.from({ length: f.pages }, (_, i) => '<i class="' + (i === f.pg ? 'on' : '') + '"></i>').join('') + '</span>'
      : '';
    return '<button class="pg-btn" type="button" data-act="page" data-id="' + f.id + '" data-d="-1"' + (f.pg ? '' : ' disabled') + ' aria-label="앞 쪽">◀</button>' +
      '<span class="pg-mid">' + dots + '<span class="pg-txt"><b>' + (f.pg + 1) + '</b> / ' + f.pages + '쪽</span></span>' +
      '<button class="pg-btn" type="button" data-act="page" data-id="' + f.id + '" data-d="1"' + (f.pg < f.pages - 1 ? '' : ' disabled') + ' aria-label="다음 쪽">▶</button>';
  }
  // items: 칸 HTML 목록 → 지금 쪽만 그리고 아래에 ◀ 1/3 ▶
  function renderPaged(id, items, o) {
    const f = fitGrid(id, items.length, o);
    const el = $(id);
    if (!el) return f;
    // 칸이 한 쪽보다 적으면 그만큼만 줄을 만들고, 한 칸이 너무 길어지지 않게 (남는 자리는 아래로)
    const rowsUsed = f.pages > 1 ? f.rows : Math.max(1, Math.ceil(Math.max(1, items.length) / f.cols));
    const css = 'grid-template-columns: repeat(' + f.cols + ', minmax(0, 1fr)); grid-template-rows: repeat(' + rowsUsed + ', minmax(0, ' + Math.round(f.ch * 1.45) + 'px)); align-content: start; gap: ' + (o.gap == null ? 8 : o.gap) + 'px;';
    if (el.dataset.css !== css) { el.style.cssText = css; el.dataset.css = css; }
    el.dataset.swipe = id;
    setHTML(id, items.length ? items.slice(f.from, f.to).join('') : '<div class="grid-empty">' + (o.empty || '') + '</div>');
    setHTML('pg-' + id, pagerHTML(f));
    return f;
  }
  function turnPage(id, d) {
    if (ui.page[id] == null) return;
    ui.page[id] = Math.max(0, (ui.page[id] || 0) + d);
    // 바뀐 쪽만 다시 그려요 (판 위의 것은 판 그리기로)
    if (ui.sheets.length || !$('sheet').hidden) renderSheet();

      '<linearGradient id="ns-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1b4b"></stop><stop offset="1" stop-color="#4338ca"></stop></linearGradient>' +
      '<clipPath id="ns-clip"><circle r="12"></circle></clipPath></defs>';
    const map = '<g aria-hidden="true">' +
      '<path class="m-land" d="' + MAP.land + '"></path>' +
      '<path class="m-home" d="' + MAP.home + '"></path>' +
      '<path class="m-border" d="' + MAP.borders + '"></path>' +
      '<path class="m-edge" d="' + MAP.outline + '"></path>' +
      '<path class="m-river" d="' + MAP.river + '"></path>' +
      '<path class="m-casing" d="' + MAP.route + '"></path>' +
      '<path class="m-route" d="' + MAP.route + '"></path>' +
      '<path class="m-arrow" d="' + MAP.arrows + '"></path></g>';
    const moon = NAMSAN < 0 ? '' : '<g class="ns-moon" id="ns-moon" data-act="moon" transform="translate(' + MOON.x + ' ' + MOON.y + ')" role="button" tabindex="0" aria-label="남산 위에 뜬 보름달">' +
      '<g class="ns-moon-in"><circle class="ns-halo" r="13" fill="url(#ns-glow)"></circle>' +
      '<circle r="6.5" fill="#fef08a" stroke="#f59e0b" stroke-width="0.8"></circle>' +
      '<circle cx="-2" cy="-1.5" r="1.4" fill="#fcd34d"></circle><circle cx="2.3" cy="1.6" r="1.05" fill="#fcd34d"></circle><circle cx="1.5" cy="-2.8" r="0.6" fill="#fcd34d"></circle>' +
      '<circle cx="-1.4" cy="2.6" r="0.55" fill="#fcd34d"></circle></g></g>';
    const labels = '<g aria-hidden="true">' + PLACES.map((p) => {
      const lines = p.label.split('\n');
      return '<text class="m-label" x="' + p.lx + '" y="' + p.ly + '">' + lines.map((t, i) => '<tspan x="' + p.lx + '" dy="' + (i ? 10 : 0) + '">' + esc(t) + '</tspan>').join('') + '</text>';
    }).join('') + '</g>';
    const nodes = '<g>' + PLACES.map((p) => {
      const aria = ' role="button" tabindex="0" aria-label="' + esc((p.i + 1) + '번 칸 ' + placeDesc(p)) + '"';
      const at = ' id="nd-' + p.i + '" data-act="place" data-i="' + p.i + '" transform="translate(' + p.x + ' ' + p.y + ')"';
      // 칸 속성 동그라미 (집 · 체육관은 빼고)
      const tb = (r) => (p.kind === 'home' || p.cid ? '' : '<g class="nt" id="nt-' + p.i + '" transform="translate(' + (r * 0.78).toFixed(1) + ' ' + (-r * 0.78).toFixed(1) + ')"><g class="nt-in"><circle r="4.6"></circle><text y="0.35"></text></g></g>');
      if (p.i === NAMSAN) {
        return '<g class="nd big namsan"' + at + aria + '><circle class="hl" r="15.5"></circle><circle class="nb" r="12"></circle>' +
          '<g clip-path="url(#ns-clip)" pointer-events="none">' + namsanScene() + '</g>' + tb(12) + '</g>';
      }
      const r = p.big ? 12 : 9;
      const cls = 'nd ' + (p.big ? 'big ' : '') + (p.cid ? 'g-' + p.cid : 'k-' + p.kind);
      return '<g class="' + cls + '"' + at + aria + '>' +
        '<circle class="hl" r="' + (r + 3.5) + '"></circle>' +
        '<circle class="nb" r="' + r + '"></circle>' +
        (p.cid ? '<circle class="won" r="' + (r + 2.2) + '" style="display: none"></circle>' : '') +
        '<text y="0.5">' + p.icon + '</text>' + tb(r) + '</g>';
    }).join('') + '</g>';
    const deco = '<g class="season-deco" aria-hidden="true" pointer-events="none">' + DECO_AT.map((q, i) => '<text class="sd" x="' + q[0] + '" y="' + q[1] + '" style="animation-delay: ' + (i % 4) * 0.6 + 's"></text>').join('') + '</g>';
    const night = '<g aria-hidden="true" pointer-events="none"><rect class="ns-night" x="-600" y="-600" width="1600" height="1600"></rect>' +
      STARS.map((q, i) => '<circle class="ns-star" cx="' + q[0] + '" cy="' + q[1] + '" r="' + (i % 3 ? 1 : 1.5) + '" style="animation-delay: ' + (i % 5) * 0.23 + 's"></circle>').join('') + '</g>';
    svg.innerHTML = defs + map + deco + labels + nodes + night + moon;
    board.built = true;
    board.tokensKey = '';
    board.sizeKey = '';
    board.typesKey = '';
  }
  // 칸 속성 · 계절 그리기 (지도가 바뀌면 동그라미가 빙글 돌며 바뀌어요)
  function renderMapTypes() {
    const st = store.st;
    const key = st.map.n + ':' + st.map.types.join(',');
    if (board.typesKey === key) return;
    const flip = board.typesKey !== '';
    board.typesKey = key;
    PLACES.forEach((pl) => {
      const g = $('nt-' + pl.i);
      if (!g) return;
      const t = placeType(st, pl.i);
      g.querySelector('circle').style.fill = TYPE_C[t] || '#94a3b8';
      g.querySelector('text').textContent = t ? TYPES[t].icon : '';
      g.setAttribute('data-t', t);
      if (flip && !reduceMotion) { g.classList.remove('flip'); void g.getBBox(); g.classList.add('flip'); g.querySelector('.nt-in').style.animationDelay = (pl.i % 6) * 0.08 + 's'; }
    });
    const wrap = $('stage-wrap');
    [0, 1, 2, 3].forEach((k) => wrap.classList.toggle('season-' + k, st.map.season === k));
    document.querySelectorAll('#board-svg .sd').forEach((el) => { el.textContent = SEASON_DECO[st.map.season] || ''; });
  }
  function mapCheck() {
    const st = store.st;
    if (board.mapN >= 0 && st.map.n !== board.mapN && !reduceMotion) {
      const S = SEASONS[st.map.season];
      const sample = PLACES.filter((pl) => pl.kind !== 'home' && !pl.cid && pl.i !== NAMSAN).slice(0, 4).map((pl) => { const t = placeType(st, pl.i); return esc(pl.short) + ' ' + TYPES[t].icon; }).join(' · ');
      setTimeout(() => showBubble('<div class="hb-title">' + S.icon + ' ' + S.name + '이 왔어요! 지도가 바뀌었어요</div><div class="hb-text">한 바퀴를 돌아서 칸 속성이 새로 섞였어요. ' + sample + ' …<br>칸 모서리 동그라미가 그 칸에서 잘 나오는 포켓몬 타입이에요.</div>', 5200), ui.anim ? 900 : 200);
    }
    board.mapN = st.map.n;
  }

  // ── 지도 크기: 화면 가운데 칸을 꽉 채우고, 위 칩 줄과 아래 굴리기 막대 사이에 서울이 들어가요 ──
  function sizeStage(force) {
    const wrap = $('stage-wrap');
    if (!wrap || $('tab-board').hidden) return;
    const key = [wrap.clientWidth, wrap.clientHeight, $('hud-top').offsetHeight, $('hud-bottom').offsetHeight, board.zoom].join(':');
    if (!force && key === board.sizeKey) return;
    board.sizeKey = key;
    layoutBoard();
  }
  function layoutBoard() {
    const stage = $('stage');
    const W = stage.clientWidth;
    const H = stage.clientHeight;
    if (!W || !H) return;
    const topPad = $('hud-top').offsetHeight + 12;
    // 가로로 눕힌 폰은 굴리기 막대가 오른쪽에 세로로 있어요
    const side = $('hud-bottom').offsetWidth < W * 0.6;
    const rbH = side ? 0 : $('hud-bottom').offsetHeight;
    const sideW = side ? $('hud-bottom').offsetWidth : 0;
    $('stage-wrap').style.setProperty('--rb-h', rbH + 'px');
    const avail = Math.max(120, H - topPad - rbH - 4);
    const usableW = Math.max(160, W - sideW);
    let s = board.zoom === 'fit' ? Math.min(usableW / VB_W, avail / VB_H) : avail / VB_H;
    s = Math.min(s, 3.2);
    const contentW = VB_W * s;
    const mapW = Math.max(W, Math.ceil(contentW + sideW));
    const vx = -((mapW - sideW - contentW) / 2) / s;
    const vy = -(topPad + (avail - VB_H * s) / 2) / s;
    Object.assign(board, { s, vx, vy, W, H, mapW });
    const sm = $('stage-map');
    sm.style.width = mapW + 'px';
    sm.style.setProperty('--u', s.toFixed(4));
    $('board-svg').setAttribute('viewBox', [vx, vy, mapW / s, H / s].map((n) => n.toFixed(3)).join(' '));
    const layer = $('tk-layer');
    layer.classList.add('no-tr');
    renderTokens();
    void layer.offsetWidth;
    layer.classList.remove('no-tr');
    const zb = $('zoom-btn');
    zb.innerHTML = board.zoom === 'fit' ? '🔎<small>크게</small>' : '🔍<small>전체</small>';
    zb.setAttribute('aria-label', board.zoom === 'fit' ? '지도 크게 보기' : '서울 전체 보기');
    follow(true);
  }
  const nodePx = (i) => [(PLACES[i].x - board.vx) * board.s, (PLACES[i].y - board.vy) * board.s];

  function animPos(p) {
    return ui.anim && ui.anim.pid === p.pid ? ui.anim.pos : p.pos;
  }
  const focusPlayer = () => (isMulti(store.st) ? currentPlayer(store.st) : viewer());
  function renderNodes() {
    const v = viewer();
    const herePos = animPos(focusPlayer());
    PLACES.forEach((pl) => {
      const g = $('nd-' + pl.i);
      if (!g) return;
      g.classList.toggle('here', pl.i === herePos);
      g.classList.toggle('trail', !!(ui.anim && ui.anim.trail.indexOf(pl.i) >= 0 && pl.i !== herePos));
      g.classList.toggle('pick', pl.i === ui.pickPlace && pl.i !== herePos);
      if (pl.cid) {
        const w = g.querySelector('circle.won');
        if (w) w.style.display = v.won[pl.cid] ? '' : 'none';
      }
    });
  }
  // 말: 고른 포켓몬이 칸 위에 서서 다녀요 (움직이는 그림 → 멈춘 그림 → 기본 말)
  function tokenHTML(p, multi) {
    const sp = partnerSp(p);
    let body;
    if (sp) {
      const a = animOf(SP[sp].dex, false);
      const url = a ? a.src : imgUrl(SP[sp].dex);
      body = url
        ? '<img class="tk2-mon' + (a ? '' : ' still') + '" src="' + url + '" data-dex="' + SP[sp].dex + '" data-sp="' + sp + '"' + (a ? ' data-anim="' + a.key + '"' : '') + ' alt="" draggable="false">'
        : '<span class="tk2-emb t-' + SP[sp].type + '">' + TYPES[SP[sp].type].icon + '</span>';
    } else {
      body = '<span class="tk2-pawn"></span>';
    }
    return '<div class="tk2" id="tk-' + p.pid + '" style="--pc: ' + (P_COLOR[p.color] || P_COLOR.blue) + '"><div class="tk2-in"><span class="tk2-ring"></span>' + body + '</div>' +
      (multi ? '<span class="tk2-name">' + esc(p.name) + '</span>' : '') + '</div>';
  }
  // 말판에서 노는 야생 포켓몬 (딱 멈추면 배틀!)
  function wildTokHTML(w) {
    const s = SP[w.sp];
    const a = animOf(s.dex, false);
    const url = a ? a.src : imgUrl(s.dex);
    const body = url
      ? '<img class="wd-mon' + (a ? '' : ' still') + '" src="' + url + '" data-dex="' + s.dex + '" data-sp="' + w.sp + '"' + (a ? ' data-anim="' + a.key + '"' : '') + ' alt="" draggable="false">'
      : '<span class="tk2-emb">' + TYPES[s.type].icon + '</span>';
    return '<div class="wd' + (s.pool === 4 ? ' legend' : '') + '" id="wd-' + w.id + '" style="--tc: ' + TYPE_C[s.type] + '; --th: ' + TYPE_HI[s.type] + '"><div class="wd-in"><span class="wd-grass"></span>' + body + '</div><span class="wd-mark">!</span></div>';
  }
  function renderTokens(hopPid) {
    const st = store.st;
    const layer = $('tk-layer');
    if (!layer) return;
    const multi = isMulti(st);
    const key = st.players.map((p) => {
      const sp = partnerSp(p);
      const a = sp ? animOf(SP[sp].dex, false) : null;
      return p.pid + ':' + p.color + ':' + (sp || '-') + ':' + (a ? a.key : sp && imgUrl(SP[sp].dex) ? 'i' : 'e') + ':' + (multi ? esc(p.name) : '');
    }).join('|') + '#' + st.wilds.map((w) => w.id + ':' + w.sp + ':' + (animOf(SP[w.sp].dex, false) ? 'a' : 'i')).join('|');
    if (board.tokensKey !== key) {
      layer.innerHTML = st.wilds.map(wildTokHTML).join('') + st.players.map((p) => tokenHTML(p, multi)).join('');
      board.tokensKey = key;
      // 새로 나타난 야생 포켓몬은 뿅!
      const first = !board.wildSeen;
      if (first) board.wildSeen = {};
      st.wilds.forEach((w) => {
        if (!first && !board.wildSeen[w.id] && !reduceMotion) { const el = $('wd-' + w.id); if (el) el.classList.add('pop'); }
        board.wildSeen[w.id] = true;
      });
    }
    st.wilds.forEach((w) => {
      const el = $('wd-' + w.id);
      if (!el) return;
      const xy = nodePx(w.at);
      el.style.transform = 'translate(' + (xy[0] + 9 * board.s).toFixed(1) + 'px, ' + (xy[1] + 1 * board.s).toFixed(1) + 'px)';
      el.style.zIndex = String(Math.round(xy[1]));
    });
    const at = {};
    st.players.forEach((p) => { const pos = animPos(p); (at[pos] = at[pos] || []).push(p); });
    const cur = multi ? currentPlayer(st) : null;
    Object.keys(at).forEach((pos) => {
      const list = at[pos];
      // 지금 차례인 사람이 맨 앞에 보이게
      list.sort((a, b) => (a === cur ? 1 : 0) - (b === cur ? 1 : 0));
      list.forEach((p, k) => {
        const el = $('tk-' + p.pid);
        if (!el) return;
        const xy = nodePx(+pos);
        const dx = (k - (list.length - 1) / 2) * 15 * board.s;
        el.style.transform = 'translate(' + (xy[0] + dx).toFixed(1) + 'px, ' + xy[1].toFixed(1) + 'px)';
        el.style.zIndex = String(Math.round(xy[1]) + (p === cur ? 2000 : 0));
        el.classList.toggle('turn', p === cur);
        if (hopPid === p.pid && !reduceMotion) {
          el.classList.remove('hop');
          void el.offsetWidth;
          el.classList.add('hop');
        }
      });
    });
    updateFindBtn();
  }
  // 화면이 말을 따라가요 (손으로 지도를 밀면 잠깐 멈췄다가, 다음에 굴릴 때 다시 따라가요)
  function follow(instant) {
    if (board.free && !instant) return;
    const stage = $('stage');
    if (!stage || !board.W) return;
    const xy = nodePx(animPos(focusPlayer()));
    const target = clamp(xy[0] - board.W / 2, 0, Math.max(0, board.mapW - board.W));
    if (Math.abs(stage.scrollLeft - target) < 2) return;
    board.auto = true;
    clearTimeout(board.autoT);
    try { stage.scrollTo({ left: target, behavior: instant || reduceMotion ? 'auto' : 'smooth' }); } catch (e) { stage.scrollLeft = target; }
    board.autoT = setTimeout(() => { board.auto = false; }, instant ? 60 : 700);
  }
  function onStageScroll() {
    if (!board.auto && board.touching) board.free = true;
    updateFindBtn();
  }
  function updateFindBtn() {
    const b = $('find-btn');
    if (!b || !board.W) return;
    const xy = nodePx(animPos(focusPlayer()));
    const x = xy[0] - $('stage').scrollLeft;
    b.classList.toggle('pulse', x < 20 || x > board.W - 20);
  }

  // ── 지도 위 말풍선 (칸 설명 · 남산 달) ──
  function showBubble(html, ms) {
    const b = $('hud-bubble');
    b.style.setProperty('--bubble-top', ($('hud-top').offsetHeight + 12) + 'px');
    b.innerHTML = html;
    b.hidden = false;
    clearTimeout(board.bubbleT);
    if (ms) board.bubbleT = setTimeout(hideBubble, ms);
  }
  function hideBubble() {
    clearTimeout(board.bubbleT);
    const b = $('hud-bubble');
    if (b) b.hidden = true;
    if (ui.pickPlace >= 0) { ui.pickPlace = -1; renderNodes(); }
  }
  function showPlace(i) {
    const pl = PLACES[i];
    ui.pickPlace = i;
    renderNodes();
    const st = store.st;
    let extra = '';
    if (pl.kind === 'gym') {
      const c = COMP[pl.cid];
      extra = c.what + ' · 이기면 🏅 배지 + 💰 상금 + 📜 주식 1주';
    } else {
      extra = KIND_DESC[pl.kind];
    }
    const t = placeType(st, i);
    let more = '';
    if (t && !pl.cid) {
      const first = st.map.n === 0 && st.map.types[i] === pl.type && pl.why;
      more += '<div class="hb-type"><span class="hb-tc" style="background: ' + TYPE_C[t] + '">' + TYPES[t].icon + '</span>' + TYPES[t].name + ' 칸 · ' + TYPES[t].name + ' 타입 포켓몬이 잘 나와요' + (first ? ' (' + esc(pl.why) + ')' : i === NAMSAN ? ' (달님 요정)' : '') + '</div>';
    }
    const w = wildAt(st, i);
    if (w) more += '<div class="hb-wild">🐾 야생 ' + esc(SP[w.sp].name) + iga(SP[w.sp].name) + ' 놀고 있어요! 딱 멈추면 배틀</div>';
    showBubble('<div class="hb-title">' + esc((pl.i + 1) + '번 칸 · ' + pl.icon + ' ' + pl.name) + '</div><div class="hb-text">' + esc(extra) + '</div>' + more, 4200);
  }
  function moonWish() {
    const m = $('ns-moon');
    if (m && !reduceMotion) {
      m.classList.remove('wish');
      void m.getBBox();
      m.classList.add('wish');
    }
    showBubble('<div class="hb-title">🌕 남산에 보름달이 떴어요!</div><div class="hb-text">N서울타워 위에서 달님이 반짝반짝 웃고 있어요. 소원을 빌어 볼까요? ✨</div>', 4200);
  }
  // 밤이 되면: 지도가 잠깐 어두워지고 별이 반짝, 남산 위로 보름달이 떠올라요 (그다음 다시 아침)
  function moonCheck() {
    const st = store.st;
    const day = st.night ? st.night.day : 0;
    if (board.moonDay && day && day !== board.moonDay && !reduceMotion) nightFx();
    board.moonDay = day || board.moonDay || 1;
  }
  function nightFx() {
    const wrap = $('stage-wrap');
    const m = $('ns-moon');
    if (!wrap || !m || $('tab-board').hidden) return;
    m.classList.remove('rise');
    void m.getBBox();
    m.classList.add('rise');
    wrap.classList.add('night');
    clearTimeout(board.nightT);
    clearTimeout(board.nightBack);
    board.nightT = setTimeout(() => wrap.classList.remove('night'), 2400);
    // 달이 화면 밖이면 잠깐 남산 쪽을 보여 줬다가 내 말로 돌아와요
    const stage = $('stage');
    const mx = (MOON.x - board.vx) * board.s;
    if (!board.free && board.W && (mx < stage.scrollLeft + 50 || mx > stage.scrollLeft + board.W - 50)) {
      board.auto = true;
      clearTimeout(board.autoT);
      try { stage.scrollTo({ left: clamp(mx - board.W / 2, 0, Math.max(0, board.mapW - board.W)), behavior: 'smooth' }); } catch (e) { /* 오래된 브라우저 */ }
      board.autoT = setTimeout(() => { board.auto = false; }, 800);
      board.nightBack = setTimeout(() => { if (!ui.anim) follow(); }, 2300);
    }
  }

  // ── 가운데에서 데굴데굴 큰 주사위 ──
  function diceFace(n, label) {
    return PIPS[n].map((k) => '<span class="bp' + (k === 'c' ? ' c' : '') + '" style="left: ' + PIP_AT[k][0] + 'px; top: ' + PIP_AT[k][1] + 'px"></span>').join('') +
      (label ? '<span class="big-dice-num">' + n + '칸!</span>' : '');
  }
  function showDice(n, landed) {
    const d = $('big-dice');
    if (!d) return;
    d.hidden = false;
    d.className = 'big-dice ' + (landed ? 'land' : 'rolling');
    d.innerHTML = diceFace(n, landed);
  }
  function hideDice() {
    const d = $('big-dice');
    if (!d || d.hidden) return;
    d.className = 'big-dice out';
    setTimeout(() => { if (d.classList.contains('out')) { d.hidden = true; d.className = 'big-dice'; } }, 280);
  }

  function startMoveAnim(lm, remote) {
    stopAnim();
    const p = playerById(store.st, lm.pid);
    if (!p) return;
    if (remote && p.pid !== viewer().pid) toast('🎲 ' + p.name + iga(p.name) + ' ' + lm.face + ({ 1: '을', 2: '를', 3: '을', 4: '를', 5: '를', 6: '을' }[lm.face]) + ' 굴렸어요!');
    ui.anim = { pid: lm.pid, pos: lm.from, left: lm.face, face: lm.face, show: 1 + rnd(6), rolling: true, trail: [], timer: 0 };
    if (reduceMotion) {
      ui.anim = null;
      render();
      return;
    }
    hideBubble();
    board.free = false;
    follow();
    showDice(ui.anim.show, false);
    let n = 0;
    ui.anim.timer = setInterval(() => {
      const a = ui.anim;
      if (!a) return;
      n += 1;
      a.show = 1 + rnd(6);
      showDice(a.show, false);
      if (n >= 8) {
        clearInterval(a.timer);
        a.rolling = false;
        a.show = a.face;
        showDice(a.face, true);
        renderRoll();
        a.timer = setTimeout(() => { hideDice(); hopStep(); }, 620);
      }
    }, 75);
    render();
  }
  function hopStep() {
    const a = ui.anim;
    if (!a) return;

  const MOVES = {

  const BT_SKIP = { skip: true };

  const LENS = { short: { a: 0.6, t: 0.7, name: '⚡ 빠르게' }, normal: { a: 1, t: 1, name: '🙂 보통' }, long: { a: 1.15, t: 1.3, name: '🐢 천천히' } };

  try { bt.auto = localStorage.getItem(AUTO_KEY) === '1'; } catch (e) { /* 기억 못 해도 괜찮아요 */ }
  function setBattleLen(k) {
    if (!LENS[k]) return;

  function btWait(ms, kind) {
    return new Promise((res, rej) => {
      if (bt.skip) { rej(BT_SKIP); return; }
      let done = false;
      let t = 0;
      const fin = () => {
        if (done) return;
        done = true;
        clearTimeout(t);
        if (bt.tap === fin) bt.tap = null;
        if (bt.skip) rej(BT_SKIP); else res();
      };
      t = setTimeout(fin, reduceMotion ? Math.min(ms, 60) : ms * (kind === 't' ? LENS[bt.len].t : LENS[bt.len].a));
      bt.tap = fin;
      bt.waiters.push(fin);
    });
  }
  // 움직임이 끝나기를 기다리되, ⏩ 빨리를 누르면 바로 멈춰요
  function btStep(a) {
    if (bt.skip) return Promise.reject(BT_SKIP);
    return new Promise((res, rej) => {
      let done = false;
      const fin = () => { if (done) return; done = true; if (bt.skip) rej(BT_SKIP); else res(); };
      bt.waiters.push(fin);
      Promise.resolve(a && a.finished ? a.finished : a).then(fin, fin);
    });
  }

  function addFx(cls, css, html) {

  function anim(el, frames, opt) {

  async function playEvent(e, pd) {
    const vm = bt.vm;
    if (e.t === 'start') { await intro(pd); return; }

      const other = e.side === 'me' ? 'foe' : 'me';
      const A = e.side === 'me' ? vm.team[vm.mi] : vm.foes[vm.fi];
      const D = e.side === 'me' ? vm.foes[vm.fi] : vm.team[vm.mi];
      await attack(e.side, A.sp, A.lv);
      D.hp = e.hp;
      setHP(other, D);
      floatDmg(other, e.dmg, e.crit, e.k);
      await btWait(430);
      if (e.crit) await say('급소에 맞았다!', 650);
      if (e.k > 1) await say('효과가 굉장했다!', 700);
      else if (e.k < 1) await say('효과가 별로인 것 같다…', 700);
      return;
    }
    if (e.t === 'faint') {
      const list = e.side === 'me' ? vm.team : vm.foes;
      const f = list[e.side === 'me' ? vm.mi : vm.fi];
      f.hp = 0;
      const n = SP[f.sp].name;
      await say((e.side === 'foe' && pd.mode === 'wild' ? '야생 ' : '') + n + eunneun(n) + ' 쓰러졌다!');
      await faint(e.side);
      $('bi-' + e.side).innerHTML = infoInner(e.side);
      setHP(e.side, f);
      await btWait(300);
      return;
    }
    if (e.t === 'send') {
      if (e.side === 'me') vm.mi = e.i; else vm.fi = e.i;
      drawSide(e.side, true);
      $('bi-' + e.side).classList.add('hide');
      const f = e.side === 'me' ? vm.team[vm.mi] : vm.foes[vm.fi];
      const n = SP[f.sp].name;
      if (e.side === 'me') await say('부탁해, ' + n + '!');
      else { const boss = bossOf(pd); await say(boss + eunneun(boss) + ' 다음으로 ' + n + eulreul(n) + ' 내보냈다!'); }
      await sendOut(e.side);
      refreshMatch();
      await btWait(200);
      await flashMatch();
      return;
    }
    if (e.t === 'swap') {
      const a = SP[vm.team[vm.mi].sp].name;
      await say('돌아와, ' + a + '!');
      await recall('me');
      vm.mi = e.i;
      drawSide('me', true);
      const b = SP[vm.team[vm.mi].sp].name;
      await say('가라! ' + b + '!');
      await sendOut('me');
      refreshMatch();
      await btWait(150);
      await flashMatch();
      return;

    if (e.t === 'ball') {
      const B = BALLS[e.ball] || BALLS.poke;
      await say('가랏, ' + B.name + '! (잡힐 확률 ' + e.pct + '%)');
      const got = await catchSeq(!!e.ok, e.shakes || 0, e.ball);
      if (!got) await say(['앗! 바로 튀어나왔다!', '아깝다! 조금만 더…', '으앗! 거의 잡았는데!'][clamp(e.shakes || 0, 0, 2)], 900);
    }
  }

    const foe = bt.vm.foes[bt.vm.fi];

      if (foe.hp / foe.max < 0.35) hint = '💡 체력이 조금 남았어요! 지금 볼을 던지면 잘 잡혀요';

  function autoPick() {

    if (!bt.on || bt.playing || !pd || pd.done || !bt.auto || bt.menu !== 'main') return;
    const v = viewer();

  // 엔진이 한 차례를 정하면 그 순서대로 보여 줘요
  async function playStep() {
    const pd = myBattle();
    if (!pd) { closeBattle(); return; }
    if (!bt.on) { openBattle(pd, true); return; }
    if (pd.evn === bt.evn) { if (!bt.playing) { if (pd.done) showEnd(pd); else showMenu(); } return; }
    bt.evn = pd.evn;
    bt.playing = true;
    bt.skip = false;
    hideMenu();
    try {
      for (const e of pd.ev) await playEvent(e, pd);
      if (pd.done) await playEnd(pd);
    } catch (e) {
      if (e !== BT_SKIP) { try { console.warn('battle', e); } catch (e2) { /* 무시 */ } }
    }
    bt.skip = false;
    bt.waiters = [];
    syncView(pd);
    bt.playing = false;
    if (!bt.on) return;
    if (pd.done) showEnd(pd); else showMenu();
  }
  // 넘기기를 눌렀거나 엇갈렸을 때: 화면을 엔진 상태와 똑같이 맞춰요
  function syncView(pd) {
    if (!bt.on) return;
    bt.vm = vmOf(pd);
    $('bt-fx').innerHTML = '';
    $('bt-banner').hidden = true;
    ['me', 'foe'].forEach((side) => {
      drawSide(side, false);
      $('bi-' + side).classList.remove('hide');

    if (pd.done) {
      const cur = bt.vm.team[bt.vm.mi];
      const g = (pd.gains || []).find((x) => x.fam === cur.fam);
      const bar = $('xp-me');
      if (g && bar) bar.style.width = (g.lv >= MAX_LV ? 100 : Math.round(clamp(g.x / g.need, 0, 1) * 100)) + '%';

      if (pd.how === 'catch') bodyOf('foe').style.opacity = '0';
    }

  // 한 화면에 꼭 맞게: 위 버튼 · 필드 · 글 상자 · 명령 칸 (가로로 눕힌 폰은 옆으로 나란히)
  function layoutBattle() {
    const box = $('battle');
    const wrap = $('bt-wrap');
    const field = $('bt-field');
    if (!box || !wrap || !field || box.hidden) return;
    const cs = getComputedStyle(box);
    const W = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const H = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const wide = W > H * 1.3 && H < 620;
    box.classList.toggle('bt-land', wide);
    const top = $('bt-wrap').querySelector('.bt-top').offsetHeight + 6;
    if (wide) {
      const fh = Math.max(150, H - top - 8);
      const fw = Math.min(W * 0.58, fh * 1.3);
      wrap.style.width = Math.round(Math.min(W, fw + Math.min(380, W - fw - 8) + 8)) + 'px';
      field.style.width = Math.round(fw) + 'px';
      field.style.height = Math.round(fh) + 'px';
    } else {
      const ww = Math.min(W, 520);
      wrap.style.width = Math.round(ww) + 'px';
      field.style.width = '';
      const text = $('bt-text').offsetHeight;
      const cmd = $('bt-cmd').offsetHeight;
      const fixed = top + text + cmd + 8 + 8;
      const fh = clamp(H - fixed, 150, ww * 1.02);
      field.style.height = Math.round(fh) + 'px';
    }
    sizeMons();

    const why = t && t === s.type ? ' · ' + TYPES[t].icon + ' ' + TYPES[t].name + ' 칸이라 잘 나와요' : '';
    return head('wild', pd.wid ? '🐾' : '🌳', pl.name + (pd.wid ? ' · 말판의 야생 포켓몬' : ' · 풀숲')) +
      '<div class="sheet-body enc"><div class="enc-l">' +
      '<h2 class="sheet-title">' + (legend ? '🌟 전설의 포켓몬! ' : '') + '야생 ' + esc(s.name) + iga(s.name) + ' 나타났어요!</h2>' +
      foeCardHTML(foes[0], (pd.wid ? '🐾 말판에서 놀던 야생' : '🌳 야생') + why) + '</div><div class="enc-r">' +
      teamPickHTML(p, pd, foes) +
      '<div class="enc-info opt2">쓰러뜨리면 +' + fmt(WILD_PRIZE) + '원 · 볼은 체력이 적을수록 잘 잡혀요<span class="bag">🎒 ' + ballsLine(p) + '</span></div>' +
      '<div class="enc-btns two">' +
        '<button class="btn-primary" type="button" data-act="choose" data-key="fight"' + (has ? '' : ' disabled') + '>⚔️ 배틀 시작!</button>' +
        '<button class="btn btn-muted" type="button" data-act="choose" data-key="flee">🏃 도망가기</button>' +
      '</div></div></div>';
  }
  // 다시 열었을 때 끝난 배틀 결과 (배틀 화면이 닫혀 있으면 카드로)
  function battleResultHTML(pd) {
    return head(pd.tone || 'calm', pd.icon || '⚔️', PLACES[pd.at].name + ' · 배틀 결과') + '<div class="sheet-body">' + endHTML(pd) + '</div>';
  }
  function quizHTML(pd) {
    const q = QUIZ[pd.qi % QUIZ.length];
    const pl = PLACES[pd.at];
    const who = pl.i === 14 ? '세종대왕님의 경제 퀴즈' : '서울대 형·누나의 경제 퀴즈';
    return head('quiz', '❓', pl.name + ' · 경제 퀴즈') +
      '<div class="sheet-body"><h2 class="sheet-title">' + who + '</h2>' +
      '<div class="sheet-text" style="color: var(--text-strong); font-weight: 800">Q. ' + esc(q.q) + '</div>' +
      '<div class="caption">정답이면 +' + fmt(QUIZ_REWARD) + '원!</div>' +
      '<div class="sheet-btns">' + q.o.map((o, i) => '<button class="btn quiz-opt" type="button" data-act="choose" data-key="q' + i + '">' + NUM_MARK[i] + ' ' + esc(o) + '</button>').join('') + '</div></div>';
  }
  function eventHTML(pd) {
    if (pd.kind === 'battle') return pd.done && !bt.on ? battleResultHTML(pd) : '';
    const p = viewer();
    if (pd.kind === 'gym' && !pd.done) return gymHTML(pd, p);
    if (pd.kind === 'wild' && !pd.done) return wildHTML(pd, p);
    if (pd.kind === 'quiz' && !pd.done) return quizHTML(pd);
    const pl = PLACES[pd.at];
    const tone = pd.tone || 'calm';
    let extra = '';
    if (pd.caught) extra = '<div style="text-align: center">' + visHTML(pd.caught, '', true) + '</div>';
    const btns = [];
    if (pd.kind === 'news') btns.push('<button class="btn" type="button" data-act="goto-stock">📈 주식 보러 가기</button>');
    btns.push('<button class="btn-primary" type="button" data-act="choose" data-key="ok">' + (pd.battle && pd.battle.win ? '신난다!' : pd.quiz && pd.quiz.right ? '좋아요!' : '확인') + '</button>');
    return head(tone, pd.icon || pl.icon, pl.name + ' · ' + (pd.kind === 'result' ? (pd.battle ? '배틀 결과' : pd.quiz ? '퀴즈 결과' : '결과') : KIND_NAME[pd.kind] || '')) +
      '<div class="sheet-body"><h2 class="sheet-title">' + esc(pd.title) + '</h2>' + extra +
      '<div class="sheet-text">' + esc(pd.body) + '</div>' +
      '<div class="sheet-btns">' + btns.join('') + '</div></div>';
  }

  // ── 회사 자세히 (작은 탭: 📈 사고팔기 · 🍕 조각 · 증서 · 💡 알아보기) ──
  function companyHTML(cid) {
    const st = store.st;
    const c = COMP[cid];
    if (!c) return '';
    const v = viewer();
    const mine = store.mode !== 'online' || v.pid === store.me;
    const price = st.market.price[cid];
    const prev = st.market.prev[cid];
    const ch = price - prev;
    const n = v.sh[cid] || 0;
    const tot = totalShares(st)[cid];
    const risk = counterChance(tot, st.settings.counter);
    const boost = supportOf(tot);
    const prey = COMP[preyOf(cid)];
    const pred = COMP[predOf(cid)];
    const style = STYLES[c.style];
    const tab = ['trade', 'pieces', 'learn'].indexOf(ui.coTab) >= 0 ? ui.coTab : 'trade';
    const delta = ch > 0 ? '<span class="delta delta-up">▲ ' + fmt(ch) + '원 (' + pctText(ch / prev) + ')</span>'
      : ch < 0 ? '<span class="delta delta-down">▼ ' + fmt(-ch) + '원 (' + pctText(ch / prev) + ')</span>'
        : '<span class="delta delta-same">' + (st.day === 1 ? '첫날 가격' : '어제와 같아요') + '</span>';
    const tabs = '<div class="mini-tabs">' + [['trade', '📈 사고팔기'], ['pieces', '🍕 조각 · 증서'], ['learn', '💡 알아보기']].map((t) =>
      '<button class="mt-btn' + (t[0] === tab ? ' on' : '') + '" type="button" data-act="co-tab" data-t="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>';
    let body = '';
    if (tab === 'trade') {
      let hold = '';
      if (n) {
        const avg = Math.round((v.cost[cid] || 0) / n);
        const pl = n * price - Math.round(v.cost[cid] || 0);
        const rr = avg > 0 ? price / avg - 1 : 0;
        hold = '<div class="banner banner-info">내 주식 <b>' + n + '주</b> · 평균 ' + fmt(avg) + '원에 샀어요 · 수익률 <b class="' + (rr > 0.0005 ? 'txt-up' : rr < -0.0005 ? 'txt-down' : '') + '">' + pctText(rr) + '</b><small>지금 다 팔면 ' + (pl > 0 ? '+' + fmt(pl) + '원 이득 😀 → 주식으로 번 돈에 들어가요' : pl < 0 ? fmt(-pl) + '원 손해 😢' : '본전이에요 😐') + '</small></div>';
      }
      const btns = mine
        ? '<div class="btn-row"><button class="btn btn-buy" type="button" data-act="buy" data-cid="' + cid + '">📈 1주 사기<small>−' + fmt(price) + '원</small></button>' +
          '<button class="btn btn-sell" type="button" data-act="sell" data-cid="' + cid + '"' + (n ? '' : ' aria-disabled="true"') + '>📉 1주 팔기<small>+' + fmt(price) + '원</small></button></div>' +
          (n >= 2 ? '<button class="btn" type="button" data-act="sell-all" data-cid="' + cid + '">📦 ' + n + '주 한꺼번에 팔기 (+' + fmt(n * price) + '원)</button>' : '')
        : '';
      body = '<div class="kv"><div class="kvb"><div class="kvl">🍕 내 주식</div><div class="kvv">' + n + '주</div></div>' +
        '<div class="kvb"><div class="kvl">📣 응원 효과</div><div class="kvv">' + (tot ? '+' + pctText(boost).slice(1) : '없음') + '</div></div>' +
        '<div class="kvb' + (risk ? ' hot' : '') + '"><div class="kvl">💥 반격 확률</div><div class="kvv">' + (risk ? Math.round(risk * 100) + '%' : '없음') + '</div></div></div>' +
        '<div class="rel-row"><div class="rel">💪 이기는 회사 <b>' + prey.icon + ' ' + esc(prey.short) + '</b></div><div class="rel warn">⚠️ 천적 <b>' + pred.icon + ' ' + esc(pred.short) + '</b> <small>(모두 ' + tot + '주)</small></div></div>' +
        hold + btns;
    } else if (tab === 'pieces') {
      const others = Math.max(0, tot - n);
      let pcs = '';
      for (let i = 0; i < 100; i++) pcs += '<span class="pc' + (i < n ? ' mine' : i < n + others ? ' other' : '') + '"></span>';
      const cert = v.certs[cid]
        ? '<div class="cert"><div class="cert-title">주주 증서</div><div>' + esc(v.name) + ' 님은</div><div class="cert-co">' + c.icon + ' ' + esc(c.name) + '</div><div>의 주인(주주)입니다.</div>' +
          '<div style="margin-top: 4px; font-weight: 800; color: var(--text-strong)">가진 조각 ' + n + '주 · 회사의 ' + n + '%</div><div style="font-size: 12px">처음 주주가 된 날 · ' + v.certs[cid] + '일차</div>' +
          '<div class="seal">' + esc(c.short.slice(0, 2)) + '<br>' + esc(c.short.slice(2)) + '</div></div>'
        : '<div class="caption" style="text-align: center">📜 이 회사 주식을 처음 사면 주주 증서가 생겨요.</div>';
      body = '<div class="co-pieces"><div><div class="caption" style="font-weight: 800; color: var(--text-strong)">🍕 회사 조각판 · 100조각(100주)</div>' +
        '<div class="pieces mt8">' + pcs + '</div>' +
        '<div class="legend"><span><span class="key" style="background: var(--sell-bd)"></span>나 ' + n + '조각</span>' + (others ? '<span><span class="key" style="background: var(--warn-bd)"></span>같이 하는 사람 ' + others + '조각</span>' : '') + '<span><span class="key" style="background: var(--border)"></span>다른 주주</span></div></div>' + cert + '</div>';
    } else {
      body = '<div class="rules">' +
        ruleHTML('🍕', '회사의 작은 주인', '조각이 많을수록 회사에서 내 몫이 커져요.') +
        ruleHTML('💰', '배당금', '회사가 번 돈을 조각 수만큼 나눠 받아요 (💰 코엑스 칸 · 🏛️ 주주 총회).') +
        ruleHTML('🗳️', '투표', '주주 총회에서 회사 일을 정해요. 1주 = 1표.') +
        ruleHTML('📈', '값이 오르면 이득', '산 값보다 비쌀 때 팔아야 진짜 번 돈이 돼요.') +
        ruleHTML('🎰', '뽑기 캡슐', c.icon + ' 주식 2주마다 뽑기 상자에 ' + c.icon + ' ' + TYPES[cid].name + ' 타입 캡슐이 1개 늘어나요.') +
        ruleHTML('📣', '응원 효과', c.name + iga(c.name) + ' 힘이 세져서 ' + prey.icon + ' ' + prey.name + ' 주가를 끌어내려요. 모두 합쳐 ' + COUNTER_FROM + '주부터는 천적 ' + pred.icon + ' ' + pred.name + iga(pred.name) + ' 반격을 노려요.') +
        '</div>';
    }
    return head('gym-' + cid, c.icon, '🏢 ' + c.name + ' · ' + c.place) +
      '<div class="sheet-body co-sheet">' +
      '<div class="co-head"><div style="min-width: 0"><h2 class="sheet-title">' + c.icon + ' ' + esc(c.name) + '</h2>' +
      '<div class="caption">' + esc(c.what) + ' · ' + style.icon + ' ' + style.name + ' (하루 ±' + Math.round(style.noise * 100) + '%) · ' + TYPES[cid].name + ' 타입 · ' + esc(c.boss) + '</div></div>' +
      '<div style="text-align: right"><div class="co-price"><b>' + fmt(price) + '<small style="font-size: 13px">원</small></b></div>' + delta + '</div></div>' +
      tabs + '<div class="co-tabbody">' + body + '</div>' +
      '<button class="btn btn-muted" type="button" data-act="close-sheet">닫기</button>' +
      '</div>';
  }
  function ruleHTML(ico, t, d) {
    return '<div class="rule"><span class="rule-ico" aria-hidden="true">' + ico + '</span><div><div class="rule-t">' + esc(t) + '</div><div class="rule-d">' + esc(d) + '</div></div></div>';
  }

  // ── 내 말 고르기 (쪽 넘기기) ──
  function partnerHTML() {
    const v = viewer();
    return head('calm', '🐾', '내 말 고르기') +
      '<div class="sheet-body pt-sheet"><div class="caption">말판을 같이 다닐 포켓몬을 골라요. 배틀할 때는 최대 3마리를 데려가요.</div>' +
      '<div class="grid-fit pt-grid" id="pt-grid" data-fit="partner"></div><div class="pager" id="pg-pt-grid"></div>' +
      '<div class="btn-row"><button class="btn' + (!v.partner ? ' btn-buy' : '') + '" type="button" data-act="set-partner" data-fam="">♟️ 기본 말' + (!v.partner ? ' ✓' : '') + '</button>' +
      '<button class="btn btn-muted" type="button" data-act="close-sheet">닫기</button></div></div>';

  function fillPartnerGrid(id) {
    const v = viewer();
    const fams = Object.keys(v.mons).sort((a, b) => powerOf(v.mons[b]) - powerOf(v.mons[a]));
    renderPaged(id, fams.map((f) => {
      const m = v.mons[f];
      const s = SP[m.sp];
      const on = v.partner === f;
      return '<button class="popt' + (on ? ' on' : '') + '" type="button" data-act="set-partner" data-fam="' + f + '">' + miniEm(m.sp, '', true) +
        '<span style="min-width: 0"><b>' + esc(s.name) + (m.stars ? ' ' + '⭐'.repeat(m.stars) : '') + '</b><small>' + TYPES[s.type].icon + ' Lv.' + m.lv + ' · ⚡' + powerOf(m) + ' · ❤️' + hpOf(m) + '</small></span>' +
        '<span class="pchk">' + (on ? '✓' : '') + '</span></button>';
    }), { w: 220, h: 60, gap: 8, cols: 1, rows: 5, maxCols: 3, empty: '아직 포켓몬이 없어요' });
  }

  // ── 주주 총회 ──
  function meetingHTML() {
    const st = store.st;
    const m = st.meeting;
    if (!m) return '';
    const c = COMP[m.cid];
    const v = viewer();
    const n = v.sh[m.cid] || 0;
    const can = needsVote(st, v) && (store.mode !== 'online' || v.pid === store.me);
    let A = m.npcA;
    let B = m.npcB;
    Object.keys(m.votes).forEach((pid) => { if (m.votes[pid] === 'a') A += m.weights[pid] || 0; else B += m.weights[pid] || 0; });
    if (m.result) { A = m.A; B = m.B; }
    const total = Math.max(1, A + B);
    const voters = meetingVoters(st);
    const waiting = voters.filter((q) => !m.votes[q.pid]).map((q) => q.name);
    let res = '';
    if (m.result) {
      res = '<div class="banner ' + (m.result === 'a' ? 'banner-good' : 'banner-info') + '">' +
        (m.result === 'a' ? '💰 나눠 주기로 정했어요! (' + A + ' 대 ' + B + ')<small>1주마다 ' + m.per + '원씩 배당금을 받았어요.' + (m.paid[v.pid] ? ' 나는 ' + fmt(m.paid[v.pid]) + '원!' : '') + '</small>'
          : '🏭 회사를 키우기로 했어요! (' + B + ' 대 ' + A + ')<small>이번엔 배당금이 없지만, 3일 동안 ' + c.icon + ' 주가가 오를 힘(+3%)을 받아요.</small>') + '</div>';
    }
    const opt = (k, t, d) => '<button class="vote-opt' + (m.votes[v.pid] === k ? ' pick' : '') + '" type="button" data-act="vote" data-choice="' + k + '"' + (can ? '' : ' disabled') + '><b>' + t + '</b><span>' + d + '</span></button>';
    return head('calm', '🏛️', '주주 총회 · ' + m.day + '일차') +
      '<div class="sheet-body">' +
      '<h2 class="sheet-title">' + c.icon + ' ' + esc(c.name) + ' 주주 총회</h2>' +
      '<div class="sheet-text">회사가 이번에 ' + fmt(m.earn) + '원을 벌었어요. 어떻게 쓸까요?\n주식을 가진 주주만 투표해요. 1주 = 1표!</div>' +
      '<div class="chip" style="justify-self: start">🗳️ 나의 표: ' + n + '표' + (m.votes[v.pid] ? ' · 투표 완료' : '') + '</div>' +
      opt('a', '💰 ① 주주에게 나눠 주기', '배당금으로 1주마다 ' + m.per + '원 → 나는 ' + fmt(n * m.per) + '원을 받아요.') +
      opt('b', '🏭 ② 회사 키우기', '지금은 못 받지만, 3일 동안 주가가 오를 힘(+3%)을 받아요.') +
      '<div class="tally"><div class="tally-row" style="color: var(--gold-fg)"><span>💰 나눠 주기</span><span>' + A + '표</span></div><div class="bar"><i style="width: ' + Math.round((A / total) * 100) + '%; background: var(--gold)"></i></div>' +
      '<div class="tally-row" style="color: var(--down)"><span>🏭 회사 키우기</span><span>' + B + '표</span></div><div class="bar"><i style="width: ' + Math.round((B / total) * 100) + '%; background: var(--down)"></i></div>' +
      '<div class="caption">다른 주주(어른들) ' + (m.npcA + m.npcB) + '표가 먼저 들어왔어요.' + (!m.result && waiting.length ? ' 기다리는 주주: ' + esc(waiting.join(', ')) + '.' : '') + (m.result ? '' : ' 모두 투표하거나 오늘 밤이 되면 결과가 나와요.') + '</div></div>' +
      res +
      '<div class="banner banner-hint">💡 주주는 회사의 주인이라 중요한 일을 투표로 정해요. 주식이 많을수록 표도 많아요. 진짜 회사들도 주주 총회에서 배당금을 정해요.</div>' +
      '<button class="btn btn-muted" type="button" data-act="close-sheet">닫기</button></div>';
  }

      return head('calm', '👥', '같이 하기 · 방 ' + store.code) + '<div class="sheet-body">' +
        '<div class="banner banner-good">📱 지금 방 <b>' + store.code + '</b>에서 같이 하고 있어요<small>다른 폰에서 이 링크를 열고 👥 → 방 ' + store.code + ' → 내 이름을 누르면 들어와요.</small></div>' +
        '<div class="caption" style="font-weight: 800">이 폰은 누구 카드예요?</div><div class="popt-list">' + rows + '</div>' +
        '<button class="btn" type="button" data-act="add-player"' + (st.players.length >= MAX_PLAYERS ? ' disabled' : '') + '>➕ 같이 할 사람 추가 (최대 ' + MAX_PLAYERS + '명)</button>' +
        '<button class="btn" type="button" data-act="leave-room">📱 이 폰은 혼자 하기로 돌아가기</button>' +

        '<div class="caption mt8">나는 누구예요?</div><div class="btn-row mt8">' + r.players.map((p) =>
          '<button class="btn" type="button" data-act="join-room" data-code="' + r.code + '" data-pid="' + esc(p.pid) + '">' + esc(p.name) + '</button>').join('') + '</div></div>').join('')
        : '<div class="caption">아직 만든 방이 없어요. 먼저 한 폰에서 방을 만들어 주세요.</div>';
    }
    return head('calm', '👥', '같이 하기') + '<div class="sheet-body">' + intro +
      '<h3 class="card-title" style="margin: 4px 0 0">방 들어가기</h3>' + list +
      '<button class="btn" type="button" data-act="refresh-rooms">🔄 방 다시 찾기</button>' +
      '<h3 class="card-title" style="margin: 8px 0 0">방 만들기</h3>' +
      '<div class="caption">지금 이 폰의 게임(' + st.players.map((p) => esc(p.name)).join(', ') + ')으로 방을 만들어요. 폰마다 한 사람씩 카드를 골라요.</div>' +
      (st.players.length < 2 ? '<div class="banner banner-hint">💡 먼저 같이 할 사람을 추가해 주세요. 지금은 ' + esc(st.players[0].name) + ' 카드 하나뿐이에요.</div>' : '') +
      '<div class="btn-row"><button class="btn" type="button" data-act="add-player"' + (st.players.length >= MAX_PLAYERS ? ' disabled' : '') + '>➕ 사람 추가</button>' +
      '<button class="btn-primary" type="button" data-act="create-room">📱📱 방 만들기</button></div>' +
      '<button class="btn btn-muted" type="button" data-act="close-sheet">닫기</button></div>';
  }

  function sheetHTML(s) {
    if (s.k === 'company') return companyHTML(s.cid);
    if (s.k === 'partner') return partnerHTML();
    if (s.k === 'meeting') return meetingHTML();
    if (s.k === 'handoff') return handoffHTML(s.pid);
    if (s.k === 'together') return togetherHTML();
    if (s.k === 'team') return teamSheetHTML();
    if (s.k === 'mon') return monDetailHTML(s.fam);
    if (s.k === 'evo') return evoSheetHTML(s);
    if (s.k === 'news') return newsSheetHTML();
    if (s.k === 'night') return store.st.night ? nightSheetHTML() : '';
    if (s.k === 'log') return logSheetHTML();
    if (s.k === 'legend') return legendSheetHTML();
    if (s.k === 'pool') return poolSheetHTML(s.ball);

  /* =========================================================
     9. 화면 — 주식 (상성 원 · 회사 8곳 · 내 재산)

  // 같은 내용이면 다시 그리지 않아요 (누르는 중인 버튼이 사라지지 않게)
  function setHTML(id, html) {
    const el = $(id);
    if (!el || el._h === html) return el;
    el.innerHTML = html;
    el._h = html;
    return el;
  }
  // 상성 원: 배지 자리(왼쪽 위 모서리)와 회사 사이 화살표
  const RING_POS = [[162, 10], [269, 55], [314, 162], [269, 269], [162, 314], [55, 269], [10, 162], [55, 55]];
  const RING_ARC = [
    'M232.0 40.6 A152 152 0 0 1 258.3 49.8', 'M325.8 110.6 A152 152 0 0 1 342.2 150.2',
    'M344.0 218.0 A152 152 0 0 1 329.7 258.4', 'M265.4 322.7 A152 152 0 0 1 239.7 333.3',

  const RING_HEAD = [
    'M265.4 53.3 L254.9 54.0 L260.0 44.3Z', 'M344.0 158.0 L336.8 150.2 L347.6 148.0Z',
