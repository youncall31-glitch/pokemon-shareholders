  function ringHTML() {
    const st = store.st;
    const M = st.market;
    const v = viewer();
    const tot = totalShares(st);
    const level = st.settings.counter;
    let arcs = '<circle class="rg-dash" cx="195" cy="188" r="152"></circle>';
    COMPANIES.forEach((c, i) => {
      const w = 3 + 5 * (supportOf(tot[c.id]) / SUPPORT_MAX);
      arcs += '<path class="rg-arc cs-' + c.id + '" d="' + RING_ARC[i] + '" style="stroke-width: ' + w.toFixed(1) + 'px' + (tot[c.id] ? '' : '; opacity: 0.55') + '"></path>' +
        '<path class="cfill-' + c.id + '" d="' + RING_HEAD[i] + '"></path>';
    });
    const risks = [];
    const badges = COMPANIES.map((c, i) => {
      const pos = RING_POS[i];
      const price = M.price[c.id];
      const ch = price - M.prev[c.id];
      const n = v.sh[c.id] || 0;
      const risk = counterChance(tot[c.id], level);
      if (risk) risks.push({ c, risk });
      const label = c.name + ' ' + fmt(price) + '원' + (ch > 0 ? ' 올랐어요' : ch < 0 ? ' 내렸어요' : '') + ', 내 주식 ' + n + '주' + (risk ? ', 반격 확률 ' + Math.round(risk * 100) + '%' : '');
      return '<g class="rg-b' + (n ? ' sel' : '') + '" data-act="open-company" data-cid="' + c.id + '" transform="translate(' + pos[0] + ' ' + pos[1] + ')" role="button" tabindex="0" aria-label="' + esc(label) + '">' +
        (risk ? '<rect class="rg-risk" x="-4" y="-4" width="74" height="60" rx="16"></rect>' : '') +
        '<rect class="bx cf-' + c.id + '" width="66" height="52" rx="14"></rect>' +
        '<text class="rg-ico" x="33" y="14">' + c.icon + '</text>' +
        '<text class="rg-nm" x="33" y="31">' + esc(c.short) + '</text>' +
        '<text class="rg-pr' + (ch > 0 ? ' up' : ch < 0 ? ' down' : '') + '" x="33" y="45">' + (ch > 0 ? '▲' : ch < 0 ? '▼' : '') + fmt(price) + '원</text>' +
        (n ? '<g class="rg-pill" transform="translate(63 0)"><rect x="-14" y="-9" width="28" height="18" rx="9"></rect><text x="0" y="0.5">' + n + '주</text></g>' : '') +
        '</g>';
    }).join('');
    risks.sort((a, b) => b.risk - a.risk);
    const riskLine = risks.length
      ? '<text class="rg-mid-s" x="195" y="246" style="fill: var(--up)">💥 반격 주의: ' + risks.slice(0, 2).map((r) => r.c.icon + ' ' + Math.round(r.risk * 100) + '%').join(' · ') + '</text>'
      : '<text class="rg-mid-s" x="195" y="246" style="fill: var(--good-fg)">🛡️ 지금은 반격 걱정 없어요</text>';
    const mid = '<g class="rg-mid" aria-hidden="true">' +
      '<text class="rg-mid-t" x="195" y="146">⚔️ 상성 원</text>' +
      '<text class="rg-mid-s" x="195" y="170">화살표가 가리키는</text>' +
      '<text class="rg-mid-s" x="195" y="185">회사를 이겨요</text>' +
      '<text class="rg-mid-s" x="195" y="207" style="font-weight: 700">주식이 많은 회사가 힘이 세서</text>' +
      '<text class="rg-mid-s" x="195" y="222" style="font-weight: 700">진 회사 주가를 끌어내려요</text>' +
      (level ? riskLine : '<text class="rg-mid-s" x="195" y="246">💤 천적 반격 꺼짐</text>') + '</g>';
    return arcs + mid + badges;
  }

  // 회사 칸: 이름 · 주가 · 오늘 움직임 · 내 주식(수익률) · 사기/팔기 (이름을 누르면 자세히)
  function coRowHTML(c) {
    const st = store.st;
    const M = st.market;
    const v = viewer();
    const mine = store.mode !== 'online' || v.pid === store.me;
    const price = M.price[c.id];
    const prev = M.prev[c.id];
    const ch = price - prev;
    const n = v.sh[c.id] || 0;
    const t = totalShares(st)[c.id];
    const risk = counterChance(t, st.settings.counter);
    const news = st.news.find((x) => x.cid === c.id);
    const boost = M.boost[c.id];
    const delta = ch > 0 ? '<span class="delta delta-up">▲' + fmt(ch) + ' ' + pctText(ch / prev) + '</span>'
      : ch < 0 ? '<span class="delta delta-down">▼' + fmt(-ch) + ' ' + pctText(ch / prev) + '</span>'
        : '<span class="delta delta-same">' + (st.day === 1 ? '첫날' : '어제와 같아요') + '</span>';
    let mineChip = '';
    if (n) {
      const avg = (v.cost[c.id] || 0) / n;
      const r = avg > 0 ? price / avg - 1 : 0;
      mineChip = '<span class="chip ct2-mine ' + (r > 0.0005 ? 'chip-up' : r < -0.0005 ? 'chip-down' : 'chip-good') + '" title="내 주식 수익률">🍕' + n + '주 ' + pctText(r) + '</span>';
    }
    const tags = [];
    if (news) tags.push('<span class="chip ' + (news.dir > 0 ? 'chip-up">📰 좋은 뉴스' : 'chip-down">📰 나쁜 뉴스') + '</span>');
    if (risk) tags.push('<span class="chip chip-hot">💥 반격 ' + Math.round(risk * 100) + '%</span>');
    if (boost) tags.push('<span class="chip chip-gold">🏭 +3% ' + boost + '일</span>');
    if (isMulti(st) && t > n) tags.push('<span class="chip">🤝 모두 ' + t + '주</span>');
    tags.push('<span class="chip">💪→' + COMP[preyOf(c.id)].icon + ' ⚠️' + COMP[predOf(c.id)].icon + '</span>');
    const newsMark = news ? '<span class="ct2-news ' + (news.dir > 0 ? 'up' : 'down') + '" title="뉴스">📰' + (news.dir > 0 ? '▲' : '▼') + '</span>' : '';
    return '<div class="ct2' + (n ? ' held' : '') + '">' +
      '<button class="ct2-head" type="button" data-act="open-company" data-cid="' + c.id + '" aria-label="' + esc(c.name) + ' 자세히 보기">' +
        '<span class="ct2-ico bg-' + c.id + '" aria-hidden="true">' + c.icon + '</span>' +
        '<span class="ct2-nm">' + esc(c.short) + '</span>' +
        '<span class="ct2-pr">' + fmt(price) + '<small>원</small></span></button>' +
      '<div class="ct2-mid">' + delta + mineChip + newsMark + '</div>' +
      '<div class="ct2-tags"><span class="ct2-what">' + STYLES[c.style].icon + ' ' + esc(c.what) + '</span>' + tags.join('') + '</div>' +
      (mine ? '<div class="ct2-btns"><button class="btn btn-buy" type="button" data-act="buy" data-cid="' + c.id + '">📈 사기</button>' +
        '<button class="btn btn-sell" type="button" data-act="sell" data-cid="' + c.id + '"' + (n ? '' : ' aria-disabled="true"') + '>📉 팔기</button></div>' : '') +
      '</div>';
  }
  // 회사 탭 위: 오늘의 뉴스 · 주주 총회 (누르면 자세히)
  function stockTopHTML() {
    const st = store.st;
    const v = viewer();
    const lines = st.news.map((nw) => {
      const c = COMP[nw.cid];
      return '<button class="news-line ' + (nw.dir > 0 ? 'good' : 'bad') + '" type="button" data-act="open-news">' +
        '<span class="nl-t">' + (nw.src === 'flash' ? '📺 속보' : '📰 뉴스') + ' ' + c.icon + ' ' + esc(nw.text) + '</span>' +
        '<b>' + (nw.dir > 0 ? '▲ 오를 듯' : '▼ 내릴 듯') + '</b></button>';
    });
    const m = st.meeting;
    if (m && !m.result) {
      const c = COMP[m.cid];
      const need = needsVote(st, v);
      lines.push('<button class="news-line meet' + (need ? ' hot' : '') + '" type="button" data-act="open-meeting"><span class="nl-t">🏛️ ' + c.icon + ' ' + esc(c.name) + ' 주주 총회 중</span><b>' + (need ? '🗳️ 투표하기' : '구경하기') + '</b></button>');
    }
    return lines.join('');
  }
  function wealthHTML() {
    const st = store.st;
    const v = viewer();
    const stock = stockValue(st, v);
    const total = v.cash + stock;
    const d = total - START_CASH;
    const series = (v.hist || []).slice(-29).concat([total]);
    let mn = Math.min(START_CASH, ...series);
    let mx = Math.max(START_CASH, ...series);
    if (mx - mn < 2000) { const m = (mx + mn) / 2; mn = m - 1000; mx = m + 1000; }
    const yOf = (x) => (6 + ((mx - x) / (mx - mn)) * 58).toFixed(1);
    const pts = series.length > 1
      ? series.map((x, i) => ((i / (series.length - 1)) * 326).toFixed(1) + ',' + yOf(x)).join(' ')
      : '0,' + yOf(series[0]) + ' 326,' + yOf(series[0]);
    const last = series.length > 1 ? 326 : 326;
    const cost = RING.reduce((s, c) => s + (v.cost[c] || 0), 0);
    const gain = Math.round(stock - cost);
    return '<div class="row-between"><h2 class="card-title" style="margin: 0">💰 내 재산</h2><span class="wealth-total">' + fmt(total) + '<small>원</small></span></div>' +
      '<div style="text-align: right"><span class="delta ' + (d > 0 ? 'delta-up">▲ +' : d < 0 ? 'delta-down">▼ −' : 'delta-same">± ') + fmt(Math.abs(d)) + '원 · 처음보다</span></div>' +
      '<svg class="spark" viewBox="0 0 326 70" aria-hidden="true">' +
        '<line class="spark-base" x1="0" y1="' + yOf(START_CASH) + '" x2="326" y2="' + yOf(START_CASH) + '"></line>' +
        '<polyline class="spark-line" points="' + pts + '"></polyline>' +
        '<circle class="spark-dot" cx="' + last + '" cy="' + yOf(total) + '" r="4"></circle></svg>' +
      '<div class="row-between wealth-split"><span>💵 현금 ' + fmt(v.cash) + '원</span><span>📈 주식 ' + fmt(stock) + '원' + (cost ? ' (' + (gain >= 0 ? '+' : '−') + fmt(Math.abs(gain)) + ')' : '') + '</span></div>' +
      '<div class="caption">처음 재산 ' + fmt(START_CASH) + '원에서 시작했어요. 점선이 처음 재산이고, 밤마다 한 점씩 늘어나요.</div>';
  }

  // ── 📊 내 주식 성적표: 수익률 · 번 돈 · 회사마다 · 다음 단계 ──
  const signOf = (x) => (x > 0 ? '+' : x < 0 ? '−' : '±');
  const updn = (x) => (x > 0.0005 ? 'up' : x < -0.0005 ? 'down' : 'same');
  // 오른 주식을 다 팔면 다음 단계 번 돈 조건을 채우는지 (안내 한 줄)
  function sellHint(st, v) {
    const nx = nextTierNeed(v);
    const pf = portfolio(st, v);
    if (!nx || nx.earned <= 0 || pf.gain <= 0) return '';
    const after = v.earned + pf.gain;
    return after >= nx.t.earned
      ? '💡 지금 다 팔면 번 돈 ' + fmt(after) + '원 → ' + nx.t.ball + ' ' + nx.t.name + ' 번 돈 조건 완성!'
      : '💡 오른 주식은 팔아야 번 돈이 돼요 · 지금 다 팔면 +' + fmt(pf.gain) + '원';
  }
  function reportRowHTML(st, v, c) {
    const n = v.sh[c];
    const avg = (v.cost[c] || 0) / n;
    const price = st.market.price[c];
    const r = avg > 0 ? price / avg - 1 : 0;
    const g = Math.round((price - avg) * n);
    return '<button class="rp-row" type="button" data-act="open-company" data-cid="' + c + '"><span class="rp-co">' + COMP[c].icon + ' ' + esc(COMP[c].short) + ' <small>' + n + '주</small></span>' +
      '<span class="rp-pr">' + fmt(avg) + ' → ' + fmt(price) + '원</span>' +
      '<span class="rp-r ' + updn(r) + '"><b>' + pctText(r) + '</b><small>' + signOf(g) + fmt(Math.abs(g)) + '원</small></span></button>';
  }
  function reportHTML() {
    const st = store.st;
    const v = viewer();
    const pf = portfolio(st, v);
    const realized = v.earned - (v.divs || 0);
    const held = RING.filter((c) => (v.sh[c] || 0) > 0);
    const nx = nextTierNeed(v);
    let next;
    if (nx) {
      const N = nx.t;
      const n = peakOf(v);
      const hint = sellHint(st, v);
      next = '<div class="rp-next"><div class="rp-next-t">' + N.ball + ' 다음 뽑기 단계 · ' + N.name + '까지</div>' +
        '<div class="rp-gauges"><div><div class="meter"><span>📈 주식 모으기</span><span>' + n + '/' + N.shares + '주' + (nx.shares ? '' : ' ✅') + '</span></div>' +
        '<div class="gauge gold"><i style="width: ' + Math.round(clamp(n / N.shares, 0, 1) * 100) + '%"></i></div></div>' +
        '<div><div class="meter"><span>💰 번 돈</span><span>' + (v.earned < 0 ? '−' : '') + fmt(Math.abs(v.earned)) + '/' + fmt(N.earned) + '원' + (nx.earned ? '' : ' ✅') + '</span></div>' +
        '<div class="gauge green"><i style="width: ' + Math.round(clamp(v.earned / N.earned, 0, 1) * 100) + '%"></i></div></div></div>' +
        (hint ? '<div class="banner banner-hint">' + esc(hint) + '</div>' : '') + '</div>';
    } else {
      next = '<div class="banner banner-good">🟣 마스터볼까지 모두 열었어요! 이제 전설의 포켓몬을 만날 수 있어요.</div>';
    }
    return '<div class="rp-hero">' +
        '<div class="rp-cell"><div class="rp-l">📊 주식 수익률</div><div class="rp-big ' + (pf.cost ? updn(pf.rate) : 'same') + '">' + (pf.cost ? pctText(pf.rate) : '—') + '</div>' +
          '<div class="rp-s">' + (pf.cost ? '지금 팔면 ' + signOf(pf.gain) + fmt(Math.abs(pf.gain)) + '원' : '주식을 사면 보여요') + '</div></div>' +
        '<div class="rp-cell"><div class="rp-l">💰 주식으로 번 돈</div><div class="rp-big earn' + (v.earned < 0 ? ' down' : '') + '">' + (v.earned < 0 ? '−' : '') + fmt(Math.abs(v.earned)) + '<small>원</small></div>' +
          '<div class="rp-s">판 이익 ' + signOf(realized) + fmt(Math.abs(realized)) + ' · 배당금 +' + fmt(v.divs || 0) + '</div></div>' +
      '</div>' +
      (pf.cost ? '<div class="rp-line">💸 산 값 <b>' + fmt(pf.cost) + '원</b> → 📈 지금 값 <b>' + fmt(pf.value) + '원</b> · 🍕 ' + pf.n + '주</div>' : '') +
      (held.length ? '<div class="grid-fit rp-list" id="rp-list"></div><div class="pager" id="pg-rp-list"></div>'
        : '<div class="rp-empty caption">아직 가진 주식이 없어요. 🏢 회사 8곳에서 1주를 사 보세요!</div>') +
      next +
      '<div class="caption rp-cap opt1">수익률 = (지금 값 − 산 값) ÷ 산 값 · 팔아야 진짜 번 돈이 돼요 · 주식 모으기는 가장 많이 가졌던 주식 수 (팔아도 그대로)</div>';
  }
  function renderReportRows() {
    const st = store.st;
    const v = viewer();
    if (!$('rp-list')) return;
    const held = RING.filter((c) => (v.sh[c] || 0) > 0);
    renderPaged('rp-list', held.map((c) => reportRowHTML(st, v, c)), { w: 240, h: 42, gap: 6, cols: 1, rows: 3, maxCols: 2 });
  }

  /* =========================================================

  const BALL_DESC = { 1: '처음 모습 포켓몬만 나와요', 2: '한 번 진화한 포켓몬만 나와요', 3: '최종 진화와 강한 포켓몬만 나와요', 4: '전설 포켓몬만 나와요' };
  const capIcon = (k) => (k === 'rainbow' ? '🌈' : COMP[k].icon);
  const capName = (k) => (k === 'rainbow' ? '🌈 무지개' : COMP[k].icon + ' ' + TYPES[k].name);
  const shopBall = (v) => clamp(ui.ball || v.tier, 1, v.tier);

  const poolSize = (b) => CAPSULE_KEYS.reduce((n, k) => n + (POOLS[b][k] || []).length, 0);
  const poolSeen = (b, v) => CAPSULE_KEYS.reduce((n, k) => n + (POOLS[b][k] || []).filter((sp) => v.dex[sp]).length, 0);
  function machineHTML(v) {
    const b = shopBall(v);
    const t = TIERS[b];
    const balls = [1, 2, 3, 4].map((n) => {
      const lock = n > v.tier;

        '<span class="b-ico" aria-hidden="true">' + TIERS[n].ball + '</span><span class="b-name">' + TIERS[n].name + (lock ? ' 🔒' : '') + '</span><span class="b-sub opt1">' + TIERS[n].stage + '</span></button>';
    }).join('');
    const short = v.cash < DRAW_PRICE;
    const caps = capsuleCounts(v, b);
    let top = null;
    RING.forEach((c) => { if (caps[c] > 2 && (!top || caps[c] > caps[top])) top = c; });
    const capLine = CAPSULE_KEYS.filter((k) => POOLS[b][k]).map((k) => '<span class="ct' + (caps[k] > 2 ? ' hot' : '') + '">' + capIcon(k) + caps[k] + '</span>').join('');
    return '<div class="balls">' + balls + '</div>' +
      '<div class="machine">' +
        '<div class="orb t' + b + '" aria-hidden="true"><div class="ring"></div><div class="core"></div><div class="bl">' + t.ball + '</div></div>' +
        '<div class="machine-title">' + t.name + ' 뽑기 · 한 번 ' + fmt(DRAW_PRICE) + '원</div>' +
        '<div class="machine-sub opt2">' + BALL_DESC[b] + ' · ' + poolSize(b) + '종 (도감 ' + poolSeen(b, v) + ')</div>' +
        '<div class="cap-line" title="뽑기 상자 캡슐">🎰 ' + capLine + '</div>' +
        '<div class="cap-note opt1">' + (top ? '📈 내 ' + COMP[top].icon + ' 주식 덕분에 ' + COMP[top].icon + ' ' + TYPES[top].name + ' 타입이 잘 나와요!' : '💡 회사 주식 2주마다 그 타입 캡슐이 늘어요') + '</div>' +
        '<div class="mc-links"><button class="btn btn-small" type="button" data-act="open-pool" data-ball="' + b + '">🔎 나오는 포켓몬</button><button class="btn btn-small" type="button" data-act="open-caps">🎰 캡슐 확률</button></div>' +
        '<button class="draw-btn t' + b + '" type="button" data-act="draw">' + t.ball + ' ' + t.name + '로 뽑기 (−' + fmt(DRAW_PRICE) + '원)</button>' +
        '<div class="caption' + (short ? '' : ' opt1') + '">' + (short ? '💸 ' + fmt(DRAW_PRICE - v.cash) + '원이 더 필요해요. 주식으로 돈을 불려 봐요 📈' : '같은 가족 3마리가 모이면 진화 준비! 진화는 내가 골라요 ✨') + '</div>' +
      '</div>';

  function capsulesHTML(v) {
    const b = shopBall(v);
    const caps = capsuleCounts(v, b);
    let total = 0;
    CAPSULE_KEYS.forEach((k) => { if (POOLS[b][k]) total += caps[k]; });
    const mine = RING.filter((c) => (v.sh[c] || 0) > 0).map((c) => {
      const n = v.sh[c];
      const plus = Math.min(5, Math.floor(n / 2));
      return COMP[c].icon + ' ' + esc(COMP[c].name) + ' ' + n + '주 → ' + COMP[c].icon + ' 캡슐 ' + (plus ? '+' + plus + '개' : '+0개 (2주부터)');
    });
    let box = '';
    CAPSULE_KEYS.forEach((k) => { for (let i = 0; i < caps[k]; i++) box += '<span class="cp k-' + k + '"></span>'; });
    const chips = CAPSULE_KEYS.map((k) => '<span class="ct' + (caps[k] > 2 ? ' hot' : '') + '">' + capIcon(k) + ' ' + caps[k] + '개 · ' + Math.round((caps[k] / total) * 100) + '%</span>').join('');
    let top = null;
    RING.forEach((c) => { if (caps[c] > 2 && (!top || caps[c] > caps[top])) top = c; });
    const topNames = top ? POOLS[b][top].map((k) => SP[k].name) : [];
    const topText = topNames.slice(0, 4).join('·') + (topNames.length > 4 ? ' 등' : '');
    const note = top
      ? '→ 이번 ' + TIERS[b].ball + ' ' + TIERS[b].name + '에서는 ' + COMP[top].icon + ' ' + topText + iga(topText) + ' 가장 잘 나와요! 캡슐은 고른 볼 안에서만 확률을 바꿔요.'
      : '→ 지금은 모든 타입이 똑같이 나와요. 좋아하는 타입 회사의 주식을 2주 모으면 그 타입이 더 잘 나와요!';
    return '<div class="caps-body">' +
      '<div class="caption">상자에는 타입마다 캡슐 2개가 기본으로 들어 있어요. 회사 주식 <b>2주마다</b> 그 회사 타입 캡슐이 1개 늘어나요 (최대 +5개).</div>' +
      '<div class="cap-mine mt8">' + (mine.length ? esc(v.name) + '의 주식<br>' + mine.join('<br>') : '아직 주식이 없어요. 📈 주식 탭에서 회사 주식을 사 보세요!') + '</div>' +
      '<div class="capbox mt8" aria-hidden="true">' + box + '</div>' +
      '<div class="mt8">' + chips + '</div>' +
      '<div class="banner banner-info mt8">' + note + '</div>' +
      '<div class="caption mt8">🌈 무지개 캡슐에서는 회사가 없는 타입(노말 · 에스퍼 · 페어리 · 독 · 벌레 · 고스트 · 얼음 · 드래곤) 포켓몬이 나와요. 무지개 포켓몬 4종마다 캡슐이 1개씩 있어요 (최소 2개). 이 캡슐은 주식으로 늘어나지 않아요.</div></div>';
  }
  function capsSheetHTML() {
    const v = viewer();
    const b = shopBall(v);
    return head('calm', '🎰', TIERS[b].ball + ' ' + TIERS[b].name + ' 뽑기 상자 · 내 주식이 바꿔요') + '<div class="sheet-body">' + capsulesHTML(v) +
      '<button class="btn btn-muted" type="button" data-act="close-sheet">닫기</button></div>';

      { w: 74, h: 84, gap: 6, cols: 4, rows: 4, maxCols: 10 });

  function tiersHTML(v) {
    const rows = [1, 2, 3, 4].map((t) => {
      const T = TIERS[t];
      const cls = t < v.tier ? 'done' : t === v.tier ? 'now' : 'lock';
      const req = t === 1 ? '처음부터 열려 있어요' : '주식 ' + T.shares + '주 모으기 + 번 돈 ' + fmt(T.earned) + '원';
      return '<div class="tier-box ' + cls + '"><div class="tier-head"><div class="tb" aria-hidden="true">' + T.ball + '</div><div style="min-width: 0">' +
        '<div class="tn">' + t + '단계 · ' + T.name + (cls === 'done' ? ' ✅' : cls === 'now' ? ' · 지금' : ' 🔒') + ' <small class="opt1">' + T.stage + '</small></div><div class="tc">' + req + '</div></div>' +
        '<button class="btn btn-small" type="button" data-act="open-pool" data-ball="' + t + '">🔎 ' + poolSize(t) + '종</button></div></div>';
    }).join('');
    let next = '';
    if (v.tier < 4) {
      const N = TIERS[v.tier + 1];
      const n = peakOf(v);
      const e = Math.max(0, v.earned);
      const okS = n >= N.shares;
      const okE = v.earned >= N.earned;
      const hint = sellHint(store.st, v);
      next = '<div class="rp-next"><div class="rp-next-t">' + N.ball + ' ' + N.name + '까지</div><div class="rp-gauges">' +
        '<div><div class="meter"><span>📈 주식 모으기</span><span>' + n + '/' + N.shares + '주' + (okS ? ' ✅' : '') + '</span></div>' +
        '<div class="gauge gold"><i style="width: ' + Math.min(100, Math.round((n / N.shares) * 100)) + '%"></i></div></div>' +
        '<div><div class="meter"><span>💰 번 돈</span><span>' + (v.earned < 0 ? '−' : '') + fmt(Math.abs(v.earned)) + '/' + fmt(N.earned) + '원' + (okE ? ' ✅' : '') + '</span></div>' +
        '<div class="gauge green"><i style="width: ' + Math.min(100, Math.round((e / N.earned) * 100)) + '%"></i></div></div></div>' +
        (hint ? '<div class="banner banner-hint">' + esc(hint) + '</div>' : '') +

    } else {

    }
    return '<div class="tier-list">' + rows + '</div>' + next;

  function slotsHTML(g) {
    return '<div class="merge-slots" aria-label="합체 칸 ' + g + '/3">' + [0, 1, 2].map((i) => '<span class="mslot' + (i < g ? ' on' : '') + '">' + (i < g ? '✨' : '') + '</span>').join('') + '</div>';

  function nextFormText(fam, m) {
    const opts = evoTargets(fam, m);
    if (!opts.length) return '';
    const to = opts.length > 1 ? '5가지 모습 중 하나' : SP[opts[0]].name;
    return '합체 3마리 또는 Lv.' + evoLv(m) + '이 되면 ' + to + euro(to) + ' 진화할 수 있어요 (진화는 내가 골라요)';

  function revealHTML(v) {

    const got = SP[d.sp];
    const now = SP[m.sp];
    const legend = got.pool === 4;
    const pw = powerOf(m);
    let title = '';
    let pic = '';
    let msg = '';
    let extra = '';
    if (r.type === 'new') {
      title = (legend ? '🌟 전설의 포켓몬! ' : '🎉 새 친구! ') + got.name + ' <span class="pill pill-new">NEW</span>';
      pic = visHTML(d.sp, 'big', true);
      msg = TYPES[got.type].icon + ' ' + TYPES[got.type].name + ' 타입 · ⚡' + pw + ' · 도감에 등록됐어요!' + (v.partner === r.fam && Object.keys(v.mons).length === 1 ? '<br>🐾 내 말이 되어 말판을 같이 돌아요!' : '');
      if (famLen(r.fam) > 1 && m.stage < famLen(r.fam) - 1) extra = slotsHTML(m.gauge) + '<div class="caption">' + nextFormText(r.fam, m) + '</div>';

      title = '✨ 합체! ' + got.name + iga(got.name) + ' 또 나왔어요';

      msg = '같은 가족이 모여서 ' + now.name + '의 합체 칸이 찼어요 (' + m.gauge + '/3).';
      extra = slotsHTML(m.gauge) + '<div class="caption">' + nextFormText(r.fam, m) + ' 돈은 들지 않아요.</div>';
    } else if (r.type === 'ready') {
      title = '✨ 합체 완료! 진화할 수 있어요';
      pic = '<div class="merge-stage">' + visHTML(m.sp, 'big', true) + '<div class="merge-in" aria-hidden="true">' + miniEm(d.sp) + '</div></div>';

    } else if (r.type === 'evolve') {

      msg = '3마리가 모여서 ' + now.name + euro(now.name) + ' 진화했어요! 공격력 ⚡' + pw + (r.fam === 'eevee' ? '<br>🌈 내가 가장 많이 가진 회사 타입으로 진화했어요!' : '');
      if (m.stage < famLen(r.fam) - 1) extra = slotsHTML(m.gauge) + '<div class="caption">' + nextFormText(r.fam, m) + '</div>';
    } else if (r.type === 'jump') {

    } else if (r.type === 'star') {

        '<button class="btn" type="button" data-act="hide-draw">닫기</button></div>' +
      '<button class="draw-btn t' + shopBall(v) + ' mt8" type="button" data-act="draw">🎰 한 번 더 뽑기 (−' + fmt(DRAW_PRICE) + '원)</button>' +
      '</div>';
  }

      const ex = Math.round(catchChance({ sp: 'rattata', hp: 3, max: 10 }, k) * 100);
      return '<div class="ball-row' + (lock ? ' lock' : '') + '"><span class="bb-big b-' + k + '" aria-hidden="true"></span>' +
        '<div class="br-mid"><b>' + B.name + (lock ? ' 🔒' : '') + ' <small>가방에 ' + (v.balls[k] || 0) + '개</small></b><small>' + (lock ? B.tier + '단계(' + TIERS[B.tier].ball + ' ' + TIERS[B.tier].name + ')부터 살 수 있어요' : '잘 잡히는 힘 ×' + B.k + ' · 꼬렛 체력 30%일 때 ' + ex + '%') + '</small></div>' +
        '<div class="br-btns"><button class="btn btn-small btn-buy" type="button" data-act="buy-ball" data-ball="' + k + '" data-n="1"' + (lock ? ' disabled' : '') + '>1개<small>' + fmt(B.price) + '원</small></button>' +
        '<button class="btn btn-small btn-buy" type="button" data-act="buy-ball" data-ball="' + k + '" data-n="5"' + (lock ? ' disabled' : '') + '>5개<small>' + fmt(B.price * 5) + '원</small></button></div></div>';
    }).join('');
    return '<div class="row-between"><h2 class="card-title" style="margin: 0">🎒 잡기용 볼 가게</h2><span class="chip">' + BALL_KEYS.map((k) => '<i class="bb-ico b-' + k + '" aria-hidden="true"></i>' + (v.balls[k] || 0)).join(' ') + '</span></div>' +
      '<div class="caption mt8 opt1">야생 포켓몬과 배틀할 때 볼을 던져서 잡아요. <b>체력이 적게 남을수록</b>, <b>좋은 볼일수록</b> 잘 잡혀요. 너무 세게 때려서 기절하면 잡을 수 없어요!</div>' +
      '<div class="ball-list mt12">' + rows + '</div>' +
      '<div class="caption mt8 opt2">💡 잡으면 돈 대신 포켓몬이 생기고, 쓰러뜨리면 +' + fmt(WILD_PRIZE) + '원을 받아요. 어느 쪽이 좋을지 골라 봐요!</div>';
  }
  function renderShopTab() {
    const v = viewer();
    // 뽑기 결과는 화면 가운데 큰 카드로
    const rv = drawResultHTML(v);
    const ov = $('reveal');
    if (rv) {
      setHTML('reveal', '<div class="reveal-box">' + rv + '</div>');
      if (ov.hidden) { ov.hidden = false; document.body.classList.add('locked'); }
    } else if (!ov.hidden) {
      ov.hidden = true;
      ov.innerHTML = '';
      ov._h = '';
      if ($('sheet').hidden && !ui.panel && !bt.on && !evoFx.on) document.body.classList.remove('locked');
    }
    setHTML('shop-balls', ballShopHTML(v));
    setHTML('shop-machine', machineHTML(v));
    setHTML('shop-tiers', tiersHTML(v));
    if (ui.tab === 'shop' && ui.seg.shop === 'coupon') {
      renderPaged('coupon-list', v.coupons.slice().reverse().map((c) => '<button class="btn coupon-btn" type="button" data-act="use-coupon" data-id="' + esc(c.id) + '">🎟️ ' + esc(c.name) +
        '<small>' + (c.date ? esc(c.date.slice(5).replace('-', '월 ')) + '일에 샀어요 · ' : '') + '눌러서 사용 완료</small></button>'), { w: 220, h: 56, gap: 6, cols: 1, rows: 3, maxCols: 3, empty: '아직 쿠폰이 없어요. 위에서 사 보세요!' });
    }
  }

  /* =========================================================
     11. 화면 — 도감 (내 포켓몬 · 배지 진열장 · 주주 증서 · 166종 도감)
     칸이 많으면 ◀ ▶ 쪽으로 넘겨요. 내 포켓몬 카드를 누르면 자세히 보고 진화도 해요.
     ========================================================= */
  function monCardHTML(v, f) {
    const m = v.mons[f];
    const s = SP[m.sp];
    const on = v.partner === f;
    const ready = evoReady(f, m);
    const xpR = m.lv >= MAX_LV ? 1 : clamp((m.xp || 0) / xpNeed(m.lv), 0, 1);
    return '<button class="mc2' + (on ? ' partner' : '') + (ready ? ' ready' : '') + ' t-' + s.type + '" type="button" data-act="open-mon" data-fam="' + f + '" aria-label="' + esc(s.name + ' Lv.' + m.lv + (ready ? ', 진화할 수 있어요' : '')) + '">' +
      '<span class="mc2-top"><span class="mc2-lv">Lv.' + m.lv + '</span>' + (on ? '<span class="mc2-pt" title="내 말">🐾</span>' : m.stars ? '<span class="mc2-star">' + '⭐'.repeat(m.stars) + '</span>' : '') + '</span>' +
      visHTML(m.sp, 'mc2-vis', true) +
      '<span class="mc2-nm">' + esc(s.name) + '</span>' +
      '<span class="mc2-st">' + TYPES[s.type].icon + ' ⚡' + powerOf(m) + ' ❤️' + hpOf(m) + '</span>' +
      '<span class="mc2-xp" aria-hidden="true"><i style="width: ' + Math.round(xpR * 100) + '%"></i></span>' +
      (ready ? '<span class="mc2-evo">✨ 진화할 수 있어요</span>' : '') +
      '</button>';
  }
  function champHTML(v) {
    const nb = badgeCount(v);
    if (v.champ) return '<div class="banner banner-good">🏆 서울 챔피언! 롯데월드타워 꼭대기에서 챔피언을 이겼어요.<small>체육관에서는 연습 배틀로 용돈을 벌 수 있어요.</small></div>';
    if (nb >= 8) return '<div class="banner banner-hint">🏆 배지 8개! 🪨 잠실 롯데월드타워에 가면 챔피언 결정전이 열려요 (챔피언 포켓몬 3마리).<small>상성이 좋은 포켓몬 3마리를 레벨 업해서 도전해요!</small></div>';
    let tip = '';
    const g = nextGymInfo(v);
    if (g) {
      const cid = g.pl.cid;
      const c = COMP[cid];
      let best = null;
      Object.keys(v.mons).forEach((f) => {
        const m = v.mons[f];
        if (eff(SP[m.sp].type, cid) > 1 && (!best || powerOf(m) > powerOf(best))) best = m;
      });
      const good = weakTo(cid);
      tip = '💡 다음 체육관 ' + c.icon + ' ' + c.town + ' (' + g.d + '칸 뒤) · 약점 ' + good.map((t) => TYPES[t].icon).join('') +
        (best ? ' · ' + SP[best.sp].name + eulreul(SP[best.sp].name) + ' 꼭 데려가요!' : ' · 뽑기에서 찾아봐요!');
    }
    return '<div class="champ-box"><div class="row-between"><b>🏆 챔피언까지 배지 ' + (8 - nb) + '개</b><span class="caption opt1">이기면 💰 ' + fmt(gymPrize(v)) + '원 + 📜 주식 1주</span></div>' +
      (tip ? '<div class="champ-tip">' + esc(tip) + '</div>' : '') + '</div>';
  }
  function certsHTML(v) {
    return COMPANIES.map((c) => {
      const d = v.certs[c.id];
      const n = v.sh[c.id] || 0;
      return '<button class="cert-slot' + (d ? ' on bg-' + c.id : '') + '" type="button" data-act="open-company" data-cid="' + c.id + '">' +
        '<span class="cert-ico" aria-hidden="true">' + (d ? c.icon : '📜') + '</span><b>' + esc(c.short) + '</b>' +
        '<small class="opt2">' + (d ? n + '주 · ' + d + '일차~' : '아직 없음') + '</small></button>';
    }).join('');
  }
  function renderDexTab() {
    const v = viewer();
    // 진화할 수 있는 친구가 먼저, 그다음 센 순서
    const fams = Object.keys(v.mons).sort((a, b) => (evoReady(b, v.mons[b]) ? 1 : 0) - (evoReady(a, v.mons[a]) ? 1 : 0) || powerOf(v.mons[b]) - powerOf(v.mons[a]));
    const evoN = fams.filter((f) => evoReady(f, v.mons[f])).length;
    $('mon-count').textContent = fams.length + '가족' + (evoN ? ' · ✨ 진화 ' + evoN : '');
    $('mon-count').className = 'chip' + (evoN ? ' chip-evo' : '');
    if (ui.tab === 'dex' && ui.seg.dex === 'mons') {
      renderPaged('mon-grid', fams.map((f) => monCardHTML(v, f)), { w: 104, h: 128, gap: 8, cols: 3, rows: 2, maxCols: 8, empty: '아직 포켓몬이 없어요. 🏪 뽑기나 🌳 풀숲에서 만나요!' });
    }
    $('badge-count').textContent = badgeCount(v) + ' / 8';
    setHTML('shelf', GYM_ORDER.map((cid) => {
      const c = COMP[cid];
      const won = !!v.won[cid];
      return '<div class="slot"><div class="medal ' + (won ? 'mbg-' + cid : 'empty') + '" aria-hidden="true">' + c.icon + '</div>' +
        '<div class="city">' + esc(c.town) + '</div><div class="boss opt1">' + esc(c.boss) + '</div></div>';
    }).join(''));
    setHTML('champ-info', champHTML(v));
    const certN = RING.filter((c) => v.certs[c]).length;
    $('cert-count').textContent = certN + ' / 8';
    setHTML('cert-grid', certsHTML(v));
    const seen = SPECIES_KEYS.filter((k) => v.dex[k]).length;
    $('dex-count').textContent = seen + ' / ' + SPECIES_KEYS.length + '종';
    if (ui.tab === 'dex' && ui.seg.dex === 'dex') {
      renderPaged('dex-grid', SPECIES_KEYS.map((k) => {
        const s = SP[k];
        return '<div class="dex-cell' + (v.dex[k] ? '' : ' unseen') + '">' + visHTML(k, 'sm') + '<div class="nm">' + esc(s.name) + '</div><div class="no">No.' + pad3(s.dex) + '</div></div>';
      }), { w: 62, h: 80, gap: 6, cols: 5, rows: 4, maxCols: 12 });
    }
  }

  /* =========================================================
     11-2. 화면 — 내 포켓몬 자세히 · 진화 미리 보기 · 진화 장면
     진화는 내가 고를 때만 해요. 미리 보기에서 세지는 것을 보고 → ✨ 진화하기 → 반짝반짝 진화 장면.
     진화 장면 중간에 ✋ 그만! 을 누르면 지금 모습 그대로예요 (나중에 다시 할 수 있어요).
     ========================================================= */
  const EV_STOP = { stop: true };
  const evoFx = { on: false, stop: false, rej: null, busy: false };

  // ── 내 포켓몬 자세히 (도감 카드를 누르면) ──
  function evoCondHTML(fam, m) {
    const lvOk = m.lv >= evoLv(m);
    const gOk = m.gauge >= 3;
    return '<div class="md-conds">' +
      '<span class="cond' + (lvOk ? ' ok' : '') + '">📈 Lv.' + evoLv(m) + (lvOk ? ' ✅' : ' <small>지금 ' + m.lv + '</small>') + '</span>' +
      '<span class="or">또는</span>' +
      '<span class="cond' + (gOk ? ' ok' : '') + '">🎰 합체 ' + '●'.repeat(Math.min(3, m.gauge)) + '○'.repeat(Math.max(0, 3 - m.gauge)) + (gOk ? ' ✅' : ' <small>' + m.gauge + '/3</small>') + '</span></div>';
  }
  function monDetailHTML(fam) {
    const v = viewer();
    const m = v.mons[fam];
    if (!m) return '';
    const s = SP[m.sp];
    const on = v.partner === fam;
    const opts = evoTargets(fam, m);
    const ready = evoReady(fam, m);
    const xpR = m.lv >= MAX_LV ? 1 : clamp((m.xp || 0) / xpNeed(m.lv), 0, 1);
    let evo;
    if (!opts.length) {
      evo = '<div class="md-evo final"><b>👑 마지막 모습이에요</b><span>별 ' + '⭐'.repeat(m.stars) + '<span class="star-off">' + '☆'.repeat(MAX_STARS - m.stars) + '</span> · 뽑기에서 같은 친구를 또 만나면 별이 늘어요 (⚡+' + STAR_POWER + ')</span></div>';
    } else {
      const pics = opts.length > 1 ? '<span class="md-many">' + opts.map((sp) => miniEm(sp, 'xs')).join('') + '</span>' : miniEm(opts[0], '', true);
      evo = '<div class="md-evo' + (ready ? ' ready' : '') + '">' +
        '<div class="md-evo-row">' + miniEm(m.sp, '', true) + '<span class="md-arrow" aria-hidden="true">➜</span>' + pics +
          '<b>' + (opts.length > 1 ? '5가지 모습 중에서 골라요' : esc(SP[opts[0]].name)) + '</b></div>' +
        evoCondHTML(fam, m) +
        (ready ? '<button class="btn-evo" type="button" data-act="open-evo" data-fam="' + fam + '">✨ 진화 미리 보기</button>'
          : '<div class="caption">둘 중 하나가 되면 진화할 수 있어요. 진화는 내가 고를 때만 해요!</div>') +
      '</div>';
    }
    const strong = strongVs(s.type);
    const weak = weakTo(s.type);
    return head('calm', '🐾', '내 포켓몬 · No.' + pad3(s.dex)) +
      '<div class="sheet-body md"><div class="md-l">' +
      '<div class="md-top">' + visHTML(m.sp, 'md-vis', true) +
        '<div class="md-txt"><h2 class="sheet-title">' + esc(s.name) + (m.stars ? ' <small>' + '⭐'.repeat(m.stars) + '</small>' : '') + '</h2>' +
        '<div class="md-chips">' + typeChip(s.type) + '<span class="chip">Lv.' + m.lv + '</span>' + (on ? '<span class="chip chip-good">🐾 내 말</span>' : '') + '</div>' +
        '<div class="md-stats"><span>⚡ 공격 <b>' + powerOf(m) + '</b></span><span>❤️ 체력 <b>' + hpOf(m) + '</b></span></div>' +
        '<div class="mon-xp" title="경험치"><i style="width: ' + Math.round(xpR * 100) + '%"></i></div>' +
        '<div class="mon-xp-t">' + (m.lv >= MAX_LV ? '최고 레벨!' : '경험치 ' + (m.xp || 0) + ' / ' + xpNeed(m.lv) + ' · 기술 ' + esc(moveOf(m.sp, m.lv))) + '</div></div></div>' +
      '</div><div class="md-r">' + evo +
      '<div class="md-match">' +
        '<div class="mm-row good"><span class="mm-l">⚔️ 잘 때려요</span><span class="mm-t">' + (strong.length ? tIcons(strong) + '<small>효과 굉장 ×1.5</small>' : '<small>특별히 센 타입은 없어요</small>') + '</span></div>' +
        '<div class="mm-row bad"><span class="mm-l">🛡️ 조심해요</span><span class="mm-t">' + (weak.length ? tIcons(weak) + '<small>맞으면 ×1.5 아파요</small>' : '<small>약점이 없어요</small>') + '</span></div></div>' +
      '<div class="btn-row">' + (on ? '<button class="btn" type="button" disabled>🐾 지금 내 말이에요</button>' : '<button class="btn btn-buy" type="button" data-act="set-partner" data-fam="' + fam + '">🐾 내 말로 하기</button>') +
        '<button class="btn btn-muted" type="button" data-act="close-sheet">닫기</button></div>' +
      '</div></div>';
  }

  // ── 진화 미리 보기: 무엇이 세지는지 먼저 보고 골라요 ──
  function statRow(label, a, b, max) {
    const d = b - a;
    const w0 = Math.round(clamp(a / max, 0, 1) * 100);
    const w1 = Math.round(clamp(b / max, 0, 1) * 100);
    return '<div class="es-row"><span class="es-l">' + label + '</span>' +
      '<span class="es-bar" aria-hidden="true"><i class="b1" style="width: ' + w1 + '%"></i><i class="b0" style="width: ' + w0 + '%"></i></span>' +
      '<span class="es-v">' + a + ' → <b>' + b + '</b>' + (d ? '<em class="' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '+' : '−') + Math.abs(d) + '</em>' : '') + '</span></div>';
  }
  function evoSheetHTML(s) {
    const v = viewer();
    const fam = s.fam;
    const m = v.mons[fam];
    if (!m) return '';
    const opts = evoTargets(fam, m);
    if (!opts.length) return '';
    const ready = evoReady(fam, m);
    const rec = fam === 'eevee' ? eeveeForm(v) : opts[0];
    const to = opts.indexOf(s.to) >= 0 ? s.to : opts.length === 1 ? opts[0] : rec;
    s.to = to;
    const cur = SP[m.sp];
    const nx = SP[to];
    const a0 = powerOf(m);
    const a1 = atkOf(to, m.lv, m.stars);
    const h0 = hpOf(m);
    const h1 = hpMaxOf(to, m.lv, m.stars);
    const mv0 = moveOf(m.sp, m.lv);
    const mv1 = moveOf(to, m.lv);
    const after = FAMILIES[fam][m.stage + 2];
    const maxA = Math.max(a1, a0) * 1.12;
    const maxH = Math.max(h1, h0) * 1.12;
    const typeRow = cur.type === nx.type
      ? '<div class="es-row"><span class="es-l">🎨 타입</span><span class="es-line">' + typeChip(cur.type) + ' 그대로</span></div>'
      : '<div class="es-row hot"><span class="es-l">🎨 타입</span><span class="es-line">' + typeChip(cur.type) + ' → ' + typeChip(nx.type) + ' <b class="es-new">바뀌어요!</b></span></div>' +
        '<div class="es-sub">⚔️ 새로 잘 때려요 ' + (strongVs(nx.type).length ? tIcons(strongVs(nx.type)) : '없음') + ' · 🛡️ 조심 ' + (weakTo(nx.type).length ? tIcons(weakTo(nx.type)) : '없음') + '</div>';
    const moveRow = mv0 === mv1
      ? '<div class="es-row"><span class="es-l">💥 기술</span><span class="es-line">' + esc(mv0) + ' 그대로</span></div>'
      : '<div class="es-row hot"><span class="es-l">💥 기술</span><span class="es-line">' + esc(mv0) + ' → <b>' + esc(mv1) + '</b> <b class="es-new">새 기술!</b></span></div>';
    const keep = '<div class="es-row calm"><span class="es-l">⭐ 그대로</span><span class="es-line">Lv.' + m.lv + ' · 경험치' + (m.stars ? ' · 별 ' + m.stars + '개' : '') + ' · 배틀 기록</span></div>';
    const nextLine = after
      ? '<div class="es-row calm"><span class="es-l">🌟 다음</span><span class="es-line">' + miniEm(after, 'xs') + esc(SP[after].name) + ' (Lv.' + EVO_LV[m.stage + 1] + ' 또는 합체 3마리)</span></div>'
      : '<div class="es-row calm"><span class="es-l">👑 마지막</span><span class="es-line">' + esc(nx.name) + iga(nx.name) + ' 마지막 모습이에요</span></div>';
    const why = m.gauge >= 3 ? '🎰 같은 가족 3마리가 합체해서' : '📈 Lv.' + evoLv(m) + '이 돼서';
    const pick = opts.length > 1
      ? '<div class="ep-title">어떤 모습으로 진화할까요? <small>이브이는 골라서 진화해요</small></div><div class="evo-pick">' + opts.map((sp) =>
        '<button class="ep' + (sp === to ? ' on' : '') + '" type="button" data-act="evo-pick" data-fam="' + fam + '" data-to="' + sp + '" aria-pressed="' + (sp === to) + '">' + miniEm(sp, '', sp === to) +
        '<b>' + esc(SP[sp].name) + '</b><small>' + tName(SP[sp].type) + '</small>' + (sp === rec ? '<i class="ep-rec">📈 추천</i>' : '') + '</button>').join('') + '</div>' +
        (rec !== 'sylveon' ? '<div class="caption">📈 추천 = 내가 주식을 가장 많이 가진 회사 타입이에요</div>' : '')
      : '';
    return head('evo', '✨', '진화 미리 보기') +
      '<div class="sheet-body ev-sheet"><div class="ev-l">' +
      '<h2 class="sheet-title">' + esc(cur.name) + iga(cur.name) + ' 진화할 수 있어요!</h2>' +
      '<div class="caption">' + why + ' 진화 준비가 됐어요. 진화하면 이렇게 세져요 👇</div>' +
      '<div class="evo-vs">' + visHTML(m.sp, 'sm', true) + '<span class="evo-arrow" aria-hidden="true">✨➜</span>' + visHTML(to, 'sm', true) + '</div>' +
      pick + '</div><div class="ev-r">' +
      '<div class="evo-stats">' + statRow('⚡ 공격', a0, a1, maxA) + statRow('❤️ 체력', h0, h1, maxH) + typeRow + moveRow + keep + nextLine + '</div>' +
      (ready
        ? '<div class="btn-row ev-btns"><button class="btn btn-muted" type="button" data-act="close-sheet">나중에 할래요</button>' +
          '<button class="btn-evo" type="button" data-act="evo-go" data-fam="' + fam + '" data-to="' + to + '">✨ ' + esc(nx.name) + euro(nx.name) + ' 진화!</button></div>' +
          '<div class="caption" style="text-align: center">지금 모습이 좋으면 안 해도 돼요. 언제든 도감에서 다시 할 수 있어요.</div>'
        : evoCondHTML(fam, m) + '<button class="btn btn-muted" type="button" data-act="close-sheet">닫기</button>') +
      '</div></div>';
  }

  // ── 진화 장면 ──
  function evoImg(sp, cls) {
    const s = SP[sp];

    if (a) return '<img class="ev-img ' + cls + '" src="' + a.src + '" data-dex="' + s.dex + '" data-sp="' + sp + '" data-anim="' + a.key + '" data-h="' + a.h + '" alt="' + esc(s.name) + '" draggable="false">';

    return '<div class="ev-img ev-emb t-' + s.type + ' ' + cls + '" role="img" aria-label="' + esc(s.name) + '">' + TYPES[s.type].icon + '</div>';

  function sizeEvoImgs() {
    const stage = $('ev-stage');
    if (!stage) return;
    const H = stage.clientHeight;
    stage.querySelectorAll('img.ev-img').forEach((im) => {
      const h = im.dataset.h ? clamp(+im.dataset.h * (H / 120), H * 0.42, H * 0.82) : H * 0.74;

  }
  function evWait(ms) {
    return new Promise((res, rej) => {
      if (evoFx.stop) { rej(EV_STOP); return; }
      const t = setTimeout(() => { evoFx.rej = null; if (evoFx.stop) rej(EV_STOP); else res(); }, reduceMotion ? Math.min(ms, 60) : ms);
      evoFx.rej = () => { clearTimeout(t); evoFx.rej = null; rej(EV_STOP); };
    });
  }
  const evSay = (t) => { const p = document.querySelector('#ev-text p'); if (p) p.textContent = t; };
  function evAnim(el, frames, opt) {
    if (!el || !el.animate || reduceMotion) return { finished: Promise.resolve() };
    try { return el.animate(frames, Object.assign({ fill: 'forwards' }, opt)); } catch (e) { return { finished: Promise.resolve() }; }
  }
  function evSpark(n, big) {
    const fxBox = $('ev-fx');
    const st = $('ev-stage');
    if (!fxBox || !st || reduceMotion) return;
    const W = st.clientWidth;
    const H = st.clientHeight;
    const chars = ['✨', '⭐', '💫', '✦'];
    for (let i = 0; i < n; i++) {
      const el = document.createElement('span');
      el.className = 'ev-p';
      el.textContent = chars[i % chars.length];
      el.style.fontSize = (big ? 18 + Math.random() * 18 : 12 + Math.random() * 10) + 'px';
      fxBox.appendChild(el);
      const ang = Math.random() * Math.PI * 2;
      const r0 = big ? 10 : 40 + Math.random() * 40;
      const r1 = big ? 90 + Math.random() * Math.min(W, H) * 0.45 : r0 + 20;
      const x0 = W / 2 + Math.cos(ang) * r0;
      const y0 = H / 2 + Math.sin(ang) * r0 * (big ? 1 : 0.6) + (big ? 0 : 40);
      const x1 = W / 2 + Math.cos(ang) * r1;
      const y1 = big ? H / 2 + Math.sin(ang) * r1 : y0 - 80 - Math.random() * 60;
      const a = evAnim(el, [
        { transform: 'translate(' + x0 + 'px, ' + y0 + 'px) translate(-50%, -50%) scale(0.3)', opacity: 0 },
        { transform: 'translate(' + ((x0 + x1) / 2) + 'px, ' + ((y0 + y1) / 2) + 'px) translate(-50%, -50%) scale(1)', opacity: 1, offset: 0.4 },
        { transform: 'translate(' + x1 + 'px, ' + y1 + 'px) translate(-50%, -50%) scale(0.6)', opacity: 0 },
      ], { duration: big ? 900 + Math.random() * 500 : 1100 + Math.random() * 600, delay: big ? 0 : Math.random() * 500, easing: 'ease-out' });
      Promise.resolve(a.finished).then(() => el.remove(), () => el.remove());
    }
  }
  function evRing(color, size) {
    const fxBox = $('ev-fx');
    const st = $('ev-stage');
    if (!fxBox || !st || reduceMotion) return;
    const el = document.createElement('span');
    el.className = 'ev-ring';
    el.style.cssText = 'width: ' + size + 'px; height: ' + size + 'px; margin: ' + -size / 2 + 'px 0 0 ' + -size / 2 + 'px; left: 50%; top: 50%; border-color: ' + color + ';';
    fxBox.appendChild(el);
    const a = evAnim(el, [{ transform: 'scale(0.3)', opacity: 1 }, { transform: 'scale(1.8)', opacity: 0 }], { duration: 700, easing: 'ease-out' });
    Promise.resolve(a.finished).then(() => el.remove(), () => el.remove());
  }
  // 숫자가 촤르륵 올라가요
  function countUp(el, a, b, ms) {
    if (!el) return;
    if (reduceMotion) { el.textContent = b; return; }
    const t0 = performance.now();
    const step = (t) => {
      const k = clamp((t - t0) / ms, 0, 1);
      el.textContent = Math.round(a + (b - a) * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  async function playEvolution(fam, to) {
    if (evoFx.on || ui.busy) return;
    const v = viewer();
    const m = v.mons[fam];
    if (!m || !evoReady(fam, m)) { toast('지금은 진화할 수 없어요'); return; }
    const from = m.sp;
    const fn = SP[from].name;
    const tn = SP[to].name;
    const before = { atk: powerOf(m), hp: hpOf(m), mv: moveOf(from, m.lv), type: SP[from].type };
    // 미리 보기 판은 닫고 진화 장면을 열어요
    ui.sheets = ui.sheets.filter((x) => x.k !== 'evo');
    renderSheet();
    evoFx.on = true;
    evoFx.stop = false;
    ui.evoFx = true;
    const box = $('evo');
    box.innerHTML = '<div class="ev-bg" aria-hidden="true"><div class="ev-rays"></div></div>' +
      '<div class="ev-stage" id="ev-stage"><div class="ev-glow" id="ev-glow" aria-hidden="true"></div>' +
        '<div class="ev-mon" id="ev-old">' + evoImg(from, 'old') + '</div>' +

      '<div class="ev-flash" id="ev-flash" aria-hidden="true"></div>';
    box.hidden = false;
    document.body.classList.add('locked');

    const oldEl = $('ev-old');
    const newEl = $('ev-new');

    try {
      evSay('어라…? ' + fn + '의 모습이…!');

      // 하얗게 빛나요
      evAnim(oldEl, [{ filter: 'brightness(1)' }, { filter: WHITE }], { duration: 900, easing: 'ease-in' });
      evAnim($('ev-glow'), [{ opacity: 0, transform: 'scale(0.6)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 900 });
      evSpark(14, false);
      await evWait(1000);
      newEl.style.filter = WHITE;
      // 두 모습이 번갈아 보여요 (점점 빠르게)
      const iv = [430, 380, 330, 290, 250, 215, 185, 160, 135, 115, 100, 88, 76, 66, 58, 52, 48, 44];
      for (let i = 0; i < iv.length; i++) {
        const showNew = i % 2 === 0;
        oldEl.style.opacity = showNew ? '0' : '1';
        newEl.style.opacity = showNew ? '1' : '0';
        evAnim(showNew ? newEl : oldEl, [{ transform: 'scale(0.86)' }, { transform: 'scale(1)' }], { duration: Math.min(220, iv[i]), easing: 'ease-out', fill: 'none' });
        if (i % 3 === 0) evRing(i % 2 ? '#fde68a' : '#ffffff', 180);

      }
    } catch (e) {
      if (e !== EV_STOP) { try { console.warn('evo', e); } catch (e2) { /* 무시 */ } }
      // ✋ 그만! → 지금 모습 그대로
      newEl.style.opacity = '0';
      oldEl.style.opacity = '1';
      oldEl.getAnimations && oldEl.getAnimations().forEach((a) => a.cancel());
      oldEl.style.filter = '';
      const g = $('ev-glow');
      if (g) { g.getAnimations && g.getAnimations().forEach((a) => a.cancel()); g.style.opacity = '0'; }
      evSay('어라? 진화가 멈췄어요. ' + fn + eunneun(fn) + ' 지금 모습 그대로예요!');
      $('ev-btns').innerHTML = '<div class="ev-note">진화는 언제든 도감에서 다시 할 수 있어요 🙂</div><button class="btn-primary ev-ok" type="button" data-act="evo-done">확인</button>';

    }
    // 진화! (여기서 진짜로 바뀌어요)

    const flash = $('ev-flash');

    await sleep(reduceMotion ? 0 : 300);

    const mm = viewer().mons[fam];
    const after = { atk: powerOf(mm), hp: hpOf(mm), mv: moveOf(to, mm.lv), type: SP[to].type };
    evSay('축하해요! ' + fn + iga(fn) + ' ' + tn + euro(tn) + ' 진화했어요! 🎉');
    $('evo').classList.add('done');

    $('ev-btns').innerHTML = '<div class="ev-stats">' +
        '<div class="evs"><span>⚡ 공격</span><b id="evs-atk">' + before.atk + '</b><em>+' + (after.atk - before.atk) + '</em></div>' +

  }

  async function runUploads(jobs) {
    if (pm.busy || !jobs.length) return;
    if (!canImg()) { toast('🔒 이 화면에서는 그림을 넣을 수 없어요.'); return; }
    pm.busy = true;
    pm.total = jobs.length;
    pm.progress = 0;
    pm.note = '';

    pm.resume = null;
    if (ui.panel === 'parent') renderPanel();
    showProgress();
    let pending = {};
    let done = 0;
    let i = 0;
    const flush = async () => {
      const keys = Object.keys(pending);
      if (!keys.length) return;
      const batch = pending;
      pending = {};
      await saveImages(batch);
      done += keys.length;
    };
    try {
      for (; i < jobs.length; i++) {
        const out = await jobs[i].make();
        if (out && out.blob) {
          const id = await uploadBlob(out.blob, out.type);
          if (id) pending[jobs[i].dex] = id;
        }
        pm.progress = i + 1;
        showProgress();
        if (Object.keys(pending).length >= 6) await flush();
      }
      await flush();
      pm.ok = true;
      pm.note = '✅ ' + done + '마리 그림을 넣었어요! 모든 폰의 게임에 나와요.';

  }

    const list = manual ? SPECIES_KEYS : SPECIES_KEYS.filter((k) => rectOf(k));
    if (!list.length) {
      box.innerHTML = '<div class="caption" style="grid-column: 1 / -1">칸 안에 게임에 나오는 포켓몬 번호가 없어요. 첫 칸 번호와 칸 수를 확인해 주세요.</div>';
      updateSplitStatus();
      return;
    }
    box.innerHTML = list.map((k) => {
      const s = SP[k];
      const r = rectOf(k);
      const cls = 'img-cell split-cell' + (split.skip[s.dex] ? ' off' : '') + (split.sel === k ? ' sel' : '') + (split.manual[s.dex] ? ' manual' : '') + (r ? '' : ' none');
      return '<button class="' + cls + '" type="button" data-act="split-cell" data-sp="' + k + '"><span class="thumb" data-thumb="' + k + '">' +
        (r ? '' : '<span class="mini-em t-' + s.type + '" aria-hidden="true">' + TYPES[s.type].icon + '</span>') + '</span>' +
        '<span class="nm">' + esc(s.name) + '</span><span class="no">No.' + pad3(s.dex) + (split.manual[s.dex] ? ' ✍️' : '') + (split.skip[s.dex] ? ' ✕' : '') + '</span></button>';
    }).join('');
    const jobs = list.filter((k) => rectOf(k));
    const token = ++thumbToken;
    let i = 0;
    const step = () => {
      if (token !== thumbToken) return;
      const t0 = performance.now();
      while (i < jobs.length && performance.now() - t0 < 24) {
        const k = jobs[i++];
        const slot = box.querySelector('[data-thumb="' + k + '"]');
        if (!slot) continue;
        const cv = processCrop(rectOf(k), 96);
        slot.textContent = '';
        slot.appendChild(cv);
      }
      if (i < jobs.length) setTimeout(step, 0);
    };
    step();
    updateSplitStatus();
  }
  function scheduleThumbs() {
    clearTimeout(thumbTimer);
    thumbTimer = setTimeout(renderThumbs, 280);
  }
  function onSplitInput(el) {
    const f = el.dataset.field;
    if (!f || !split.im) return;
    if (f === 'clear') split.clear = !!el.checked;
    else {
      let v = Number(el.value);
      if (!isFinite(v)) return;
      if (f === 'cols') v = clamp(Math.round(v), 1, 60);
      else if (f === 'rows') v = clamp(Math.round(v), 1, 200);
      else if (f === 'start') v = clamp(Math.round(v), 1, 1025);
      else if (f === 'sprite') v = clamp(v, 30, 100);
      else if (f === 'inset') v = clamp(v, 0, 20);
      else if (f === 'L' || f === 'R') v = clamp(v, 0, split.W * 0.9);
      else v = clamp(v, 0, split.H * 0.9);
      split[f] = v;
      const out = document.querySelector('[data-out="' + f + '"]');
      if (out) out.textContent = Math.round(v);
    }
    drawSplit();
    scheduleThumbs();
  }

        const dup = !!(sp && seen[sp]);
        if (sp) seen[sp] = true;
        return { f, name: f.name, sp: dup ? null : sp, dup };
      });
      pm.note = '';
      pm.resume = null;
      renderPanel();
    }),
    'multi-save': () => {
      const list = (pm.multi || []).filter((x) => x.sp);
      pm.multi = null;
      runUploads(list.map((x) => ({ dex: SP[x.sp].dex, make: () => prepareFile(x.f) })));
    },
    'multi-cancel': () => { pm.multi = null; renderPanel(); },
    'img-grid-mode': (el) => { pm.gridMode = el.dataset.mode === 'delete' ? 'delete' : 'replace'; renderPanel(); },
    'img-one': (el) => {
      const k = el.dataset.sp;
      if (!SP[k]) return;
      if (pm.busy) { toast('⏳ 그림을 넣는 중이에요'); return; }
      const dex = SP[k].dex;
      if (pm.gridMode === 'delete') {
        if (!IMG[dex]) { toast(EMBED[dex] ? '기본 그림은 그대로 둬요. 직접 넣은 그림만 지울 수 있어요.' : '지울 그림이 없어요', 3000); return; }
        confirmBox('🗑️ 그림 지우기', '<b>' + esc(SP[k].name) + '</b>에 직접 넣은 그림을 지울까요? ' + (EMBED[dex] ? '기본 그림으로 돌아가요.' : '타입 아이콘으로 돌아가요.'), '지우기', async () => {
          try {
            const upd = {};
            upd[dex] = null;
            await saveImages(upd);
            toast('🗑️ ' + SP[k].name + ' 그림을 지웠어요');
          } catch (e) {
            toast('지우지 못했어요. 잠시 뒤 다시 해 주세요.');
          }
          render(true);
          renderPanel();
        });
        return;
      }
      pickFiles(false, (files) => runUploads([{ dex, make: () => prepareFile(files[0]) }]));
    },
    'up-resume': () => {
      const jobs = pm.resume;
      pm.resume = null;
      if (jobs && jobs.length) runUploads(jobs);
    },
  };

  let swipedAt = 0;
  function onClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (Date.now() - swipedAt < 350 && el.closest('[data-swipe]')) { e.preventDefault(); return; }
    const h = HANDLERS[el.dataset.act];
    if (!h) return;
    e.preventDefault();
    h(el, e);
  }
  function onKey(e) {
    if (bt.on) {
      if (e.key === 'Escape') { battleSkip(); return; }
      if ((e.key === 'Enter' || e.key === ' ') && !(e.target && e.target.closest && e.target.closest('button'))) { e.preventDefault(); battleTap(); }
      return;
    }
    if (evoFx.on) {
      if (e.key === 'Escape') { if (!$('evo').querySelector('.ev-ok')) stopEvolution(); else closeEvoFx(); }
      return;
    }
    if (e.key === 'Escape') {
      if (!$('modal').hidden) { closeModal(); return; }
      if (!$('reveal').hidden) { ui.reveal = null; renderShopTab(); return; }
      if (!$('tierup').hidden) { dispatch('seenTier'); return; }
      if (ui.panel) { if (ui.panel === 'split') HANDLERS['split-close'](); else closePanel(); return; }
      if (ui.sheets.length) closeSheet();
      return;
    }
    const t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.dataset && HANDLERS[t.dataset.act]) {
      e.preventDefault();
      HANDLERS[t.dataset.act](t, e);
    }
  }
  function bindEvents() {
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    document.addEventListener('error', onImgError, true);
    document.addEventListener('toggle', (e) => {
      const t = e.target;
      if (!t || !t.dataset) return;
      if (t.id === 'img-more') pm.gridOpen = t.open;
      if (t.dataset.keep) ui.open[t.dataset.keep] = t.open;
    }, true);
    document.addEventListener('input', (e) => { if (e.target && e.target.dataset && e.target.dataset.field) onSplitInput(e.target); });
    document.addEventListener('change', (e) => { if (e.target && e.target.dataset && e.target.dataset.field === 'clear') onSplitInput(e.target); });
    let sw = null;
    document.addEventListener('pointerdown', (e) => {
      const g = e.target.closest && e.target.closest('[data-swipe]');
      sw = g ? { id: g.dataset.swipe, x: e.clientX, y: e.clientY, t: Date.now() } : null;
    }, { passive: true });
    document.addEventListener('pointerup', (e) => {
      if (!sw) return;
      const dx = e.clientX - sw.x;
      const dy = e.clientY - sw.y;
      const id = sw.id;
      sw = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        swipedAt = Date.now();
        turnPage(id, dx < 0 ? 1 : -1);
      }
    }, { passive: true });
    $('modal-ok').addEventListener('click', confirmModal);
    $('modal-cancel').addEventListener('click', closeModal);
    $('modal-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); confirmModal(); } });
    $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });
    $('sheet').addEventListener('click', (e) => { if (e.target === $('sheet') && ui.sheets.length) closeSheet(); });
    // 배틀 화면을 누르면 글이 빨리 넘어가요
    $('battle').addEventListener('click', (e) => { if (bt.on && !e.target.closest('button')) battleTap(); });
    // 지도: 손으로 밀면 잠깐 말 따라가기를 멈춰요
    const stage = $('stage');
    stage.addEventListener('scroll', onStageScroll, { passive: true });
    ['pointerdown', 'touchstart', 'wheel'].forEach((ev) => stage.addEventListener(ev, () => { board.touching = true; }, { passive: true }));
    ['pointerup', 'pointercancel', 'touchend'].forEach((ev) => stage.addEventListener(ev, () => { setTimeout(() => { board.touching = false; }, 400); }, { passive: true }));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (store.st) sizeStage(true); });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) cloudFlushNow();
      else if (store.st && !ui.anim) render();
    });
    window.addEventListener('pagehide', cloudFlushNow);
    let rt = 0;
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => {
        if (ui.panel === 'split') drawSplit();
        if (store.st) { sizeStage(true); render(); renderSheet(); }
        if (bt.on) layoutBattle();
        if (evoFx.on) sizeEvoImgs();
      }, 160);
    });
    // 1시간이 지나면 주사위가 다시 채워져요 (남은 분도 1분마다 고쳐요)
    setInterval(() => { if (store.st && !document.hidden && !ui.anim && !ui.busy) { renderStatus(); renderRoll(); renderTurnBox(); } }, 30000);
  }

  // ── 시작 ──
  async function initCaps(fresh) {
    try {
      const all = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('assets')]);
      caps.db = all[0] || null;
      caps.user = all[1] || null;
      caps.assets = all[2] || null;
    } catch (e) { /* 저장 기능 없이도 게임은 돼요 */ }
    if (caps.db) { try { initImages(); } catch (e) { /* 그림 없이도 돼요 */ } }
    if (caps.db && caps.user) {
      try { caps.uid = await caps.user.id(); } catch (e) { caps.uid = null; }
    }
    if (caps.db && caps.uid) {
      try {
        const ref = caps.db.doc('data/users/' + caps.uid + '/pokemon-game-v3');
        const snap = await getWithRetry(ref);
        cloud.ref = ref;
        const body = snap && snap.exists ? snap.data() : null;
        const remote = body && body.state ? sanitize(JSON.parse(JSON.stringify(body.state))) : null;
        if (remote && remote.savedAt > localState.savedAt) {
          localState = remote;
          writeLocal();
          if (store.mode === 'local') {
            store.st = localState;
            resetUiForState();
            render(true);
            toast('☁️ 저장해 둔 게임을 불러왔어요!');
          }
        } else if (!remote && fresh && !localState.importedOld && !localState.rev) {
          const old = await getWithRetry(caps.db.doc('data/users/' + caps.uid + '/pokemon-game'));
          const ob = old && old.exists ? old.data() : null;
          if (ob && isObj(ob.state) && !localState.rev && importOld(ob.state, localState)) {
            saveLocal();
            render(true);
            toast('📦 예전 게임에서 돈과 포켓몬을 가져왔어요!', 3600);
          }
        } else if (localState.savedAt > 0 && (!remote || localState.savedAt > remote.savedAt)) {
          cloudQueue(0);
        }
      } catch (e) {
        cloud.ref = null;
      }
    }
    const saved = netSaved();
    if (saved && caps.db) {
      try {
        const ok2 = await openRoom(saved.code, saved.pid);
        if (ok2) {
          resetUiForState();
          toast('📱 같이 하던 방 ' + saved.code + '에 다시 들어왔어요');
        } else {
          local.del(ONLINE_KEY);
        }
      } catch (e) { /* 다음에 다시 */ }
    }
    updateSaveBadge();
    onState();
    if (!cloud.ref && !local.ok && store.mode === 'local') toast('⚠️ 이 화면에서는 저장이 안 돼요. 창을 닫으면 처음부터 시작해요.', 4200);
  }
  function init() {
    if (DRAFT) { const t = document.querySelector('.wallet-title'); if (t) t.insertAdjacentHTML('afterbegin', '<span class="draft-chip">초안</span> '); }
    local.ok = local.test();
    deviceId();
    let st = sanitize(readJSON(SAVE_KEY));
    let fresh = false;
    if (!st) {
      fresh = true;
      st = newGame();
      const old = readJSON(OLD_SAVE_KEY);
      if (old && importOld(old, st)) {
        localState = st;
        saveLocal();
        setTimeout(() => toast('📦 예전 게임에서 돈과 포켓몬을 가져왔어요!', 3600), 400);
      }
    }
    localState = st;
    store.st = st;
    store.mode = 'local';
    resetUiForState();
    bindEvents();
    applySegs();
    render(true);
    probeSprites();
    if (IN_CLAUDE) initCaps(fresh);
    else if (!local.ok) toast('⚠️ 이 화면에서는 저장이 안 돼요. 창을 닫으면 처음부터 시작해요.', 4200);
  }
  init();
})();
</script>
<script>
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
